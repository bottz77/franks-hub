 (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-02-01", "title": "JJHC Varsity Practice — February 1, 2027", "focus": "Skating edges, gaps & retrievals", "time": "8:30 PM–9:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — February 1, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>February 1, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:30 PM–9:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Skating edges, gaps &amp; retrievals<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|systems<\/h3>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<h3>Station 2 — skills|contact<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h3>Station 3 — contact|warm-up<\/h3>\n<p><strong>Partner Bump / Controlled Contact Confidence<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=aXQlcDUcGKE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=aXQlcDUcGKE<\/a><\/li><li>Video note: YouTube equivalent — Tursi, \"Jets 2v2 drill.\" IHS 2v2 rush drill on YouTube (Jets 2v2). Not the Pioneer 1v1-to-2v2 progression; same 2v2 rush work.<\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>The Box Game - Give &amp; Go Small Area Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Small-area give-and-go game inside a marked box. Score by connecting give-and-goes or hitting a target rule set by the coach. Cue pass-and-move immediately; sticks on ice for support.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=gcgkBs58qFk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=gcgkBs58qFk<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"The Box Game - Give &amp; Go Small Area Hockey Game.\" Official IHS give-and-go small-area game. Not the NZ-only version; same give-and-go / move-after-the-pass habit.<\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Road Runner 3 v 2<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Road Runner 3v2 Overview: Road Runner 3v2 is a high-tempo, continuous rush drill that reinforces key rush principles for both offense and defense. It challenges attackers to make quick decisions off the rush, encourages defenders to manage gaps and sort responsibilities, and teaches the importance of F3 tracking through the neutral zone to kill plays from above. Setup Coach starts with a puck near the top of the circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=qGm4xRS8Rkk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=qGm4xRS8Rkk<\/a><\/li><li>Video note: YouTube equivalent — Wally Kozak, \"Leafs Continuous 3 on 2.\" Darryl Belfry continuous 3-on-2 rush. Not Road Runner 3v2; same high-tempo continuous 3v2 rush work.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Skating edges, gaps &amp; retrievals<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Liam's station — Station 1: *Use The Net 2 on 1 Hockey Drill*.<\/strong> Every rush goes into Liam's end; alternate start corners and send one 2-on-1 every ~20 s so he can set and track the late attacker. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 2: *1 on 1 Tips for Hockey Players: The Attack Position<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 3: *Partner Bump / Controlled Contact Confidence<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (Pioneer 2 V 2 Rush)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">2v2 Tight Area in Corner (1 Goalie)<\/a>. Net angled in the corner, dividers box the area; 2v2, 45-s shifts, keep score. Tonight's constraint: coach spots pucks into the corner — first player must win it with a protected retrieval (back to pressure) before a pass. <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>*The Box Game - Give &amp; Go Small Area Hockey Game* is already goalie-free, so keeping it as written is fine; use the one-net game above when you want Liam in the SAG block.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Road Runner 3 v 2* → Rushes go only into Liam's end; the return rush finishes with a pass through a cone gate at the far blue line instead of a shot. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">Horseshoe Regroup 2-on-1 (one goalie)<\/a>. Shot + rebound, then a D-to-D regroup that turns into a 2-on-1 back into Liam's same net (the step-up D must recover his gap). Theme rule: forwards must make the regroup pass on their edges (C-cut, then pass) before the 2-on-1. <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *3 vs 1 Keep Away From Battery Hockey* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots come in stride off the retrieval only — no stop-and-blast; one shot max per retrieval rep.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-02-03", "title": "JJHC Varsity Practice — February 3, 2027", "focus": "Passing support & give-and-go", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — February 3, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>February 3, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Passing support &amp; give-and-go<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Partner Bump / Controlled Contact Confidence<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — warm-up|skills<\/h3>\n<p><strong>Pit Chaos Handling with Passes<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pit Chaos Handling With Passing drill is an excellent activity that helps players work on awareness, puck handling, and passing skills. This drill can be used as a warm-up in practice or games, or as a drill to reinforce keeping your head up. Setup Setup 2, 3, or 4 players in the middle of a face-off circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><\/ul>\n<h3>Station 2 — sag|skills<\/h3>\n<p><strong>3 on 3 Play Fast Small Area Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Classic IHS 3v3 play-fast SAG. Short shifts, continuous play, reward speed of support after a pass. Pair with the Hub Short of the same theme for a quick visual before the whistle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<h3>Station 3 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Puck Race to Possession Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yUwNEdJtFAs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yUwNEdJtFAs<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"NHL Development Camp Race to Puck Game.\" Official IHS race-to-puck clip (Sabres camp 1v1 into a 2v1), not Elle Hartje's circle possession game. Same first action: win the puck race.<\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=aXQlcDUcGKE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=aXQlcDUcGKE<\/a><\/li><li>Video note: YouTube equivalent — Tursi, \"Jets 2v2 drill.\" IHS 2v2 rush drill on YouTube (Jets 2v2). Not the Pioneer 1v1-to-2v2 progression; same 2v2 rush work.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Buffalo 2v2 to 3v3 to 4v4<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective A high tempo transition drill from Day 2 of the 2026 Buffalo Sabres Development Camp that Camp that starts as a 2v2 and progresses to a 3v3 and 4v4. Both teams are trying to defend &amp; score. Setup Nets on goal line and blue line.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=9shBF_rkkWw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=9shBF_rkkWw<\/a><\/li><li>Video note: YouTube equivalent — Hockey Drills/Situations, \"2v2 Continuous 3v2.\" Continuous 2v2 that layers a 3v2. Not the full Buffalo 2v2→3v3→4v4 progression.<\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Passing support &amp; give-and-go<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Partner Bump / Controlled Contact Confidence* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Pit Chaos Handling with Passes<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *3 on 3 Play Fast Small Area Hockey Game*.<\/strong> One live net (Liam) + two tires at the other end for the team going that way; switch ends every 3 minutes. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (Puck Race to Possession Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">Swiss 4 vs 2 Scoring Game<\/a>. Zone split high/low into two 2v1s on Liam's net (4 v 2); defenders stay in their area, shot within ~5 s. Tonight's constraint: shot must come within 5 s of a pass, and the passer must move to a new spot. <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Back to Back Net Battle Hockey Game*? Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Pioneer 2 V 2 Rush* → One direction only, into Liam's end; the next pair leaves when Liam is set, and the D come back up the wall as their rest. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/a>. 2v1/3v2 pass-count game (first to 3 tape-to-tape passes; defender scores on any touch); winners get a 2-on-0 on Liam. Theme rule: 3 tape-to-tape passes earns a 2-on-0; 5 earns a 3-on-0 on Liam. <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Buffalo 2v2 to 3v3 to 4v4* → Liam stays in the goal-line net; the blue-line net is swapped for two tires (or a net turned to the boards) that count only off a pass from below the dots. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only off a pass (catch-and-shoot or give-and-go); no rebound pile-ons after the whistle.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-02-08", "title": "JJHC Varsity Practice — February 8, 2027", "focus": "Shooting, rebounds & net-front", "time": "8:30 PM–9:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — February 8, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>February 8, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:30 PM–9:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Shooting, rebounds &amp; net-front<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<h3>Station 2 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Station 3 — sag|goalie<\/h3>\n<p><strong>3 on 3 Down-Low Rebound Battle Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Below-the-dots 3v3 rebound battle. Play off goalie rebounds and second chances; defense boxes out, offense crashes with sticks on ice. High-value for Liam’s rebound control.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=ZEFVgm1aC4g\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZEFVgm1aC4g<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"3 on 3 Down-Low Rebound Battle Drill.\" Official IHS net-front / rebound battle. Not Holmstrom's 5-shot box SAG; same screen, tip, and rebound work.<\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 v 1 Puck Retrieval to 2 v 1<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The 1 v 1 Puck Retrieval to 2 v 1 from Jason Lammers is a competitive battle drill to practice puck retrieval and forechecking concepts. The player retrieving the puck works to quickly collect the puck and pass to one of their teammates set up in the cones, which creates a 2 on 1. Setup Have a designated forechecker and defenseman on the half wall Set up two gates at the tops of the circles where the defenseman's teammates are The coach (or a player in line) flips a puck into the corner and both players must ska...<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=aHre_vq3HvY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=aHre_vq3HvY<\/a><\/li><li>Video note: YouTube equivalent — Evolution Hockey, \"MINOR HOCKEY DRILL - Offensive Zone Retrieval Attack 2v1.\" Retrieval in the corner, then attack 2v1. Very close to Lammers' 1v1 retrieval to 2v1.<\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Road Runner 3 v 2<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Road Runner 3v2 Overview: Road Runner 3v2 is a high-tempo, continuous rush drill that reinforces key rush principles for both offense and defense. It challenges attackers to make quick decisions off the rush, encourages defenders to manage gaps and sort responsibilities, and teaches the importance of F3 tracking through the neutral zone to kill plays from above. Setup Coach starts with a puck near the top of the circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=qGm4xRS8Rkk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=qGm4xRS8Rkk<\/a><\/li><li>Video note: YouTube equivalent — Wally Kozak, \"Leafs Continuous 3 on 2.\" Darryl Belfry continuous 3-on-2 rush. Not Road Runner 3v2; same high-tempo continuous 3v2 rush work.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Corner to Half Wall 2 vs 1<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Corner to Half Wall 2 vs 1 is an excellent small area game for all age levels that helps players practice a 2 vs 1 in a small space along the boards in the corner of the ice. The game reinforces important skills like keeping your head up, moving to open spaces, protecting the puck, and verbal &amp; non-verbal communication. Offensive players should practice using the boards to make bank passes.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=hnLu_shT2J0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=hnLu_shT2J0<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Shooting, rebounds &amp; net-front<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: move the second net back-to-back with Liam's net in the slot for the SAG. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Chicago 5 Puck Warm-Up Hockey Drill For Full Team* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Gates of Buffalo 3 vs. 3 Game<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3 (*3 on 3 Down-Low Rebound Battle Drill*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">Tire Deke &amp; Shoot Station<\/a>.<\/strong> Deke the tire, quick release on the move — into a shooter tutor / targets in the empty net. Keeps tonight's focus (Shooting, rebounds &amp; net-front) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (1 v 1 Puck Retrieval to 2 v 1)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a>. Nets back-to-back in the slot, Liam covers BOTH; 2v2 or 3v3, each team must pass to its wall shooter before attacking. Tonight's constraint: wall shooters shoot low for tips; Liam covers both nets so cap shifts at 30 s. <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>*3 vs 1 Keep Away From Battery Hockey* is already goalie-free, so keeping it as written is fine; use the one-net game above when you want Liam in the SAG block.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">Upside-Down Net Target Shooting (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Road Runner 3 v 2* → Rushes go only into Liam's end; the return rush finishes with a pass through a cone gate at the far blue line instead of a shot. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">Tomas Holmstrom SAG (net-front)<\/a>. Box from the dots to the circle tops; 3 O vs 2 D fight for net-front while a shooter fires 5 pucks (one per whistle); attackers tag up outside the box every whistle. Theme rule: shooter may delay for a screen; goals off tips/rebounds only. <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Corner to Half Wall 2 vs 1* → Already low-volume on one net — keep it on Liam's net and finish each rep with one shot only. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Screens and tips are the point, but it's one shot per rep and a reset whistle after every rebound — no point slappers into traffic.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-02-10", "title": "JJHC Varsity Practice — February 10, 2027", "focus": "NZ transition & play-fast habits", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — February 10, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>February 10, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>NZ transition &amp; play-fast habits<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Let the game teach. Short shifts. Compete, then reset.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Full compete in SAG. Communicate box-outs and rebound sides.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Ice Hockey Passing Drill - Rondo Progressions<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Rondo-style passing progressions (keep-away circles). Start with more attackers than defenders and shrink the outlet time. Cue one-touch options and body shape to receive.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — warm-up|skills<\/h3>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<h3>Station 2 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Station 3 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 v 1 Use The Net<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 1 v 1 Use the Net from Jason Lammers is a great drill for all age levels that encourages offensive awareness and puck protection while the defenders work on angling and proper stick detail. The offensive team is trying to skate the puck through the gate while the defender is looking to strip the puck and score on net. Setup Setup a net and a gate as the goals.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=xMDs6JiOsBE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=xMDs6JiOsBE<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Sully 2 on 2 Transition Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Sully 2 on 2 Transition Game from Michael Peca was recorded during the 2024-25 NHL Season. This is a high-tempo small-area game designed to develop quick transition skills, offensive movement, and defensive awareness. The drill encourages players to convert defense into offense efficiently while emphasizing strong defensive details and communication.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=526kbcfZPsk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=526kbcfZPsk<\/a><\/li><li>Video note: YouTube equivalent — Ben Eaves, \"2v2 Continuous.\" Continuous 2v2. Not Peca's Sully transition game; same 2v2 transition/compete work.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Corner to Half Wall 2 vs 1<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Corner to Half Wall 2 vs 1 is an excellent small area game for all age levels that helps players practice a 2 vs 1 in a small space along the boards in the corner of the ice. The game reinforces important skills like keeping your head up, moving to open spaces, protecting the puck, and verbal &amp; non-verbal communication. Offensive players should practice using the boards to make bank passes.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=hnLu_shT2J0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=hnLu_shT2J0<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>NZ transition &amp; play-fast habits<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull the far-end net to the boards and set two tires on the goal line (tire targets). If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Ice Hockey Passing Drill - Rondo Progressions* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (1 v 1 Use The Net)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">2 vs 2 Game (With 1 Goalie &amp; Tire Nets)<\/a>. Cross-ice; one team shoots on Liam, the other scores by hitting 2 tires at the far end; flip ends every time the tire team scores. Tonight's constraint: play-fast rule — no more than 2 touches per player before passing or shooting. <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Back to Back Net Battle Hockey Game*? Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\" rel=\"noopener\">Gates Passing Small Area Game (partners)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Sully 2 on 2 Transition Game* → One net: on a turnover the new offense must pass to the coach at the blue line (regroup) before attacking the same net. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Theme rule: defenders' exit pass must be within 3 s of gaining possession. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Corner to Half Wall 2 vs 1* → Already low-volume on one net — keep it on Liam's net and finish each rep with one shot only. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Rush shots need a lateral move or delay first (pre-shot movement) and no more than one rush every ~20 s.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-02-15", "title": "JJHC Varsity Practice — February 15, 2027", "focus": "Breakouts & D-zone exits", "time": "8:30 PM–9:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — February 15, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>February 15, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:30 PM–9:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Breakouts &amp; D-zone exits<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<h3>Station 3 — contact|skills<\/h3>\n<p><strong>Puck Race to Possession Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yUwNEdJtFAs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yUwNEdJtFAs<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"NHL Development Camp Race to Puck Game.\" Official IHS race-to-puck clip (Sabres camp 1v1 into a 2v1), not Elle Hartje's circle possession game. Same first action: win the puck race.<\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=sbWV5UOkhlk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=sbWV5UOkhlk<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=sazqSJGB_Ek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=sazqSJGB_Ek<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Breakouts &amp; D-zone exits<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Defensive Transition Passing Warm-Up Drill for Hockey Players* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Gates of Buffalo 3 vs. 3 Game<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2 (*Offense 3 v 2 Cross-ice Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">Neutral Zone Passing Station #1<\/a>.<\/strong> Partners skate a cone lane making one pass per gap, drop-pass switch at the end, pass back; switch sides every rep. Keeps tonight's focus (Breakouts &amp; D-zone exits) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Puck Race to Possession Game*.<\/strong> Race in the circle; on the second whistle the winner attacks Liam and the loser defends — the defender scores by carrying it out through a blue-line gate. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (ADM F1 Forecheck Game (10U–18U))*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Tonight's constraint: defenders need two passes before exiting; forwards forecheck 2-1. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Start Practice with 12 Player Small Area Game!*? Play it to tire targets (two tires per end) instead of nets — no goalie needed.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *2 v 2 Transition Hockey Game from NHL Development Camp* → One net: after a turnover the new offense must pass to the coach at the top of the circle before attacking Liam. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Theme rule: the below-goal-line rule = breakout start; first pass up the strong side wall. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Picket Fences Game (2 vs. 2 or 3 vs. 3)* → Already a one-net game (offense shoots on Liam; defense scores by skating the puck between the tires) — run it exactly as written. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Count Liam's rim stops and puck-sets as reps; shots only at the end of an entry, never rapid-fire.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-02-17", "title": "JJHC Varsity Practice — February 17, 2027", "focus": "F1 forecheck & tracking", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — February 17, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>February 17, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>F1 forecheck &amp; tracking<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|systems<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=aXQlcDUcGKE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=aXQlcDUcGKE<\/a><\/li><li>Video note: YouTube equivalent — Tursi, \"Jets 2v2 drill.\" IHS 2v2 rush drill on YouTube (Jets 2v2). Not the Pioneer 1v1-to-2v2 progression; same 2v2 rush work.<\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<h3>Station 3 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=34RNIP3F0Gg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=34RNIP3F0Gg<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Zone Entry - 3v3 +D Joining Rush - 2/3 ice.\" Same idea (D activating into a 3v3 rush / transition); video is 2/3-ice zone entry, not nets at the tops of the circles. Run the written setup.<\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>2 v 3 Entry Offense vs. Breakout Transition<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop quick transition habits from defense to offense, with an emphasis on getting two players to the puck quickly and turning possession into an immediate breakout. The game also creates opportunities to work on re-entry rush offense as players transition between offensive and defensive roles. 2 rush with an additional backchecking player, creating a 2 vs.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=KTnX9RzCB4I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=KTnX9RzCB4I<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Skill Acquisition - Games - 2v2 Transition/ Breakouts/ Zone Entries.\" 2v2 transition / breakout / zone-entry game. Not the exact 2v3 entry-vs-breakout IHS game; same entry and breakout-transition work.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Oreo<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Oreo 3 V 3 Game from Jason Lammers is a continuous game that is competitive in nature as it forces the defense to work to pass the puck to the next players in line, while the offensive team is trying to score. Setup In this example, 3 players line up on the blue line. The players behind them are on the opposite team.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=8FOLeLJdgGA\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=8FOLeLJdgGA<\/a><\/li><li>Video note: YouTube equivalent — Ben Eaves, \"3v3 Continuous.\" Continuous 3v3 game. Not Lammers' Oreo (D must pass to the next players in line).<\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>F1 forecheck &amp; tracking<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Pioneer 2 V 2 Rush*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2 (*Offense 3 v 2 Cross-ice Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>.<\/strong> Head-to-head pivot race (forward–backward–forward) finishing in a race to a coach-placed puck; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Backcheck Small Area Game (tracking))*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Tonight's constraint: when possession changes, the nearest forward is F1 and must pressure immediately while the puck is below the goal line. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *3 on 3 Add a D*? Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *2 v 3 Entry Offense vs. Breakout Transition* → The entry attacks Liam; the breakout team 'scores' by completing the exit pass to a coach at the red line. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Theme rule: F1 angles the D toward the wall; F2 reads the outlet. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Oreo* → Keep it on Liam's net (offense scores, defense outlets to the next line); cap shifts at 30 s so the shot count stays sane. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after a forecheck turnover, from below the tops of the circles — quality over volume.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}], "drill_library": {"title": "John Jay Varsity — Drill Library", "count": 83, "html": "<h1>John Jay Varsity — Drill Library<\/h1>\n<p>Built for Coachy 60-minute ADM
