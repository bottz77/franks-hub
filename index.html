ts one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=34RNIP3F0Gg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=34RNIP3F0Gg<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Zone Entry - 3v3 +D Joining Rush - 2/3 ice.\" Same idea (D activating into a 3v3 rush / transition); video is 2/3-ice zone entry, not nets at the tops of the circles. Run the written setup.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>F1 forecheck &amp; tracking<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Partner Bump / Controlled Contact Confidence* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*1 v 1 Use The Net*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2 (*2 vs 2 Rebound Battle Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>.<\/strong> 1v1 in a faceoff circle; carry the puck out through any of three gates, roles flip on a turnover. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Perry Pearn Tracking Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Tonight's constraint: pressure team: F1 must reach the puck carrier within 2 s of the goalie deflection; F2 takes the pass option. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>*Gates of Buffalo 3 vs. 3 Game* is already goalie-free, so keeping it as written is fine; use the one-net game above when you want Liam in the SAG block.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *3 on 3 Add a D* → Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Theme rule: forwards score double on a goal created by an F1 turnover. <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Offense 3 v 2 Cross-ice Hockey Game* → Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after a forecheck turnover, from below the tops of the circles — quality over volume.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-28", "title": "JJHC Varsity Practice — October 28, 2026", "focus": "Compete night — SAGs & battles", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 28, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 28, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Compete night — SAGs &amp; battles<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Let the game teach. Short shifts. Compete, then reset.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Full compete in SAG. Communicate box-outs and rebound sides.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — systems|contact<\/h3>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=2jPl1Ind8E0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=2jPl1Ind8E0<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"Hockey Backcheck - Backchecking against a 2 on 1 and 3 on 2.\" Official IHS backcheck / tracking clip. Not Perry Pearn's 45-degree tracking game; run the written tracking-game rules.<\/li><\/ul>\n<h3>Station 2 — sag|goalie<\/h3>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<h3>Station 3 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=aXQlcDUcGKE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=aXQlcDUcGKE<\/a><\/li><li>Video note: YouTube equivalent — Tursi, \"Jets 2v2 drill.\" IHS 2v2 rush drill on YouTube (Jets 2v2). Not the Pioneer 1v1-to-2v2 progression; same 2v2 rush work.<\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Bentley Wall Cycling Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This drill helps players work on their wall play and cycling under pressure. SETUP: This is a half ice drill, there should be a net in its usual spot on the goal line. There should be a line of players starting on one of the dots with a pile of pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=jMDpyps_a3Q\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jMDpyps_a3Q<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"Half Ice Hockey Drill: Continuous Cycle Drill.\" Official IHS continuous cycle drill. Not Bentley Wall Cycling; same wall-cycle / cycle-under-pressure work.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=34RNIP3F0Gg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=34RNIP3F0Gg<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Zone Entry - 3v3 +D Joining Rush - 2/3 ice.\" Same idea (D activating into a 3v3 rush / transition); video is 2/3-ice zone entry, not nets at the tops of the circles. Run the written setup.<\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Compete night — SAGs &amp; battles<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: move the second net back-to-back with Liam's net in the slot for the SAG. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Chicago 5 Puck Warm-Up Hockey Drill For Full Team* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Perry Pearn Tracking Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>.<\/strong> 2v2 net-front game with shooting boards (no goalie); defenders stay goal-side, cut lanes, play the body. Keeps tonight's focus (Compete night — SAGs &amp; battles) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *Back to Back Net Battle Hockey Game*.<\/strong> Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (Pioneer 2 V 2 Rush)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a>. Nets back-to-back in the slot, Liam covers BOTH; 2v2 or 3v3, each team must pass to its wall shooter before attacking. Tonight's constraint: keep score; losing team does the next tire setup; 30-s shifts because Liam covers both nets. <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 vs 2 Rebound Battle Hockey Game*? Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Bentley Wall Cycling Drill* → Already a one-net half-ice drill — keep it on Liam's net and alternate sides every rep so shots come from both walls. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">Tomas Holmstrom SAG (net-front)<\/a>. Box from the dots to the circle tops; 3 O vs 2 D fight for net-front while a shooter fires 5 pucks (one per whistle); attackers tag up outside the box every whistle. Theme rule: team-vs-team scoring across all five whistles. <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *3 on 3 Add a D* → Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Battles run long — cap shifts at 30–40 s and blow the whistle on any puck under Liam's pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-02", "title": "JJHC Varsity Practice — November 2, 2026", "focus": "Get it in, get it out, heads up, stay disciplined through contact", "time": "7:15–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 2, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>Mon Nov 2, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Get it in, get it out, heads up, stay disciplined through contact<\/strong><\/td><\/tr><tr><td>Context<\/td><td>Fri L 6-3 OCW (fell apart in 3rd on penalties); Sun T 1-1 Washingtonville. Joey sore after a late hit Fri.<\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires, pinnies (light/dark)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split: ~40% skills/contact · 40% small-area games · 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Heads up before the puck. Absorb, protect, move it. Hands down, stick down, no retaliation — we don't go down a man.<\/p>\n<p><strong>Discipline rule (all night):<\/strong> any stick infraction, retaliation, or hit from behind = that team plays a man down for the next shift. Coach calls it out loud.<\/p>\n<p><strong>Joey:<\/strong> if still sore, non-contact jersey for Station 1 and contact reps; full go in everything else.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–6<\/td><td>A. Warm-up (heads up)<\/td><td>Skills<\/td><\/tr><tr><td>6–24<\/td><td>B. Stations (3× 6 min): contact / protection<\/td><td>Skills / Contact<\/td><\/tr><tr><td>24–36<\/td><td>C. SAG: 4v3 Breakout (exits)<\/td><td>Hockey sense<\/td><\/tr><tr><td>36–48<\/td><td>D. 3v3 Blast Off (entries)<\/td><td>Systems / sense<\/td><\/tr><tr><td>48–58<\/td><td>E. Medicine Hat 3v3 (discipline compete)<\/td><td>Compete<\/td><\/tr><tr><td>58–60<\/td><td>F. Cool-down + board cue<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–6) — 4 Dot Quick Warmup<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: lines at all four NZ dots with pucks, skate through the middle on the whistle.<\/li><li>Cues: chin up through traffic, call names, no looking at the puck. Liam takes soft shots last minute.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Hpq3DYJ1IeU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Hpq3DYJ1IeU<\/a><\/li><\/ul>\n<h2>B. Stations (6–24) — 3 groups, 6 min each<\/h2>\n<h3>Station 1 — 2 Player Partner Bump Open Ice (absorbing contact)<\/h3>\n<ul class=\"jjp-ul\"><li>Setup: size-matched pairs, 3 strides, shoulder/hip bump both sides; half speed → 3/4 → add a puck.<\/li><li>Cues: knees bent, wide base, elbows in, head up and out of the boards' line, absorb with the legs then skate out of it. Never turn your back to the hit.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=jai0vHhRuEY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jai0vHhRuEY<\/a><\/li><\/ul>\n<h3>Station 2 — Finders Keepers (puck protection)<\/h3>\n<ul class=\"jjp-ul\"><li>Setup: tight circle, carriers protect, chasers steal; 20–30 s reps.<\/li><li>Cues: body between man and puck, low center, hands away from pressure, eyes up to find an outlet.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=veI7-0o8n5o\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=veI7-0o8n5o<\/a><\/li><\/ul>\n<h3>Station 3 — 2v2 Tight Area in Corner (on Liam)<\/h3>\n<ul class=\"jjp-ul\"><li>Setup: coach dumps into corner, 2v2 below the dots, one net.<\/li><li>Cues: protect along the wall, legal body position only, stick down = no hooks/slashes. Win it, get it to the slot.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=V97nywNK4lo<\/a><\/li><\/ul>\n<h2>C. SAG (24–36) — 4v3 Breakout Game (exits)<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: coach dumps in; 4 (incl. D) break out vs 3 forecheckers; exit = controlled carry or pass over the blue line, then attack back in.<\/li><li>Cues: D shoulder-check before the puck, strong-side wall support, middle option, chip it off the glass if pressured. No blind rims.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Rk5x2QYYmtk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Rk5x2QYYmtk<\/a><\/li><\/ul>\n<h2>D. Rush game (36–48) — 3vs3 Blast Off (entries)<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: 3v3 rush from the neutral zone into one end, groups go on the whistle.<\/li><li>Cues: carry with speed wide, middle drive, late man; if no lane, chip and chase to a spot — no turnovers at the blue line.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=xgZ_AAL1xdk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=xgZ_AAL1xdk<\/a><\/li><\/ul>\n<h2>E. Finisher (48–58) — Medicine Hat 3v3<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: scoring team stays on, 30–40 s shifts, light vs dark.<\/li><li>Discipline rule live: an infraction = man down next shift. Take the hit to make the play, then get up and skate.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=BhwSW95zfao\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=BhwSW95zfao<\/a><\/li><\/ul>\n<h2>F. Cool-down (58–60)<\/h2>\n<p>Easy laps, stretch, repeat the board cue. Quick word on Friday's 3rd period: stay five on the ice.<\/p>\n<hr>\n<h2>One-goalie option (Liam only; Kerry doesn't practice)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>A:<\/strong> No change; Liam self-warm-up 0–4, then soft shots.<\/li><li><strong>B:<\/strong> Stations 1 and 2 need no goalie. Station 3 stays on Liam, coach-fed, ~12 shots/rotation, break around 15:00.<\/li><li><strong>C:<\/strong> All 4v3 attacks finish on Liam's net. If it bogs down, run <a href=\"https://www.youtube.com/watch?v=9EzHIoxO9Ow\" target=\"_blank\" rel=\"noopener\">3 v 3 Corner Hockey Game<\/a> at the far end on tires.<\/li><li><strong>D:<\/strong> Blast Off rushes go to Liam's end only; between reps, the waiting group plays <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game<\/a> (no net).<\/li><li><strong>E:<\/strong> Medicine Hat on one net; or <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">3 Small Area Games w/ 1 or 0 Goalies<\/a>.<\/li><li><strong>Workload:<\/strong> ~40 min in net; breaks 0–4, ~15:00, 24–26 walkthrough, 36–38, 58–60. Two soft goals in a row = he sits 3–4 reps.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact taught and practiced safely<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Entries and exits both got live reps<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Discipline rule called every time<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 s<\/li><\/ul>"}, {"date": "2026-11-04", "title": "JJHC Varsity Practice — November 4, 2026", "focus": "Exits under pressure, entries with speed, heads up, stay five-on-five", "time": "8:45–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 4, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>Wed Nov 4, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Exits under pressure, entries with speed, heads up, stay five-on-five<\/strong><\/td><\/tr><tr><td>Context<\/td><td>Builds on Monday (Nov 2). Fri L 6-3 OCW (penalties in the 3rd); Sun T 1-1 Washingtonville. Joey sore after a late hit Fri.<\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires, pinnies (light/dark)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split: ~40% skills/contact · 40% small-area games · 20% systems. New drills from Monday, same arc.<\/p>\n<p><strong>Board cue:<\/strong> Heads up before the puck. Take the hit, make the play. Exit with a purpose, enter with speed, never dump it blind. Stick down, no retaliation, stay five.<\/p>\n<p><strong>Discipline rule (all night):<\/strong> any stick infraction, retaliation, or hit from behind = that team plays a man down for the next shift. Coach calls it out loud.<\/p>\n<p><strong>Joey:<\/strong> if still sore, non-contact jersey for Station 1 and Station 2 (stick-only defending, no body contact on him); full go in the games otherwise.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–6<\/td><td>A. Chicago 5 Puck Warm-Up (heads up, call names)<\/td><td>Skills<\/td><\/tr><tr><td>6–24<\/td><td>B. Stations (3× 6 min): angle / contain / net-front<\/td><td>Skills / Contact<\/td><\/tr><tr><td>24–36<\/td><td>C. Nowak Transition Game, 4v3 (exits)<\/td><td>Hockey sense<\/td><\/tr><tr><td>36–48<\/td><td>D. Chip n Chase SAG (entries)<\/td><td>Systems / sense<\/td><\/tr><tr><td>48–58<\/td><td>E. 3 on 3 Play Fast (discipline compete)<\/td><td>Compete<\/td><\/tr><tr><td>58–60<\/td><td>F. Cool-down + board cue<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–6) — Chicago 5 Puck Warm-Up<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: full-team flow, five pucks moving at once; skaters pass and receive while skating through traffic.<\/li><li>Cues: chin up, call for it by name, receive on the move. Liam takes soft shots in the last minute.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<h2>B. Stations (6–24) — 3 groups, 6 min each<\/h2>\n<h3>Station 1 — 1v1 Angle Game Behind Net (giving and taking contact on the wall)<\/h3>\n<ul class=\"jjp-ul\"><li>Setup: carrier goes behind the net; defender angles to the wall and finishes with stick lift or a controlled rub. Switch roles every rep.<\/li><li>Cues: carrier: wide base, protect with the body, absorb on the boards and skate out of it. Defender: angle first, stick second, body third. Nothing from behind and no numbers showing.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=m88qmzCcERw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=m88qmzCcERw<\/a><\/li><\/ul>\n<h3>Station 2 — 2 v 2 Angle Half-Ice Game with Defensive Reward (win it and get out)<\/h3>\n<ul class=\"jjp-ul\"><li>Setup: 2v2 half-ice. Defenders who win the puck score by making a clean exit pass or carry through a gate at the blue line.<\/li><li>Cues: win it with legal body position, then shoulder-check and move it. Hands down, stick down.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=PfpCL35u1tY<\/a><\/li><\/ul>\n<h3>Station 3 — 2v2 Block Out Battle (on Liam)<\/h3>\n<ul class=\"jjp-ul\"><li>Setup: coach shot from the point, 2v2 net-front battle for the rebound.<\/li><li>Cues: box out with the body, stick on the ice; no cross-checks, no slashes after the whistle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=NwE0EoveHBM<\/a><\/li><\/ul>\n<h2>C. SAG (24–36) — Nowak No-Goalie Transition Game, 4v3 (exits)<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: two zones, no goalie. Coach dumps in; the team of 4 (incl. D) retrieves and exits through a blue-line gate against 3 forecheckers. A clean exit scores, then the team attacks the far gate. On a turnover, the other team transitions.<\/li><li>Cues: shoulder-check before you touch it, wall support, middle option, chip it off the glass if pressured. No blind rims up the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cc1xg7o1weo<\/a><\/li><\/ul>\n<h2>D. Rush game (36–48) — Chip n Chase Small Area Game (entries)<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: 3v3. Attackers enter by carrying in with speed or by chipping to space behind the D and winning the race. A goal counts only after a clean entry.<\/li><li>Cues: speed wide, middle drive, late man. Chip to a spot, not to the goalie. A turnover at the blue line gives the other team the puck right away.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=mUFHMpRuXN0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=mUFHMpRuXN0<\/a><\/li><\/ul>\n<h2>E. Finisher (48–58) — 3 on 3 Play Fast Small Area Game<\/h2>\n<ul class=\"jjp-ul\"><li>Setup: 3v3, 30–40 s shifts, light vs dark, everyone rotates in.<\/li><li>Discipline rule live: an infraction = man down next shift. Take the hit, make the play, get up and skate.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<h2>F. Cool-down (58–60)<\/h2>\n<p>Easy laps, stretch, repeat the board cue. Quick word: two practices now on staying five on the ice. Bring it Friday.<\/p>\n<hr>\n<h2>One-goalie option (Liam only; Kerry doesn't practice)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>A:<\/strong> Liam does his own warm-up 0–4, then soft shots. Option: <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill<\/a> with two shooters in the last 2 min.<\/li><li><strong>B:<\/strong> Stations 1 and 2 need no goalie. Station 3 stays on Liam, coach-fed, ~10–12 shots per rotation. Break around 15:00.<\/li><li><strong>C:<\/strong> The Nowak game needs no goalie, so <strong>Liam rests 24–36<\/strong> except for the last ~4 min, when exits finish with a shot on him. If the game bogs down, use <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game<\/a> at the far end.<\/li><li><strong>D:<\/strong> Chip n Chase finishes on Liam's net only. The waiting group plays <a href=\"https://www.youtube.com/watch?v=-Vxk7V3HXvA\" target=\"_blank\" rel=\"noopener\">Cross-Ice 3v3<\/a> on tires at the far end.<\/li><li><strong>E:<\/strong> 3 on 3 Play Fast on one net, or <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">2 Small Area Games w/ 1 Goalie<\/a>.<\/li><li><strong>Workload:<\/strong> ~40 min in net. Breaks at 0–4, ~15:00, 24–32 and 58–60. Two soft goals in a row = he sits 3–4 reps.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact taught and practiced safely (angle, absorb, box out)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Exits and entries both got live reps<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Discipline rule called every time<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality looks and his breaks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 s<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md` · Backup of old Wed plan: `2026-11-04.pre-weekend-rebuild.md`_<\/p>"}, {"date": "2026-11-09", "title": "JJHC Varsity Practice — November 9, 2026", "focus": "Special-teams habits (PP entry / PK pressure)", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 9, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 9, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Special-teams habits (PP entry / PK pressure)<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=34RNIP3F0Gg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=34RNIP3F0Gg<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Zone Entry - 3v3 +D Joining Rush - 2/3 ice.\" Same idea (D activating into a 3v3 rush / transition); video is 2/3-ice zone entry, not nets at the tops of the circles. Run the written setup.<\/li><\/ul>\n<h3>Station 3 — warm-up|skills<\/h3>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=2jPl1Ind8E0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=2jPl1Ind8E0<\/a><\/li><li>Video note: YouTube equivalent — IceHockeySystems_com, \"Hockey Backcheck - Backchecking against a 2 on 1 and 3 on 2.\" Official IHS backcheck / tracking clip. Not Perry Pearn's 45-degree tracking game; run the written tracking-game rules.<\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Gates of Buffalo Small Area Passing Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The major concept of the Gates of Buffalo Small Area Hockey Game is to practice moving to open space, communicating verbally and non-verbally with teammates, so they can score Goals by passing through Gates. This game framework will help players learn to play with their head up, communicate with teammates and move to open space. As a coach, If you commit to working on activities like this instead of memorization drills for a portion of each practice, you will marvel at how your team begins to work together.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JlKKAFlVTLc\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JlKKAFlVTLc<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Special-teams habits (PP entry / PK pressure)<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *3 on 3 Add a D*.<\/strong> Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (Backcheck Small Area Game (tracking))*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">Sticks In Lanes Game (Topher Scott)<\/a>. 6 fixed attackers vs 2 defenders in the middle, one net; 2+ passes through the middle before a shot; sticks on the ice. Tonight's constraint: PP side needs 2 passes through the middle before a shot; PK sticks on the ice or the coach awards a penalty shot. <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Offense 3 v 2 Cross-ice Hockey Game*? Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Perry Pearn Tracking Game* → Play it in Liam's zone; the defending team's controlled exit over the blue line counts as their goal, so no second net is needed. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">Power Play Scoring Competition (Wes Wolfe)<\/a>. 60-s PP rounds on Liam: 5-on-0 entry, then one PKer added every 15 s up to 5-on-4; most goals wins. Theme rule: each PP unit gets three 60-s rounds; PK scores by icing it. <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Gates of Buffalo Small Area Passing Game* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: PP one-timers only after 2+ passes; whistle after each goal or freeze so he resets.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-11", "title": "JJHC Varsity Practice — November 11, 2026", "focus": "Puck protection under contact", "time": "7:15 PM–8:15 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 11, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 11, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Puck protection under contact<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Angle first → stick second → body third. Heads up. No from-behind.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Crease tracking during contact stations; no body-contact role. Soft shots from hashes when free.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side Passing Warm-Up (Darryl Belfry)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team passing warm-up from Darryl Belfry. Players line up at all four neutral-zone face-off circles with pucks. Pattern: skate down the side, pass to the next player, and join that player's line; that player skates across the middle, passes, and joins the next line — side, middle, side. Don't catch a puck standing still. Pass a little to the inside so the teammate can skate into it. Cue heads up: pass to where they're going, not where they're standing, stay ready for the next puck, and don't leave the line too early. Same timing and vision they'll need on entries and exits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–8 Side Middle Side (20–30 second pattern demo, then continuous flow). Last minute: Liam takes soft-to-firm shots from the hash marks, one at a time, while the group keeps moving.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — systems|sag|contact<\/h3>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h3>Station 2 — skills|contact<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h3>Station 3 — sag|systems<\/h3>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup: shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone. Cue the D to jump into the rush when there's an extra player, and transition immediately on a change of possession.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=34RNIP3F0Gg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=34RNIP3F0Gg<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Zone Entry - 3v3 +D Joining Rush - 2/3 ice.\" Same idea (D activating into a 3v3 rush / transition), different ice cut (2/3-ice zone entry instead of nets at the tops of the circles). Run tonight with the setup above.<\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=sazqSJGB_Ek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=sazqSJGB_Ek<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Hit The Tire Passing Game With No Goalie<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Fun small-area game for passing, puck support, and heads-up play — no goalie needed. Place a tire on each of the face-off dots inside a zone. A team scores by hitting the tire in the opposite circle. Leave room around each tire so play can happen on every side. Cue verbal and non-verbal support, move to open space, and protect the puck.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=9LZa7cH-phw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=9LZa7cH-phw<\/a><\/li><li>Video note: Substitutes for Corner Tires (no YouTube of that IHS clip). This is IceHockeySystems' own related game — score by hitting a tire, no goalie — with tires on the face-off dots instead of four tires in a rectangle.<\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Puck protection under contact<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side Passing Warm-Up (Darryl Belfry)* as written — it doesn't need a goalie. Single-net adaptation: leave Liam's net in place and run the pattern in the neutral zone only, so he can work in his crease without traffic. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers. Pull two skaters out of the flow for those shots, then send them back in.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Backcheck Small Area Game (tracking)*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>.<\/strong> 1v1 in a faceoff circle; carry the puck out through any of three gates, roles flip on a turnover. Keeps tonight's focus (Puck protection under contact) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2: *1 on 1 Tips for Hockey Players: The Attack Position<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *3 on 3 Add a D*.<\/strong> Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Tonight's constraint: carrier must protect with body between puck and defender for a 2-count before attacking the net. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Offense 3 v 2 Cross-ice Hockey Game*? Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Picket Fences Game (2 vs. 2 or 3 vs. 3)* → Already a one-net game (offense shoots on Liam; defense scores by skating the puck between the tires) — run it exactly as written. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">2v2 Tight Area in Corner (1 Goalie)<\/a>. Net angled in the corner, dividers box the area; 2v2, 45-s shifts, keep score. Theme rule: coach spots pucks to the wall — protect, roll off, attack. <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Hit The Tire Passing Game With No Goalie* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after the carrier separates; no hacking at rebounds under his pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-16", "title": "JJHC Varsity Practice — November 16, 2026", "focus": "Activation & late D support", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 16, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 16, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Activation &amp; late D support<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|contact<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=34RNIP3F0Gg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=34RNIP3F0Gg<\/a><\/li><li>Video note: YouTube equivalent — Sanesports, \"Zone Entry - 3v3 +D Joining Rush - 2/3 ice.\" Same idea (D activating into a 3v3 rush / transition); video is 2/3-ice zone entry, not nets at the tops of the circles. Run the written setup.<\/li><\/ul>\n<h3>Station 3 — systems|skills<\/h3>\n<p><strong>Road Runner 3 v 2<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Road Runner 3v2 Overview: Road Runner 3v2 is a high-tempo, continuous rush drill that reinforces key rush principles for both offense and defense. It challenges attackers to make quick decisions off the rush, encourages defenders to manage gaps and sort responsibilities, and teaches the importance of F3 tracking through the neutral zone to kill plays from above. Setup Coach starts with a puck near the top of the circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=qGm4xRS8Rkk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=qGm4xRS8Rkk<\/a><\/li><li>Video note: YouTube equivalent — Wally Kozak, \"Leafs Continuous 3 on 2.\" Darryl Belfry continuous 3-on-2 rush. Not Road Runner 3v2; same high-tempo continuous 3v2 rush work.<\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Angle Behind Net + Stick Check<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: O carries behind the net; X angles to force outside/into the corner and finishes with stick lift/press or controlled rub—no open-ice charge. Switch roles every few reps. Cue: stay slightly behind until the carrier clears the net, then close.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=sazqSJGB_Ek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=sazqSJGB_Ek<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Gates of Buffalo Small Area Passing Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The major concept of the Gates of Buffalo Small Area Hockey Game is to practice moving to open space, communicating verbally and non-verbally with teammates, so they can score Goals by passing through Gates. This game framework will help players learn to play with their head up, communicate with teammates and move to open space. As a coach, If you commit to working on activities like this instead of memorization drills for a portion of each practice, you will marvel at how your team begins to work together.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JlKKAFlVTLc\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JlKKAFlVTLc<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Activation &amp; late D support<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *1 on 1 Tips for Hockey Players: The Attack Position<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2 (*3 on 3 Add a D*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>.<\/strong> 3v3, score by passing through one of three tire gates to a teammate; no net, no goalie. Keeps tonight's focus (Activation &amp; late D support) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Road Runner 3 v 2*.<\/strong> Rushes go only into Liam's end; the return rush finishes with a pass through a cone gate at the far blue line instead of a shot. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Angle Behind Net + Stick Check)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">3 v 2 Dot Jumper<\/a>. 2v2 race on a coach chip; each team's dot player is frozen until it gets a pass, then jumps in for a 3v2 on Liam's net. Tonight's constraint: the dot player is a D — he jumps in as the late attacker and must get a shot or a touch in the slot. <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Start Practice with 12 Player Small Area Game!*? Play it to tire targets (two tires per end) instead of nets — no goalie needed.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Picket Fences Game (2 vs. 2 or 3 vs. 3)* → Already a one-net game (offense shoots on Liam; defense scores by skating the puck between the tires) — run it exactly as written. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/a>. 2v1/3v2 pass-count game (first to 3 tape-to-tape passes; defender scores on any touch); winners get a 2-on-0 on Liam. Theme rule: in the 2v1 pass game the third (late) player must be the one who finishes the 2-on-0. <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Gates of Buffalo Small Area Passing Game* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Activated D shoot low for tips; one shot per activation.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-18", "title": "JJHC Varsity Practice — November 18, 2026", "focus": "Middle-ice deny & stick detail", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 18, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 18, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Middle-ice deny &amp; stick detail<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Partner Bump / Controlled Contact Confidence<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noope
