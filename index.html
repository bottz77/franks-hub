>Station 1 — contact|systems<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<h3>Station 3 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>2 v 3 Entry Offense vs. Breakout Transition<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop quick transition habits from defense to offense, with an emphasis on getting two players to the puck quickly and turning possession into an immediate breakout. The game also creates opportunities to work on re-entry rush offense as players transition between offensive and defensive roles. 2 rush with an additional backchecking player, creating a 2 vs.<\/li><li>Video: <a href=\"https://vimeo.com/1223950056\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223950056<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Oreo<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Oreo 3 V 3 Game from Jason Lammers is a continuous game that is competitive in nature as it forces the defense to work to pass the puck to the next players in line, while the offensive team is trying to score. Setup In this example, 3 players line up on the blue line. The players behind them are on the opposite team.<\/li><li>Video: <a href=\"https://vimeo.com/847506383\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/847506383<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>F1 forecheck &amp; tracking<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Pioneer 2 V 2 Rush*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2 (*Offense 3 v 2 Cross-ice Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>.<\/strong> Head-to-head pivot race (forward–backward–forward) finishing in a race to a coach-placed puck; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Backcheck Small Area Game (tracking))*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Tonight's constraint: when possession changes, the nearest forward is F1 and must pressure immediately while the puck is below the goal line. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *3 on 3 Add a D*? Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *2 v 3 Entry Offense vs. Breakout Transition* → The entry attacks Liam; the breakout team 'scores' by completing the exit pass to a coach at the red line. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Theme rule: F1 angles the D toward the wall; F2 reads the outlet. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Oreo* → Keep it on Liam's net (offense scores, defense outlets to the next line); cap shifts at 30 s so the shot count stays sane. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after a forecheck turnover, from below the tops of the circles — quality over volume.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}], "drill_library": {"title": "John Jay Varsity — Drill Library", "count": 82, "html": "<h1>John Jay Varsity — Drill Library<\/h1>\n<p>Built for Coachy 60-minute ADM practice plans. Each entry has a short written setup <strong>and<\/strong> a public video URL (YouTube or Vimeo).<\/p>\n<h2>Where the drills webpage lives<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Hub John Jay drill strip (6 IceHockeySystems Shorts):<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><li>Private twin: <a href=\"https://franks-hub-private.pages.dev/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://franks-hub-private.pages.dev/#/johnjay<\/a><\/li><li>Config: `frank-hub/feeds.json` → `johnjay.videos` → IceHockeySystems<\/li><li><strong>jjpuck.com Resources:<\/strong> menu exists but has <strong>no drill pages<\/strong> (empty). Club site is schedules/roster only.<\/li><li>Expanded sources: <a href=\"https://www.icehockeysystems.com/hockey-drills\" target=\"_blank\" rel=\"noopener\">icehockeysystems.com/hockey-drills<\/a>, <a href=\"https://www.admkids.com/page/show/2284974-adm-drill-of-the-month\" target=\"_blank\" rel=\"noopener\">ADM Drill of the Month<\/a>, USA Hockey articles.<\/li><\/ul>\n<p><strong>Inventory:<\/strong> 38 drills with video links, plus 30 `one-goalie` additions (#39–68, added 2026-10-06), plus 5 focus additions (#69–73, added 2026-10-19). Machine-readable full scrape: `jj_drill_library.json` (54 entries).<\/p>\n<p>Tags: `warm-up` | `skills` | `contact` | `sag` | `systems` | `goalie` | `one-goalie`<\/p>\n<hr>\n<h2>1. 1v1 Race to the Puck → 3v3 Transition Drill<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|sag`<\/li><li><strong>Directions:<\/strong> Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h2>2. 2 v 2 Angle Half-Ice Hockey Game with Defensive Reward<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|sag`<\/li><li><strong>Directions:<\/strong> Half-ice 2v2 with angling focus and a defensive reward rule (e.g., clear/score after a takeaway). Offense must move to support; defense angles first, then stick, then body. Continuous short shifts so everyone gets reps.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h2>3. 1 v 1 Angle &amp; Gap Full Ice Hockey Drill<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|skills`<\/li><li><strong>Directions:<\/strong> Full-ice 1v1 emphasizing angle and gap. Defender closes on an angle (stick on ice, outside shoulder lined up) while the attacker reads pressure and attacks open ice. Keep shifts short; reward the defender for forcing outside and the attacker for protecting the puck through contact.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h2>4. 3 v 3 Play Fast Game that Involves the WHOLE TEAM<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> Full-team 3v3 play-fast small-area game. Keep all lines rotating with short shifts so nobody stands. Emphasize first touch, immediate support, and transition the instant possession changes.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/8loIyjdiosg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/8loIyjdiosg<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h2>5. 2 v 2 Transition Hockey Game from NHL Development Camp<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems`<\/li><li><strong>Directions:<\/strong> 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h2>6. What it means to be a good leader with Gold Medalist Hayley Scamurra<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems`<\/li><li><strong>Directions:<\/strong> Team talk / leadership clip. Use as a 60–90 second board or locker-room cue on compete, accountability, and how leaders set the tone for practice and games. Not an on-ice drill—pair with a compete block the same night.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/wwOIUxHVMTw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/wwOIUxHVMTw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h2>7. New Jersey 1v1 / 2v2 Contact SAG<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|sag`<\/li><li><strong>Directions:<\/strong> Below-hash or half-zone boxes. Dump a puck; 1v1 then 2v2 with legal contact taught that night. Winner exits to a shot. Stop illegal hits immediately. Angle first, stick second, body third.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.usahockey.com/trainingmaterials\" target=\"_blank\" rel=\"noopener\">https://www.usahockey.com/trainingmaterials<\/a><\/li><\/ul>\n<h2>8. 1 v 1 Use The Net<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|skills`<\/li><li><strong>Directions:<\/strong> 1 v 1 Use the Net from Jason Lammers is a great drill for all age levels that encourages offensive awareness and puck protection while the defenders work on angling and proper stick detail. The offensive team is trying to skate the puck through the gate while the defender is looking to strip the puck and score on net. Setup Setup a net and a gate as the goals.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1154377465\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1154377465<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/1-v-1-use-net\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/1-v-1-use-net<\/a><\/li><\/ul>\n<h2>9. Angle Behind Net + Stick Check<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|skills`<\/li><li><strong>Directions:<\/strong> O carries behind the net; X angles to force outside/into the corner and finishes with stick lift/press or controlled rub—no open-ice charge. Switch roles every few reps. Cue: stay slightly behind until the carrier clears the net, then close.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=m88qmzCcERw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=m88qmzCcERw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=m88qmzCcERw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=m88qmzCcERw<\/a><\/li><\/ul>\n<h2>10. Puck Race to Possession Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|skills`<\/li><li><strong>Directions:<\/strong> Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1210465912\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1210465912<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/puck-race-possession-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/puck-race-possession-game<\/a><\/li><\/ul>\n<h2>11. Pioneer 2 V 2 Rush<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|systems`<\/li><li><strong>Directions:<\/strong> The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/pioneer-2-v-2-rush\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/pioneer-2-v-2-rush<\/a><\/li><\/ul>\n<h2>12. Partner Bump / Controlled Contact Confidence<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|warm-up`<\/li><li><strong>Directions:<\/strong> Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=jai0vHhRuEY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jai0vHhRuEY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=jai0vHhRuEY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jai0vHhRuEY<\/a><\/li><\/ul>\n<h2>13. Practice Goalie Shuffles &amp; Edgework with No Crease<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|skills`<\/li><li><strong>Directions:<\/strong> Goalie edgework and shuffles that do not require a painted crease—use cones or boards. Pair with skater stations so Liam gets focused movement work while others rotate.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=EASYdYzvucU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=EASYdYzvucU<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=EASYdYzvucU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=EASYdYzvucU<\/a><\/li><\/ul>\n<h2>14. 2 vs 2 Rebound Battle Hockey Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|goalie|skills`<\/li><li><strong>Directions:<\/strong> 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<h2>15. 3 on 3 Play Fast Small Area Hockey Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> Classic IHS 3v3 play-fast SAG. Short shifts, continuous play, reward speed of support after a pass. Pair with the Hub Short of the same theme for a quick visual before the whistle.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<h2>16. Corner Tires - Small Area Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> Corner Tires is a small area game where the players score by hitting the tire with a puck. Set Up Place four tires on a rectangle as shown in the diagram. Make sure there is enough room from the tires to the edge so that there is room to play on all sides of the tires.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/410680521\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/410680521<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/corner-tires-small-area-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/corner-tires-small-area-game<\/a><\/li><\/ul>\n<h2>17. Corner to Half Wall 2 vs 1<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> The Corner to Half Wall 2 vs 1 is an excellent small area game for all age levels that helps players practice a 2 vs 1 in a small space along the boards in the corner of the ice. The game reinforces important skills like keeping your head up, moving to open spaces, protecting the puck, and verbal &amp; non-verbal communication. Offensive players should practice using the boards to make bank passes.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=hnLu_shT2J0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=hnLu_shT2J0<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/corner-half-wall-2-vs-1\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/corner-half-wall-2-vs-1<\/a><\/li><\/ul>\n<h2>18. Gates of Buffalo Small Area Passing Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> The major concept of the Gates of Buffalo Small Area Hockey Game is to practice moving to open space, communicating verbally and non-verbally with teammates, so they can score Goals by passing through Gates. This game framework will help players learn to play with their head up, communicate with teammates and move to open space. As a coach, If you commit to working on activities like this instead of memorization drills for a portion of each practice, you will marvel at how your team begins to work together.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=JlKKAFlVTLc\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JlKKAFlVTLc<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/gates-buffalo-small-area-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/gates-buffalo-small-area-game<\/a><\/li><\/ul>\n<h2>19. Hit The Tire Passing Game WIth No Goalie<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> Hit The Tire Passing Game is a fun small area game that can be utilized when coaches want to work on passing and puck support concepts and/or there are no goalies available. Setup Place a tire on each of the face-off dots inside of a zone. The offensive team scores by hitting the tire in the opposite circle.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=9LZa7cH-phw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=9LZa7cH-phw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/hit-tire-passing-game-no-goalie\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/hit-tire-passing-game-no-goalie<\/a><\/li><\/ul>\n<h2>20. Ramsay 3 V 3 Race<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/ramsay-3-v-3-race\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/ramsay-3-v-3-race<\/a><\/li><\/ul>\n<h2>21. Swedish 2 vs 1 (Cross Ice)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills`<\/li><li><strong>Directions:<\/strong> This is a phenomenal drill in several ways. First, the concept of this drill can be used in many different areas of the ice. Secondly, it forces players to think 2 on 1's in tight spaces.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/342763238\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/342763238<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/swedish-2-vs-1-cross-ice\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/swedish-2-vs-1-cross-ice<\/a><\/li><\/ul>\n<h2>22. Buffalo 2v2 to 3v3 to 4v4<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems`<\/li><li><strong>Directions:<\/strong> Objective A high tempo transition drill from Day 2 of the 2026 Buffalo Sabres Development Camp that Camp that starts as a 2v2 and progresses to a 3v3 and 4v4. Both teams are trying to defend &amp; score. Setup Nets on goal line and blue line.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1222710175\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1222710175<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/buffalo-2v2-3v3-4v4-3\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/buffalo-2v2-3v3-4v4-3<\/a><\/li><\/ul>\n<h2>23. Offense 3 v 2 Cross-ice Hockey Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems`<\/li><li><strong>Directions:<\/strong> Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<h2>24. Oreo<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems`<\/li><li><strong>Directions:<\/strong> Oreo 3 V 3 Game from Jason Lammers is a continuous game that is competitive in nature as it forces the defense to work to pass the puck to the next players in line, while the offensive team is trying to score. Setup In this example, 3 players line up on the blue line. The players behind them are on the opposite team.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/847506383\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/847506383<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/oreo\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/oreo<\/a><\/li><\/ul>\n<h2>25. Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems`<\/li><li><strong>Directions:<\/strong> Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/434166992\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/434166992<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/picket-fences\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/picket-fences<\/a><\/li><\/ul>\n<h2>26. Sully 2 on 2 Transition Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems`<\/li><li><strong>Directions:<\/strong> The Sully 2 on 2 Transition Game from Michael Peca was recorded during the 2024-25 NHL Season. This is a high-tempo small-area game designed to develop quick transition skills, offensive movement, and defensive awareness. The drill encourages players to convert defense into offense efficiently while emphasizing strong defensive details and communication.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1067058133\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1067058133<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/sully-2-on-2-transition-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/sully-2-on-2-transition-game<\/a><\/li><\/ul>\n<h2>27. Shooting Off The Pass - Offensive Zone Hockey Drill<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|goalie`<\/li><li><strong>Directions:<\/strong> Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h2>28. Use The Net 2 on 1 Hockey Drill<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|systems`<\/li><li><strong>Directions:<\/strong> 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<h2>29. Breakout Transition Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems`<\/li><li><strong>Directions:<\/strong> Objective: a 2 v 2 game were the offense is trying to score and the defense is working hard to create turnovers and breakout by passing the puck to their teammates at center ice. Setup: Set up nets across the zone. Draw a line down the middle of the ice from the blue line to end wall.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1122947715\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1122947715<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/breakout-transition-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/breakout-transition-game<\/a><\/li><\/ul>\n<h2>30. USA Activation Drill (14U+)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|sag`<\/li><li><strong>Directions:<\/strong> Coach shoots a puck across; first two from each line race to it while the next two become activating D behind the nets. Possession side can attack or kick back to activating D for a 4v2. Run 30-second shifts; teach battle + activate.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.usahockey.com/news_article/show/716266-14u-usa-activation-drill\" target=\"_blank\" rel=\"noopener\">https://www.usahockey.com/news_article/show/716266-14u-usa-activation-drill<\/a><\/li><\/ul>\n<h2>31. ADM F1 Forecheck Game (10U–18U)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|sag|contact`<\/li><li><strong>Directions:<\/strong> 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.admkids.com/news_article/show/754281-10u-18u-f1-forecheck-game\" target=\"_blank\" rel=\"noopener\">https://www.admkids.com/news_article/show/754281-10u-18u-f1-forecheck-game<\/a><\/li><\/ul>\n<h2>32. Backcheck Small Area Game (tracking)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|sag|contact`<\/li><li><strong>Directions:<\/strong> Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h2>33. NZ Give and Go<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|skills`<\/li><li><strong>Directions:<\/strong> Objective Develop off-puck movement and teach players to create give-and-go opportunities by moving immediately after a pass. The game encourages players to think ahead, recognize available space, and create new passing lanes to get the puck back. 2 game in the neutral zone .<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1223931767\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223931767<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/nz-give-and-go-1\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/nz-give-and-go-1<\/a><\/li><\/ul>\n<h2>34. Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `warm-up|skills`<\/li><li><strong>Directions:<\/strong> Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<h2>35. Ice Hockey Passing Drill - Rondo Progressions<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `warm-up|skills`<\/li><li><strong>Directions:<\/strong> Rondo-style passing progressions (keep-away circles). Start with more attackers than defenders and shrink the outlet time. Cue one-touch options and body shape to receive.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><\/ul>\n<h2>36. Pit Chaos Handling with Passes<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `warm-up|skills`<\/li><li><strong>Directions:<\/strong> The Pit Chaos Handling With Passing drill is an excellent activity that helps players work on awareness, puck handling, and passing skills. This drill can be used as a warm-up in practice or games, or as a drill to reinforce keeping your head up. Setup Setup 2, 3, or 4 players in the middle of a face-off circle.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/pit-chaos-handling-passes\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/pit-chaos-handling-passes<\/a><\/li><\/ul>\n<h2>37. Side Middle Side<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `warm-up|skills`<\/li><li><strong>Directions:<\/strong> The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/side-middle-side-passing\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/side-middle-side-passing<\/a><\/li><\/ul>\n<h2>38. Defensive Transition Passing Warm-Up Drill for Hockey Players<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `warm-up|systems`<\/li><li><strong>Directions:<\/strong> Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<hr>\n<h2>One-goalie / single-net additions (added 2026-10-06)<\/h2>\n<p>For nights with only ONE netminder: single-net small-area games (second net replaced by tires, gates or passing targets), one-net stations that rotate shooters, no-goalie stations, and goalie workload references. Every plan file now has a `## One-goalie option` section that uses these. Videos were checked against their title/description (YouTube oEmbed + page text) or are the video embedded on the drill's own IHS page.<\/p>\n<h2>39. 2 vs 2 Game (With 1 Goalie &amp; Tire Nets)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|one-goalie`<\/li><li><strong>Directions:<\/strong> Cross-ice game built for nights with one goalie: one team shoots on the goalie while the other team scores by hitting 1–3 tires set at the opposite end (more tires = easier). Coach flips a puck in on the whistle; change on a goal, a freeze, a puck out of play, or the whistle. Switch sides during the game (or every time the tire team scores) so everyone gets to attack the goalie. Scales to 2v2, 3v3 or 4v4.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/657484569\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/657484569<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page, not on vimeo.com).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets<\/a><\/li><\/ul>\n<h2>40. Back to Back Nets – One Goalie (wall shooters)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|one-goalie|goalie`<\/li><li><strong>Directions:<\/strong> Nets back-to-back in the middle of the zone with ONE goalie covering both. Play 2v2 or 3v3; each team has a designated player on its offensive wall and must pass to that player to go on offense — the wall player can shoot or pass. A drawn line can keep defenders off the wall players. Designed for one-goalie practices and adds goalie skating/recovery reps (keep shifts short so it stays quality, not chaos).<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=J66B2W1FF4E<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=J66B2W1FF4E<\/a><\/li><\/ul>\n<h2>41. 2v2 Tight Area in Corner (1 Goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|one-goalie`<\/li><li><strong>Directions:<\/strong> Place a net in the corner on an angle facing the slot and use boards/dividers to confine a small area that keeps pucks in. Play 2v2 in 45-second shifts and keep score. Only one net is live, so a single goalie handles it while the game teaches core offensive and defensive habits in tight space (support, protection, stick on puck, net-front).<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=V97nywNK4lo<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=V97nywNK4lo<\/a><\/li><\/ul>\n<h2>42. Goal Line Small Area Game (USA Hockey)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|one-goalie`<\/li><li><strong>Directions:<\/strong> Draw a line across the corner about 6 ft behind the net; two players per team play 2v2 on a single net with a neutral goalie. Coach spots a loose puck to start a battle. On every change of possession the puck must be carried or passed below the goal line before the new team can attack. Coach defensive-side body position, stick on puck and awareness away from the puck; offensively, puck protection and support.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=nFqJT564ZgQ<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.usahockey.com/smallareagames\" target=\"_blank\" rel=\"noopener\">https://www.usahockey.com/smallareagames<\/a><\/li><\/ul>\n<h2>43. 3 vs 3 Split Zone Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Split one zone in half lengthwise; 3 forwards attack one net (one goalie) against 3 defenders. Coach chips the puck to the goalie, who directs it to the corner to start. Forwards earn 2 points for a goal; defenders earn 1 point by completing one pass and then exiting the zone. The rep ends on a goal, an exit, a goalie freeze or the whistle.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ynnmtmb-sLA<\/a> <em>(note: Video is The Hockey Think Tank's breakdown of the drill; scoring rules are from the IHS page.)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-vs-3-split-zone-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/3-vs-3-split-zone-game<\/a><\/li><\/ul>\n<h2>44. 3 on 2 Race to 5 (Cail MacLean)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Below the tops of the circles: 3 forwards vs 2 defensemen plus the goalie. Coach dumps a puck and the rep plays 10–20 seconds. Forwards get 1 point for a goal; defenders get 1 point for skating the puck past the line; the goalie's side gets 1 point for covering the puck. New players on every point; first to 5 wins.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1036813387\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1036813387<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5<\/a><\/li><\/ul>\n<h2>45. Tomas Holmstrom SAG (net-front)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Mark a box from just inside the dots/hash marks up to the tops of the circles. Three attackers vs two (or three) defenders battle inside it while a shooter at the top of the circles fires 5 pucks in a row — shots only (no direct passes), and only after the whistle. On each whistle attackers must tag up outside the box and re-win inside position for screens, tips and rebounds; defenders box out and block. Switch after 5 reps and keep score.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1143174975\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1143174975<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag<\/a><\/li><\/ul>\n<h2>46. 2v2 Block Out Battle (Hockey Coach Vision)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Coach shoots off the goalie's pads to create a rebound; forwards attack the loose puck while defenders box them out. On the next whistle the forwards race around the cones and a second puck starts a 2v2 battle down low. Cue defenders to keep their body between man and net, forwards to fight for inside position, and everyone to talk.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=NwE0EoveHBM<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=NwE0EoveHBM<\/a><\/li><\/ul>\n<h2>47. Gretzky 3 vs 2 Behind the Net<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Tops of the circles and below, one net. Coach dumps a puck and names one team to send 3 players and the other 2. The team of 3 must always keep one player below the goal line; if that forward comes up, the puck has to go behind the net to the next forward rotating down. Defenders communicate switches and control body and stick.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=TK4IZmmb_y0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=TK4IZmmb_y0<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/gretzky-3-vs-2-behind-net\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/gretzky-3-vs-2-behind-net<\/a><\/li><\/ul>\n<h2>48. 3 v 2 Dot Jumper<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Coach chips a puck to start a 2v2 race; one extra player from each team skates straight to a faceoff dot and must stay there until receiving a pass. The team with possession can pass to its dot player to make it 3v2; if the defenders steal it, they activate their own dot player. One net in-zone — emphasize moving without the puck, communication and following shots.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=xi51A57gxws<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-2-dot-jumper\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/3-2-dot-jumper<\/a><\/li><\/ul>\n<h2>49. Swiss 4 vs 2 Scoring Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Divide the offensive zone with a line through the dots (or hash marks/cones) into a high and a low area, each holding a 2v1 — four attackers vs two defenders on one net. Defenders must stay in their area with an active stick; attackers can pass anywhere and must shoot within about 5 seconds. Change on a miss, freeze or puck out; rotate low attackers out, defenders to the low attack spots, high attackers to defense.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=bU7eVMlN_dg<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/swiss-4-vs-2-scoring-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/swiss-4-vs-2-scoring-game<\/a><\/li><\/ul>\n<h2>50. Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Game 1: 2v2 between the blue line and a drawn line; a team can only score after passing to its own moving outlet player in a separate lane, and on a turnover the other team must hit its outlet first. Game 2: in a roped-off area a 2v1 (or 3v2) plays first-to-3 — tape-to-tape forehand passes score for the attackers, any touch scores for the defender — and the winners get a 2-on-0 (or partial breakaway) on the goalie. The goalie only sees the reward rush, so his reps stay high quality.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZkkZ5L1volI<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZkkZ5L1volI<\/a><\/li><\/ul>\n<h2>51. Sticks In Lanes Game (Topher Scott)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Six attackers hold set spots around the zone (they can shift but not skate around) against two defenders in the middle; one net. The offense must pass through the middle of the ice two or more times before it can shoot; defenders keep sticks on the ice to block lanes and break up plays. Switch teams every rep and keep score. Harder: 4v2, 6v3, a smaller area, or 3 passes through the middle.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/639683746\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/639683746<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game<\/a><\/li><\/ul>\n<h2>52. Power Play Scoring Competition (Wes Wolfe)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Half-ice with one goalie: a 5-man power play enters off a coach pass and plays 60 seconds. It starts 5-on-0 for 15 s, then the coach whistles in one penalty killer every 15 s until it finishes 5-on-4. New puck immediately after a goal or freeze (vary rims and bouncing pucks); each unit gets three 60-s rounds and the unit with the most goals wins.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1045818627\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1045818627<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition<\/a><\/li><\/ul>\n<h2>53. Horseshoe Regroup 2-on-1 (one goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> One-goalie regroup series: forwards exchange passes up the ice, the first forward drives for a shot and rebound while the second cuts across, takes a pass and moves it D-to-D through the defense. The last defenseman to touch it steps up over the blue line and gets back into position to defend the 2-on-1 into the same net. Cue tape-to-tape passes, driving the net, and the defender's gap after the step-up.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=wmAPVvs29WM<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/horseshoe-re-group-one-goalie-1-d-d-center\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/horseshoe-re-group-one-goalie-1-d-d-center<\/a><\/li><\/ul>\n<h2>54. Half Ice Shoot In Stride<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Two lines at the hash marks; the first player skates toward the red line and the opposite coach, calls for a puck, receives it with feet moving and shoots in stride before the cone, then stops at the net for a rebound. Alternate lines so the goalie sees one shot at a time from varied angles. Cue verbal and stick-target communication and shooting without stopping the feet.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/186050732\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/186050732<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/half-ice-shoot-stride\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/half-ice-shoot-stride<\/a><\/li><\/ul>\n<h2>55. The Gate Game (no goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Set three gates with heavy tires or cones; play 3v3 where a team scores by passing through a gate to a teammate on the other side. Whoever wins the puck is on offense — no net, no goalie. It forces players to spread out and move the puck fast; make it easier with more/wider gates or add a blue-line passer for a 4v3 feel.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=bHTPn2TsmFQ<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=bHTPn2TsmFQ<\/a><\/li><\/ul>\n<h2>56. Nowak No-Goalie Transition Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|one-goalie`<\/li><li><strong>Directions:<\/strong> 1v1 in the middle with support players on each wall and a cone gate at center ice. The puck carrier regroups with the wall players to get the puck across to the other side: carry it across outside the cones = 1 point, between the cones = 2 points. Wall players may pass to the other player on the same wall but not across the ice. No goalie needed.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cc1xg7o1weo<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cc1xg7o1weo<\/a><\/li><\/ul>\n<h2>57. Gates Passing Small Area Game (partners)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up|one-goalie`<\/li><li><strong>Directions:<\/strong> Pairs share one puck inside a zone filled with cone gates. Pass to your partner through a gate, then both move to a new gate; you can't use the same gate twice in a row. Play for time and count gates completed per pair — heads up, move to open ice, communicate.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cq7SUFsoU0Q<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cq7SUFsoU0Q<\/a><\/li><\/ul>\n<h2>58. 2vs2 Shooting Board Game (IIHF Skills4Life)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|one-goalie`<\/li><li><strong>Directions:<\/strong> Teams wait above the faceoff circles; play 2v2 in front of the net area with a shooting board for each team at the top of the circle instead of a goalie. The coach on the blue line plays a puck in to start; change on the coach's signal. Defending focus: stay between opponent and goal, cut off passing lanes, play the body, apply stick pressure and be ready for the loose puck.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=tjsSHPu_eWU<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.iihf.com/en/coaching/18952/2vs2-shooting-board\" target=\"_blank\" rel=\"noopener\">https://www.iihf.com/en/coaching/18952/2vs2-shooting-board<\/a><\/li><\/ul>\n<h2>59. 1vs1 Three-Gate Game (IIHF Skills4Life)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> 1v1 inside a faceoff circle with three gates on the rim. The puck carrier tries to carry the puck out through any gate against a defender; on a turnover roles flip immediately. Teaches winning space with skating and deception, protecting the puck with body position, and readiness to regain possession. No goalie needed.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FRqZepqBTlI<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.iihf.com/en/coaching/19068/1vs1-three-gate-game\" target=\"_blank\" rel=\"noopener\">https://www.iihf.com/en/coaching/19068/1vs1-three-gate-game<\/a><\/li><\/ul>\n<h2>60. Neutral Zone Passing Station #1<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up|one-goalie`<\/li><li><strong>Directions:<\/strong> Three side-by-side passing lanes in the neutral zone (or two longer lanes for fewer players) so six players go at once. Partners make one pass between each set of cones; at the last cone they turn toward each other, switch sides with a drop pass to the partner's forehand, and pass between each cone on the way back. Switch sides every rep for forehand and backhand reps.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=LjDYuPzM6aY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/neutral-zone-passing-station-1\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/neutral-zone-passing-station-1<\/a><\/li><\/ul>\n<h2>61. Transition Pivot Races<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Two teams line up on either side of the center circle; coach at center with pucks. On the whistle skate forward until both feet are inside the blue line, pivot backward to a cone, pivot forward around it and back into the zone, then pivot backward to the second cone at center, open up to forward and race to the puck the coach places near the blue line. Open the hips without crossing over; the race adds urgency to footwork.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=nsBIiBy02Mw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/transition-pivot-hockey-races\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/transition-pivot-hockey-races<\/a><\/li><\/ul>\n<h2>62. Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|sag|one-goalie`<\/li><li><strong>Directions:<\/strong> Version 1: two attackers stay behind a drawn line and pass through a faceoff circle (one defender inside with an active stick) for one-timers. Version 2: 2v1, 2v2 or 3v1 inside the circle using the circle edge or bumpers as the boundary. Version 3: monkey-in-the-middle with passers on the rim moving the puck quickly around 1–2 defenders inside (4v2). Versions 2–3 run with no goalie at all.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=RyLQIUL6Pek<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=RyLQIUL6Pek<\/a><\/li><\/ul>\n<h2>63. Tire Deke &amp; Shoot Station<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Players skate with a puck, deke around a tire, and take a quick shot on goal in a continuous, high-rep station. On one-goalie nights shoot into a shooter tutor, an upside-down net, or tires/targets in an empty net so the goalie is free for another station. Cue head up on the approach and release in stride after the deke.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=K5fqjKMuk5k<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=K5fqjKMuk5k<\/a><\/li><\/ul>\n<h2>64. Upside-Down Net Target Shooting (no goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-goalie`<\/li><li><strong>Directions:<\/strong> When there is no goalie for a station, lay a spare net on its back and push it against the standing net so only a narrow strip near the crossbar stays open. Players shoot and finish at the small target, which rewards elevating the puck under control and keeps shooting stations alive without a netminder. Pucks only — nobody stands in the crease.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ln-puBCmBvg<\/a> <em>(note: Needs a spare net from the rink.)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ln-puBCmBvg<\/a><\/li><\/ul>\n<h2>65. Shooting Recovery Drill (2 shooters, goalie reset)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Goalie-specific drill from the OHL Coaches Conference clip: two shooters alternate — a low shot, the goalie recovers to his feet and sets on the next shooter — then progress to setting up on the rebound before moving to the next shooter. Short, controlled reps that build recovery and tracking habits. Ideal for the goalie's first 2–3 minutes of shots while skaters run a no-goalie station.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=64Aw6F2d9Ak<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=64Aw6F2d9Ak<\/a><\/li><\/ul>\n<h2>66. Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> USA Hockey coaching tip: give goalies a real warm-up at the start (goalie coach or an assistant) and choose team drills that train game situations, such as stopping/setting pucks behind the net in 2-on-1s. Pair it with USA Hockey's goaltending guidance: quality of reps over quantity, let the goalie reset and track the rebound between shots, and in high-volume drills let them hop out for a few reps — skaters shooting at an empty net for a few reps doesn't ruin the drill.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=g-GT6LRA9Nw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.usahockey.com/news_article/show/1352978\" target=\"_blank\" rel=\"noopener\">https://www.usahockey.com/news_article/show/1352978<\/a><\/li><\/ul>\n<h2>67. Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> The Coaches Site talk by Jeff Lerg: in a poll of 153 goalies most wanted a warm-up with a coach first and preferred small-area games later, after they had seen pucks. Goalie reps should include pre-shot movement, lateral plays and traffic like real games; when ice is limited, a coach can work the goalie in a corner while the team runs a no-goalie or one-goalie game. Goalies own their movement warm-up while skaters warm up.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ocit0BtG3Sw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ocit0BtG3Sw<\/a><\/li><\/ul>\n<h2>68. Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Advice for head coaches on not wearing goalies out in practice: drop rapid-fire drills, build a gap between shots so the goalie can track the rebound into the corner, and train in proportion to games (more zone-play looks, fewer endless line rushes and slappers from the top of the circles). Make warm-ups for the goalie, not the shooters, and occasionally track practice save percentage so every puck matters.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ywcijl1ak_c<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ywcijl1ak_c<\/a><\/li><\/ul>\n<h2>Focus additions: 2-on-1s, zone entries, one-timers (added 2026-10-19)<\/h2>\n<h2>69. One-Timer Partner Progression<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-timer|warm-up`<\/li><li><strong>Directions:<\/strong> Partners 15–20 ft apart; pass into the receiver's wheelhouse, receiver opens stick, lower hand down, takes ice behind the puck and one-times it back. Stationary → gliding → moving into the lane.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/216889294\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/216889294<\/a> <em>(IHS \"Taking A One-Timer\", Dwayne Blais; page: <a href=\"https://www.icehockeysystems.com/skill-development-videos/improve-one-timer\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/skill-development-videos/improve-one-timer<\/a>)<\/em><\/li><\/ul>\n<h2>70. 1v1 Wide Drive &amp; Delay Entry<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|zone-entry`<\/li><li><strong>Directions:<\/strong> Carry in vs a D at the blue line: drive wide with speed and cut around, or punch-turn/delay at the wall and hit the late support player in the high slot. Carry between the dots if the D backs off; never close your own gap.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=fYTtgap0FD4\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fYTtgap0FD4<\/a> <em>(Train 2.0 Hockey, \"How to Enter the Offensive Zone\")<\/em><\/li><\/ul>\n<h2>71. One Timer – Exchange Passes with Coach<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-timer`<\/li><li><strong>Directions:<\/strong> Swing through the slot, exchange passes with the coach on the half wall, curl to the weak-side flank/slot and one-time the return pass. Alternate sides.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=SITF8VB0uqg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=SITF8VB0uqg<\/a> <em>(Tom Molloy, \"T1-B2 - One Timer - Exchange Passes with Coach – Pro\")<\/em><\/li><\/ul>\n<h2>72. Chip n Chase Small Area Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|zone-entry`<\/li><li><strong>Directions:<\/strong> Possession team chips past the D into space and wins the race before attacking, or carries in with a clean lane. One-timer goals count double.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=mUFHMpRuXN0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=mUFHMpRuXN0<\/a> <em>(Evolution Hockey, \"Small area game - chip n chase\")<\/em><\/li><\/ul>\n<h2>73. Kick-Out / Middle Drive Rush Entries (Todd Woodcroft)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|zone-entry|2-on-1`<\/li><li><strong>Directions:<\/strong> Middle carrier drives the D back, kicks out wide and middle-drives the net; late man fills the dot lane a step behind. Wide player shoots, hits the driver, or feeds the late man. Live 2-on-1 → 3-on-2.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=IH5bL9IJBaU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IH5bL9IJBaU<\/a> <em>(The Coaches Site, \"Todd Woodcroft - Creating Offence From Zone Entries\")<\/em><\/li><\/ul>\n<h2>Focus additions: 3v3 / 4v3 small-area games (added 2026-10-19)<\/h2>\n<h2>74. 4 Dot Quick Warmup<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Hpq3DYJ1IeU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Hpq3DYJ1IeU<\/a> <em>(HockeyShare)<\/em><\/li><\/ul>\n<h2>75. Cross-Ice 3v3 Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=-Vxk7V3HXvA\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=-Vxk7V3HXvA<\/a> <em>(Evolution Hockey)<\/em><\/li><\/ul>\n<h2>76. 4v3 Breakout Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|4v3|breakout`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Rk5x2QYYmtk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Rk5x2QYYmtk<\/a> <em>(Hockey Coach Vision)<\/em><\/li><\/ul>\n<h2>77. 3v3 Royal Road<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=KVALab3nGHI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=KVALab3nGHI<\/a> <em>(HockeyShare)<\/em><\/li><\/ul>\n<h2>78. 3vs3 Blast Off (rush)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|3v3|zone-entry`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=xgZ_AAL1xdk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=xgZ_AAL1xdk<\/a> <em>(The Coaches Site)<\/em><\/li><\/ul>\n<h2>79. Medicine Hat 3v3<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3|compete`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=BhwSW95zfao\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=BhwSW95zfao<\/a> <em>(Hockey Coach Vision)<\/em><\/li><\/ul>\n<h2>80. 3v3 + Perimeter Options<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3|one-goalie`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=jgwiGSKJRcU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jgwiGSKJRcU<\/a> <em>(Vision Hockey Group)<\/em><\/li><\/ul>\n<h2>81. 3 v 3 Corner Hockey Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3|one-goalie`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=9EzHIoxO9Ow\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=9EzHIoxO9Ow<\/a> <em>(IceHockeySystems)<\/em><\/li><\/ul>\n<h2>82. Revolving 2 on 1<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|2-on-1|one-goalie`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=-Te9RY3JcUY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=-Te9RY3JcUY<\/a> <em>(Hockey Eastern Ontario)<\/em><\/li><\/ul>"}, "built_at": "2026-10-25T19:04:19.607828-04:00"}, "private_url": "https://franks-hub-private.pages.dev/"}</script>
