 entry / PK pressure)<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>Ride The Bull<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Ride The Bull is a small area game from Matt Thomas that works on developing puck protection and possession skills under pressure. Teams must protect the puck, use their teammates, and keep possession for 8 seconds. If they are able to accomplish this, they are awarded a 3rd teammate and each teams begin game play to try to score on the opposing teams net.<\/li><li>Video: <a href=\"https://vimeo.com/1228177222\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1228177222<\/a><\/li><\/ul>\n<h3>Station 2 — contact|sag<\/h3>\n<p><strong>New Jersey 1v1 / 2v2 Contact SAG<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Below-hash or half-zone boxes. Dump a puck; 1v1 then 2v2 with legal contact taught that night. Winner exits to a shot. Stop illegal hits immediately. Angle first, stick second, body third.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><\/ul>\n<h3>Station 3 — warm-up|skills<\/h3>\n<p><strong>Pit Chaos Handling with Passes<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pit Chaos Handling With Passing drill is an excellent activity that helps players work on awareness, puck handling, and passing skills. This drill can be used as a warm-up in practice or games, or as a drill to reinforce keeping your head up. Setup Setup 2, 3, or 4 players in the middle of a face-off circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 v 1 Angle &amp; Gap Full Ice Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-ice 1v1 emphasizing angle and gap. Defender closes on an angle (stick on ice, outside shoulder lined up) while the attacker reads pressure and attacks open ice. Keep shifts short; reward the defender for forcing outside and the attacker for protecting the puck through contact.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Bentley Wall Cycling Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This drill helps players work on their wall play and cycling under pressure. SETUP: This is a half ice drill, there should be a net in its usual spot on the goal line. There should be a line of players starting on one of the dots with a pile of pucks.<\/li><li>Video: <a href=\"https://vimeo.com/1104965949\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1104965949<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Special-teams habits (PP entry / PK pressure)<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Ride The Bull*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>.<\/strong> 3v3, score by passing through one of three tire gates to a teammate; no net, no goalie. Keeps tonight's focus (Special-teams habits (PP entry / PK pressure)) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *New Jersey 1v1 / 2v2 Contact SAG*.<\/strong> The winner's exit shot goes on Liam; during his rest windows the exit shot goes at a tire in the empty net. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *Pit Chaos Handling with Passes<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (1 v 1 Angle &amp; Gap Full Ice Hockey Drill)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">Power Play Scoring Competition (Wes Wolfe)<\/a>. 60-s PP rounds on Liam: 5-on-0 entry, then one PKer added every 15 s up to 5-on-4; most goals wins. Tonight's constraint: entry must use the planned route (drop or kick-out); PK earns a point for every clear. <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Backcheck Small Area Game (tracking)*? Attack only toward Liam's net; when the backcheckers win the puck they 'score' by passing to their partners waiting in the small neutral zone.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Bentley Wall Cycling Drill* → Already a one-net half-ice drill — keep it on Liam's net and alternate sides every rep so shots come from both walls. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">Sticks In Lanes Game (Topher Scott)<\/a>. 6 fixed attackers vs 2 defenders in the middle, one net; 2+ passes through the middle before a shot; sticks on the ice. Theme rule: run it 6v3 (PP vs PK); 3 passes through the middle before a shot. <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *1v1 Race to the Puck → 3v3 Transition Drill* → The race and the 3v3 attack Liam's net; on a change of possession the new team must complete a pass to the coach at the blue line (that's the 'transition') before attacking the same net. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: PP one-timers only after 2+ passes; whistle after each goal or freeze so he resets.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-01-11", "title": "JJHC Varsity Practice — January 11, 2027", "focus": "Puck protection under contact", "time": "8:30 PM–9:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — January 11, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>January 11, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:30 PM–9:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Puck protection under contact<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Angle first → stick second → body third. Heads up. No from-behind.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Crease tracking during contact stations; no body-contact role. Soft shots from hashes when free.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Partner Bump / Controlled Contact Confidence<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|sag<\/h3>\n<p><strong>New Jersey 1v1 / 2v2 Contact SAG<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Below-hash or half-zone boxes. Dump a puck; 1v1 then 2v2 with legal contact taught that night. Winner exits to a shot. Stop illegal hits immediately. Angle first, stick second, body third.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><\/ul>\n<h3>Station 2 — warm-up|skills<\/h3>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>3 v 3 Play Fast Game that Involves the WHOLE TEAM<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team 3v3 play-fast small-area game. Keep all lines rotating with short shifts so nobody stands. Emphasize first touch, immediate support, and transition the instant possession changes.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/8loIyjdiosg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/8loIyjdiosg<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Angle Half-Ice Hockey Game with Defensive Reward<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Half-ice 2v2 with angling focus and a defensive reward rule (e.g., clear/score after a takeaway). Offense must move to support; defense angles first, then stick, then body. Continuous short shifts so everyone gets reps.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Bentley Wall Cycling Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This drill helps players work on their wall play and cycling under pressure. SETUP: This is a half ice drill, there should be a net in its usual spot on the goal line. There should be a line of players starting on one of the dots with a pile of pucks.<\/li><li>Video: <a href=\"https://vimeo.com/1104965949\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1104965949<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Puck protection under contact<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Partner Bump / Controlled Contact Confidence* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Liam's station — Station 1: *New Jersey 1v1 / 2v2 Contact SAG*.<\/strong> The winner's exit shot goes on Liam; during his rest windows the exit shot goes at a tire in the empty net. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 2: *Side Middle Side<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 3 (*3 v 3 Play Fast Game that Involves the WHOLE TEAM*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (Puck protection under contact) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">2v2 Tight Area in Corner (1 Goalie)<\/a>. Net angled in the corner, dividers box the area; 2v2, 45-s shifts, keep score. Tonight's constraint: a goal counts double if the scorer protected through contact on the wall first. <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Angle Half-Ice Hockey Game with Defensive Reward*? Already half-ice to one net — keep it on Liam's net; the defensive reward stays a clear/outlet pass to the coach, so no second net is needed.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Bentley Wall Cycling Drill* → Already a one-net half-ice drill — keep it on Liam's net and alternate sides every rep so shots come from both walls. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Theme rule: the below-goal-line rule forces a protected carry or pass under pressure. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Gates of Buffalo 3 vs. 3 Game* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after the carrier separates; no hacking at rebounds under his pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-01-13", "title": "JJHC Varsity Practice — January 13, 2027", "focus": "Activation & late D support", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — January 13, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>January 13, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Activation &amp; late D support<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>Swedish 2 vs 1 (Cross Ice)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This is a phenomenal drill in several ways. First, the concept of this drill can be used in many different areas of the ice. Secondly, it forces players to think 2 on 1's in tight spaces.<\/li><li>Video: <a href=\"https://vimeo.com/342763238\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/342763238<\/a><\/li><\/ul>\n<h3>Station 2 — sag|skills<\/h3>\n<p><strong>3 v 3 Play Fast Game that Involves the WHOLE TEAM<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team 3v3 play-fast small-area game. Keep all lines rotating with short shifts so nobody stands. Emphasize first touch, immediate support, and transition the instant possession changes.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/8loIyjdiosg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/8loIyjdiosg<\/a><\/li><\/ul>\n<h3>Station 3 — systems|skills<\/h3>\n<p><strong>NZ Give and Go<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop off-puck movement and teach players to create give-and-go opportunities by moving immediately after a pass. The game encourages players to think ahead, recognize available space, and create new passing lanes to get the puck back. 2 game in the neutral zone .<\/li><li>Video: <a href=\"https://vimeo.com/1223931767\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223931767<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 v 1 Angle &amp; Gap Full Ice Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-ice 1v1 emphasizing angle and gap. Defender closes on an angle (stick on ice, outside shoulder lined up) while the attacker reads pressure and attacks open ice. Keep shifts short; reward the defender for forcing outside and the attacker for protecting the puck through contact.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Activation &amp; late D support<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Chicago 5 Puck Warm-Up Hockey Drill For Full Team* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Swedish 2 vs 1 (Cross Ice)*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">Neutral Zone Passing Station #1<\/a>.<\/strong> Partners skate a cone lane making one pass per gap, drop-pass switch at the end, pass back; switch sides every rep. Keeps tonight's focus (Activation &amp; late D support) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *3 v 3 Play Fast Game that Involves the WHOLE TEAM*.<\/strong> Keep Liam's net live and put two tires on the far-end dots — the team attacking that way scores by hitting a tire. Flip ends at the halfway whistle. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *NZ Give and Go<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (1 v 1 Angle &amp; Gap Full Ice Hockey Drill)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/a>. 2v1/3v2 pass-count game (first to 3 tape-to-tape passes; defender scores on any touch); winners get a 2-on-0 on Liam. Tonight's constraint: the outlet player is a D; the attack only counts once he's activated and touched the puck. <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Transition Hockey Game from NHL Development Camp*? One net: after a turnover the new offense must pass to the coach at the top of the circle before attacking Liam.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">Neutral Zone Passing Station #1<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Perry Pearn Tracking Game* → Play it in Liam's zone; the defending team's controlled exit over the blue line counts as their goal, so no second net is needed. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">3 v 2 Dot Jumper<\/a>. 2v2 race on a coach chip; each team's dot player is frozen until it gets a pass, then jumps in for a 3v2 on Liam's net. Theme rule: dot player (a D) must activate below the hash marks before a goal counts. <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *2 vs 2 Rebound Battle Hockey Game* → Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Activated D shoot low for tips; one shot per activation.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-01-18", "title": "JJHC Varsity Practice — January 18, 2027", "focus": "Middle-ice deny & stick detail", "time": "8:00 PM–9:00 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — January 18, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>January 18, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:00 PM–9:00 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Middle-ice deny &amp; stick detail<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Ice Hockey Passing Drill - Rondo Progressions<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Rondo-style passing progressions (keep-away circles). Start with more attackers than defenders and shrink the outlet time. Cue one-touch options and body shape to receive.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|skills<\/h3>\n<p><strong>Angle Behind Net + Stick Check<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: O carries behind the net; X angles to force outside/into the corner and finishes with stick lift/press or controlled rub—no open-ice charge. Switch roles every few reps. Cue: stay slightly behind until the carrier clears the net, then close.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h3>Station 2 — contact|sag<\/h3>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>The Box Game - Give &amp; Go Small Area Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Small-area give-and-go game inside a marked box. Score by connecting give-and-goes or hitting a target rule set by the coach. Cue pass-and-move immediately; sticks on ice for support.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=gcgkBs58qFk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=gcgkBs58qFk<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Oreo<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Oreo 3 V 3 Game from Jason Lammers is a continuous game that is competitive in nature as it forces the defense to work to pass the puck to the next players in line, while the offensive team is trying to score. Setup In this example, 3 players line up on the blue line. The players behind them are on the opposite team.<\/li><li>Video: <a href=\"https://vimeo.com/847506383\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/847506383<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>3 on 3 Down-Low Rebound Battle Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Below-the-dots 3v3 rebound battle. Play off goalie rebounds and second chances; defense boxes out, offense crashes with sticks on ice. High-value for Liam’s rebound control.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=ZEFVgm1aC4g\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZEFVgm1aC4g<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Middle-ice deny &amp; stick detail<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Ice Hockey Passing Drill - Rondo Progressions* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Angle Behind Net + Stick Check<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *1v1 Race to the Puck → 3v3 Transition Drill*.<\/strong> The race and the 3v3 attack Liam's net; on a change of possession the new team must complete a pass to the coach at the blue line (that's the 'transition') before attacking the same net. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *The Box Game - Give &amp; Go Small Area Hockey Game<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (1 on 1 Tips for Hockey Players: The Attack Position)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=TK4IZmmb_y0\" target=\"_blank\" rel=\"noopener\">Gretzky 3 vs 2 Behind the Net<\/a>. Below the circle tops, one net; team of 3 must always keep a forward below the goal line, D talk through the switches. Tonight's constraint: defenders get a point for any pass from behind the net they block with a stick. <a href=\"https://www.youtube.com/watch?v=TK4IZmmb_y0\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Transition Hockey Game from NHL Development Camp*? One net: after a turnover the new offense must pass to the coach at the top of the circle before attacking Liam.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Oreo* → Keep it on Liam's net (offense scores, defense outlets to the next line); cap shifts at 30 s so the shot count stays sane. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">Sticks In Lanes Game (Topher Scott)<\/a>. 6 fixed attackers vs 2 defenders in the middle, one net; 2+ passes through the middle before a shot; sticks on the ice. Theme rule: run 6v3; the third defender guards the middle seam. <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *3 on 3 Down-Low Rebound Battle Drill* → Liam's net; one coach shot per rep and play the rebounds out; 25–30 s shifts with a two-second pause after every whistle so he can reset. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only through a lane the offense earned; no point blasts through a forest of sticks.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-01-20", "title": "JJHC Varsity Practice — January 20, 2027", "focus": "Scoring habits — catch & release", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — January 20, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>January 20, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Scoring habits — catch &amp; release<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|skills<\/h3>\n<p><strong>Angle Behind Net + Stick Check<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: O carries behind the net; X angles to force outside/into the corner and finishes with stick lift/press or controlled rub—no open-ice charge. Switch roles every few reps. Cue: stay slightly behind until the carrier clears the net, then close.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h3>Station 2 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Station 3 — contact|sag<\/h3>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Scoring habits — catch &amp; release<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Defensive Transition Passing Warm-Up Drill for Hockey Players* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Angle Behind Net + Stick Check<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3 (*1v1 Race to the Puck → 3v3 Transition Drill*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">Upside-Down Net Target Shooting (no goalie)<\/a>.<\/strong> Lay a spare net on its back against the standing net so only the top strip is open; shoot to the small target. Keeps tonight's focus (Scoring habits — catch &amp; release) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (Perry Pearn Tracking Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">3 v 2 Dot Jumper<\/a>. 2v2 race on a coach chip; each team's dot player is frozen until it gets a pass, then jumps in for a 3v2 on Liam's net. Tonight's constraint: the dot player must shoot within one touch of receiving. <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Transition Hockey Game from NHL Development Camp*? One net: after a turnover the new offense must pass to the coach at the top of the circle before attacking Liam.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">Upside-Down Net Target Shooting (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Pioneer 2 V 2 Rush* → One direction only, into Liam's end; the next pair leaves when Liam is set, and the D come back up the wall as their rest. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">Swiss 4 vs 2 Scoring Game<\/a>. Zone split high/low into two 2v1s on Liam's net (4 v 2); defenders stay in their area, shot within ~5 s. Theme rule: high 2v1 shots must be catch-and-release; low 2v1 finishes rebounds. <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Back to Back Net Battle Hockey Game* → Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Catch-and-release from the slot/circles, each off a pass, and Liam sees the passer first — no blind back-to-back shots.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-01-25", "title": "JJHC Varsity Practice — January 25, 2027", "focus": "Backcheck & recovery races", "time": "8:00 PM–9:00 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — January 25, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>January 25, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:00 PM–9:00 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Backcheck &amp; recovery races<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|sag<\/h3>\n<p><strong>2 v 2 Angle Half-Ice Hockey Game with Defensive Reward<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Half-ice 2v2 with angling focus and a defensive reward rule (e.g., clear/score after a takeaway). Offense must move to support; defense angles first, then stick, then body. Continuous short shifts so everyone gets reps.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><\/ul>\n<h3>Station 2 — sag|skills<\/h3>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<h3>Station 3 — skills|systems<\/h3>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li>Video: <a href=\"https://vimeo.com/434166992\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/434166992<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Buffalo 2v2 to 3v3 to 4v4<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective A high tempo transition drill from Day 2 of the 2026 Buffalo Sabres Development Camp that Camp that starts as a 2v2 and progresses to a 3v3 and 4v4. Both teams are trying to defend &amp; score. Setup Nets on goal line and blue line.<\/li><li>Video: <a href=\"https://vimeo.com/1222710175\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1222710175<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Backcheck &amp; recovery races<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull the far-end net to the boards and set two tires on the goal line (tire targets). If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*2 v 2 Angle Half-Ice Hockey Game with Defensive Reward*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (Backcheck &amp; recovery races) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2: *Gates of Buffalo 3 vs. 3 Game<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *Use The Net 2 on 1 Hockey Drill*.<\/strong> Every rush goes into Liam's end; alternate start corners and send one 2-on-1 every ~20 s so he can set and track the late attacker. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (1 on 1 Tips for Hockey Players: The Attack Position)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">2 vs 2 Game (With 1 Goalie &amp; Tire Nets)<\/a>. Cross-ice; one team shoots on Liam, the other scores by hitting 2 tires at the far end; flip ends every time the tire team scores. Tonight's constraint: when the tire team scores, its opponents must sprint-backcheck to the far blue line before re-entering. <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 vs 2 Rebound Battle Hockey Game*? Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Picket Fences Game (2 vs. 2 or 3 vs. 3)* → Already a one-net game (offense shoots on Liam; defense scores by skating the puck between the tires) — run it exactly as written. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">Horseshoe Regroup 2-on-1 (one goalie)<\/a>. Shot + rebound, then a D-to-D regroup that turns into a 2-on-1 back into Liam's same net (the step-up D must recover his gap). Theme rule: the shooter from the first rush must backcheck through the middle on the 2-on-1. <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Buffalo 2v2 to 3v3 to 4v4* → Liam stays in the goal-line net; the blue-line net is swapped for two tires (or a net turned to the boards) that count only off a pass from below the dots. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: One rush shot + rebound per rep; backchecker races finish at the net, not on Liam's pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2027-01-27", "title": "JJHC Varsity Practice — January 27, 2027", "focus": "Controlled body contact & angling", "time": "8:30 PM–9:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — January 27, 2027<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>January 27, 2027<\/td><\/tr><tr><td>Ice<\/td><td>8:30 PM–9:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Controlled body contact &amp; angling<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Angle first → stick second → body third. Heads up. No from-behind.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Crease tracking during contact stations; no body-contact role. Soft shots from hashes when free.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Pit Chaos Handling with Passes<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pit Chaos Handling With Passing drill is an excellent activity that helps players work on awareness, puck handling, and passing skills. This drill can be used as a warm-up in practice or games, or as a drill to reinforce keeping your head up. Setup Setup 2, 3, or 4 players in the middle of a face-off circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|sag<\/h3>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<h3>Station 2 — skills|systems<\/h3>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<h3>Station 3 — sag|goalie|skills<\/h3>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only
