\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>F1 forecheck &amp; tracking<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Partner Bump / Controlled Contact Confidence* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*1 v 1 Use The Net*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2 (*2 vs 2 Rebound Battle Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>.<\/strong> 1v1 in a faceoff circle; carry the puck out through any of three gates, roles flip on a turnover. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Perry Pearn Tracking Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Tonight's constraint: pressure team: F1 must reach the puck carrier within 2 s of the goalie deflection; F2 takes the pass option. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>*Gates of Buffalo 3 vs. 3 Game* is already goalie-free, so keeping it as written is fine; use the one-net game above when you want Liam in the SAG block.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *3 on 3 Add a D* → Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Theme rule: forwards score double on a goal created by an F1 turnover. <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Offense 3 v 2 Cross-ice Hockey Game* → Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after a forecheck turnover, from below the tops of the circles — quality over volume.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-28", "title": "JJHC Varsity Practice — October 28, 2026", "focus": "Compete night — SAGs & battles", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 28, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 28, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Compete night — SAGs &amp; battles<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Let the game teach. Short shifts. Compete, then reset.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Full compete in SAG. Communicate box-outs and rebound sides.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table cl -back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<h3>Station 3 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Bentley Wall Cycling Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This drill helps players work on their wall play and cycling under pressure. SETUP: This is a half ice drill, there should be a net in its usual spot on the goal line. There should be a line of players starting on one of the dots with a pile of pucks.<\/li><li>Video: <a href=\"https://vimeo.com/1104965949\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1104965949<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Compete night — SAGs &amp; battles<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: move the second net back-to-back with Liam's net in the slot for the SAG. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Chicago 5 Puck Warm-Up Hockey Drill For Full Team* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Perry Pearn Tracking Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>.<\/strong> 2v2 net-front game with shooting boards (no goalie); defenders stay goal-side, cut lanes, play the body. Keeps tonight's focus (Compete night — SAGs &amp; battles) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *Back to Back Net Battle Hockey Game*.<\/strong> Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (Pioneer 2 V 2 Rush)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a>. Nets back-to-back in the slot, Liam covers BOTH; 2v2 or 3v3, each team must pass to its wall shooter before attacking. Tonight's constraint: keep score; losing team does the next tire setup; 30-s shifts because Liam covers both nets. <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 vs 2 Rebound Battle Hockey Game*? Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Bentley Wall Cycling Drill* → Already a one-net half-ice drill — keep it on Liam's net and alternate sides every rep so shots come from both walls. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">Tomas Holmstrom SAG (net-front)<\/a>. Box from the dots to the circle tops; 3 O vs 2 D fight for net-front while a shooter fires 5 pucks (one per whistle); attackers tag up outside the box every whistle. Theme rule: team-vs-team scoring across all five whistles. <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *3 on 3 Add a D* → Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Battles run long — cap shifts at 30–40 s and blow the whistle on any puck under Liam's pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-02", "title": "JJHC Varsity Practice — November 2, 2026", "focus": "O-zone cycle & low-to-high", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 2, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 2, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>O-zone cycle &amp; low-to-high<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Ice Hockey Passing Drill - Rondo Progressions<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Rondo-style passing progressions (keep-away circles). Start with more attackers than defenders and shrink the outlet time. Cue one-touch options and body shape to receive.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|contact<\/h3>\n<p><strong>Finders Keepers: A Fun Puck Protection Youth Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Puck-protection compete: carriers protect while chasers try to steal. Keep areas tight, rotate every 20–30 seconds, and cue low center of gravity with hands away from pressure.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=veI7-0o8n5o\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=veI7-0o8n5o<\/a><\/li><\/ul>\n<h3>Station 2 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Station 3 — sag|goalie|skills<\/h3>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Puck Race to Possession Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li>Video: <a href=\"https://vimeo.com/1210465912\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1210465912<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>3 on 3 Down-Low Rebound Battle Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Below-the-dots 3v3 rebound battle. Play off goalie rebounds and second chances; defense boxes out, offense crashes with sticks on ice. High-value for Liam’s rebound control.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=ZEFVgm1aC4g\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZEFVgm1aC4g<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Breakout Transition Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective: a 2 v 2 game were the offense is trying to score and the defense is working hard to create turnovers and breakout by passing the puck to their teammates at center ice. Setup: Set up nets across the zone. Draw a line down the middle of the ice from the blue line to end wall.<\/li><li>Video: <a href=\"https://vimeo.com/1122947715\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1122947715<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Buffalo 2v2 to 3v3 to 4v4<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective A high tempo transition drill from Day 2 of the 2026 Buffalo Sabres Development Camp that Camp that starts as a 2v2 and progresses to a 3v3 and 4v4. Both teams are trying to defend &amp; score. Setup Nets on goal line and blue line.<\/li><li>Video: <a href=\"https://vimeo.com/1222710175\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1222710175<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>O-zone cycle &amp; low-to-high<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Ice Hockey Passing Drill - Rondo Progressions* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Finders Keepers: A Fun Puck Protection Youth Hockey Drill<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *2 vs 2 Rebound Battle Hockey Game*.<\/strong> Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Puck Race to Possession Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=TK4IZmmb_y0\" target=\"_blank\" rel=\"noopener\">Gretzky 3 vs 2 Behind the Net<\/a>. Below the circle tops, one net; team of 3 must always keep a forward below the goal line, D talk through the switches. Tonight's constraint: a goal counts only after a low-to-high pass to the point area and a shot back through traffic. <a href=\"https://www.youtube.com/watch?v=TK4IZmmb_y0\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *3 on 3 Down-Low Rebound Battle Drill*? Liam's net; one coach shot per rep and play the rebounds out; 25–30 s shifts with a two-second pause after every whistle so he can reset.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Breakout Transition Game* → Only the offense shoots (on Liam); the defense scores by breaking the puck out to teammates at center. If it was set up with a second net, swap that net for a tire in the slot. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">Swiss 4 vs 2 Scoring Game<\/a>. Zone split high/low into two 2v1s on Liam's net (4 v 2); defenders stay in their area, shot within ~5 s. Theme rule: high 2v1 must touch the puck before the low 2v1 can shoot (low-to-high-to-low). <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Buffalo 2v2 to 3v3 to 4v4* → Liam stays in the goal-line net; the blue-line net is swapped for two tires (or a net turned to the boards) that count only off a pass from below the dots. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Low-to-high point shots must be low and tippable; no clappers from the blue line.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-04", "title": "JJHC Varsity Practice — November 4, 2026", "focus": "Gap control & rush defense", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 4, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 4, 2026< ate ~6–7 min<\/h2>\n<h3>Station 1 — contact|skills<\/h3>\n<p><strong>Puck Race to Possession Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li>Video: <a href=\"https://vimeo.com/1210465912\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1210465912<\/a><\/li><\/ul>\n<h3>Station 2 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Station 3 — warm-up|sag<\/h3>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>3 on 3 Down-Low Rebound Battle Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Below-the-dots 3v3 rebound battle. Play off goalie rebounds and second chances; defense boxes out, offense crashes with sticks on ice. High-value for Liam’s rebound control.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=ZEFVgm1aC4g\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZEFVgm1aC4g<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>NZ Give and Go<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop off-puck movement and teach players to create give-and-go opportunities by moving immediately after a pass. The game encourages players to think ahead, recognize available space, and create new passing lanes to get the puck back. 2 game in the neutral zone .<\/li><li>Video: <a href=\"https://vimeo.com/1223931767\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223931767<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Corner to Half Wall 2 vs 1<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Corner to Half Wall 2 vs 1 is an excellent small area game for all age levels that helps players practice a 2 vs 1 in a small space along the boards in the corner of the ice. The game reinforces important skills like keeping your head up, moving to open spaces, protecting the puck, and verbal &amp; non-verbal communication. Offensive players should practice using the boards to make bank passes.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=hnLu_shT2J0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=hnLu_shT2J0<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Gap control &amp; rush defense<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Defensive Transition Passing Warm-Up Drill for Hockey Players* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Liam's station — Station 1: *Puck Race to Possession Game*.<\/strong> Race in the circle; on the second whistle the winner attacks Liam and the loser defends — the defender scores by carrying it out through a blue-line gate. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 2: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 3 (*Start Practice with 12 Player Small Area Game!*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>.<\/strong> Head-to-head pivot race (forward–backward–forward) finishing in a race to a coach-placed puck; no goalie. Keeps tonight's focus (Gap control &amp; rush defense) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Tonight's constraint: D earn their point only after closing the gap and winning the puck before the hash marks. <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *3 on 3 Down-Low Rebound Battle Drill*? Liam's net; one coach shot per rep and play the rebounds out; 25–30 s shifts with a two-second pause after every whistle so he can reset.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *NZ Give and Go* needs no net — run it, then use the remaining minutes for <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">Horseshoe Regroup 2-on-1 (one goalie)<\/a>: Shot + rebound, then a D-to-D regroup that turns into a 2-on-1 back into Liam's same net (the step-up D must recover his gap). Theme rule: the step-up D must regain gap inside the dots and take away the pass with his stick. <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<p><strong>E. Finisher (54–60):<\/strong> *Corner to Half Wall 2 vs 1* → Already low-volume on one net — keep it on Liam's net and finish each rep with one shot only. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Rush reps only; the next rush leaves when Liam is set (~20 s), one shot + rebound.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-09", "title": "JJHC Varsity Practice — November 9, 2026", "focus": "Special-teams habits (PP entry / PK pressure)", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 9, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 9, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Special-teams habits (PP entry / PK pressure)<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|sag<\/h3>\n<p><strong>3 vs 1 Keep Away From Battery Hockey<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v1 keep-away to train support, deception, and defensive stick positioning. On turnover or after a time limit, flip roles. Progress to 3v2.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=x6epwQk1POE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=x6epwQk1POE<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<h3>Station 3 — warm-up|skills<\/h3>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Gates of Buffalo Small Area Passing Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The major concept of the Gates of Buffalo Small Area Hockey Game is to practice moving to open space, communicating verbally and non-verbally with teammates, so they can score Goals by passing through Gates. This game framework will help players learn to play with their head up, communicate with teammates and move to open space. As a coach, If you commit to working on activities like this instead of memorization drills for a portion of each practice, you will marvel at how your team begins to work together.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JlKKAFlVTLc\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JlKKAFlVTLc<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Special-teams habits (PP entry / PK pressure)<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *3 vs 1 Keep Away From Battery Hockey<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *3 on 3 Add a D*.<\/strong> Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (Backcheck Small Area Game (tracking))*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">Sticks In Lanes Game (Topher Scott)<\/a>. 6 fixed attackers vs 2 defenders in the middle, one net; 2+ passes through the middle before a shot; sticks on the ice. Tonight's constraint: PP side needs 2 passes through the middle before a shot; PK sticks on the ice or the coach awards a penalty shot. <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Offense 3 v 2 Cross-ice Hockey Game*? Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Perry Pearn Tracking Game* → Play it in Liam's zone; the defending team's controlled exit over the blue line counts as their goal, so no second net is needed. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">Power Play Scoring Competition (Wes Wolfe)<\/a>. 60-s PP rounds on Liam: 5-on-0 entry, then one PKer added every 15 s up to 5-on-4; most goals wins. Theme rule: each PP unit gets three 60-s rounds; PK scores by icing it. <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Gates of Buffalo Small Area Passing Game* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: PP one-timers only after 2+ passes; whistle after each goal or freeze so he resets.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-11", "title": "JJHC Varsity Practice — November 11, 2026", "focus": "Puck protection under contact", "time": "7:15 PM–8:15 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 11, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 11, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Puck protection under contact<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Angle first → stick second → body third. Heads up. No from-behind.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Crease tracking during contact stations; no body-contact role. Soft shots from hashes when free.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Pit Chaos Handling with Passes<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pit Chaos Handling With Passing drill is an excellent activity that helps players work on awareness, puck handling, and passing skills. This drill can be used as a warm-up in practice or games, or as a drill to reinforce keeping your head up. Setup Setup 2, 3, or 4 players in the middle of a face-off circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — systems|sag|contact<\/h3>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h3>Station 2 — skills|contact<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h3>Station 3 — sag|systems<\/h3>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li>Video: <a href=\"https://vimeo.com/434166992\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/434166992<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Corner Tires - Small Area Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Corner Tires is a small area game where the players score by hitting the tire with a puck. Set Up Place four tires on a rectangle as shown in the diagram. Make sure there is enough room from the tires to the edge so that there is room to play on all sides of the tires.<\/li><li>Video: <a href=\"https://vimeo.com/410680521\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/410680521<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Puck protection under contact<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Pit Chaos Handling with Passes* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Backcheck Small Area Game (tracking)*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>.<\/strong> 1v1 in a faceoff circle; carry the puck out through any of three gates, roles flip on a turnover. Keeps tonight's focus (Puck protection under contact) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2: *1 on 1 Tips for Hockey Players: The Attack Position<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *3 on 3 Add a D*.<\/strong> Keep Liam's net; replace the other net with two tires. The team going toward the tires must hit its activated D with a pass before it can score on a tire. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Tonight's constraint: carrier must protect with body between puck and defender for a 2-count before attacking the net. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Offense 3 v 2 Cross-ice Hockey Game*? Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Picket Fences Game (2 vs. 2 or 3 vs. 3)* → Already a one-net game (offense shoots on Liam; defense scores by skating the puck between the tires) — run it exactly as written. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">2v2 Tight Area in Corner (1 Goalie)<\/a>. Net angled in the corner, dividers box the area; 2v2, 45-s shifts, keep score. Theme rule: coach spots pucks to the wall — protect, roll off, attack. <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Corner Tires - Small Area Game* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after the carrier separates; no hacking at rebounds under his pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-16", "title": "JJHC Varsity Practice — November 16, 2026", "focus": "Activation & late D support", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 16, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 16, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Activation &amp; late D support<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|contact<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<h3>Station 3 — systems|skills<\/h3>\n<p><strong>Road Runner 3 v 2<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Road Runner 3v2 Overview: Road Runner 3v2 is a high-tempo, continuous rush drill that reinforces key rush principles for both offense and defense. It challenges attackers to make quick decisions off the rush, encourages defenders to manage gaps and sort responsibilities, and teaches the importance of F3 tracking through the neutral zone to kill plays from above. Setup Coach starts with a puck near the top of the circle.<\/li><li>Video: <a href=\"https://vimeo.com/1142140519\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1142140519<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Angle Behind Net + Stick Check<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: O carries behind the net; X angles to force outside/into the corner and finishes with stick lift/press or controlled rub—no open-ice charge. Switch roles every few reps. Cue: stay slightly behind until the carrier clears the net, then close.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Picket Fences Game (2 vs. 2 or 3 vs. 3)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Picket Fences is a great small area hockey game that can be setup as a 2 vs. The offensive team gets 2 points for scoring a goal and the defensive team gets 1 point by skating the puck between the tires . Setup: Teams are set up in one of the offensive zones in line with Dots.<\/li><li>Video: <a href=\"https://vimeo.com/434166992\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/434166992<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Gates of Buffalo Small Area Passing Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The major concept of the Gates of Buffalo Small Area Hockey Game is to practice moving to open space, communicating verbally and non-verbally with teammates, so they can score Goals by passing through Gates. This game framework will help players learn to play with their head up, communicate with teammates and move to open space. As a coach, If you commit to working on activities like this instead of memorization drills for a portion of each practice, you will marvel at how your team begins to work together.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JlKKAFlVTLc\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JlKKAFlVTLc<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Activation &amp; late D support<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *1 on 1 Tips for Hockey Players: The Attack Position<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2 (*3 on 3 Add a D*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>.<\/strong> 3v3, score by passing through one of three tire gates to a teammate; no net, no goalie. Keeps tonight's focus (Activation &amp; late D support) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Road Runner 3 v 2*.<\/strong> Rushes go only into Liam's end; the return rush finishes with a pass through a cone gate at the far blue line instead of a shot. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Angle Behind Net + Stick Check)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">3 v 2 Dot Jumper<\/a>. 2v2 race on a coach chip; each team's dot player is frozen until it gets a pass, then jumps in for a 3v2 on Liam's net. Tonight's constraint: the dot player is a D — he jumps in as the late attacker and must get a shot or a touch in the slot. <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Start Practice with 12 Player Small Area Game!*? Play it to tire targets (two tires per end) instead of nets — no goalie needed.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Picket Fences Game (2 vs. 2 or 3 vs. 3)* → Already a one-net game (offense shoots on Liam; defense scores by skating the puck between the tires) — run it exactly as written. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/a>. 2v1/3v2 pass-count game (first to 3 tape-to-tape passes; defender scores on any touch); winners get a 2-on-0 on Liam. Theme rule: in the 2v1 pass game the third (late) player must be the one who finishes the 2-on-0. <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Gates of Buffalo Small Area Passing Game* is goalie-free — run as written; Liam does 2 minutes of easy lateral movement and stretches in the crease.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Activated D shoot low for tips; one shot per activation.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-11-18", "title": "JJHC Varsity Practice — November 18, 2026", "focus": "Middle-ice deny & stick detail", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — November 18, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>November 18, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Middle-ice deny &amp; stick detail<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wr
