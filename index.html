Jan 24, 2027", "time": "5:45 PM", "home_away": "home", "opponent": "Washingtonville Wizards", "location": "McCann Ice Arena", "game_type": "regular_season", "status": "scheduled", "past": false, "score": null, "url": "https://gamesheetstats.com/seasons/15368/games/3077969"}], "first": "Fri Oct 30, 2026", "last": "Sun Jan 24, 2027"}]}, "jjplans": {"source": "/workspace/coachy/plans", "count": 39, "today": "2026-11-07", "next_date": "2026-11-09", "plans": [{"date": "2026-10-05", "title": "JJHC Varsity Practice — October 5, 2026", "focus": "Controlled body contact & angling", "time": "8:00 PM–9:00 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 5, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 5, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:00 PM–9:00 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Controlled body contact &amp; angling<\/strong> (night #1)<\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Angle first → stick second → body third. Heads up. No from-behind. Check to win the puck.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Crease tracking during contact stations; no body-contact role. Soft shots from hashes when free; full compete in SAG.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Pit Chaos Handling with Passes<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2–4 players stickhandle inside a faceoff circle while 3–4 outside pass around the rim. Rotate every 20–30s. Heads up, find open ice, scan before the pass.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><li>Source: <a href=\"https://www.icehockeysystems.com/hockey-drills/pit-chaos-handling-passes\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/pit-chaos-handling-passes<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges; 5–8 Pit Chaos (both circles if numbers allow).<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact<\/h3>\n<p><strong>1 v 1 Angle &amp; Gap Full Ice Hockey Drill<\/strong> *(Hub Short)*<\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-ice 1v1 emphasizing angle and gap. Defender closes on an angle (stick on ice, outside shoulder lined up) while the attacker reads pressure and attacks open ice. Keep shifts short; reward forcing outside.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><li>Source: <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<h3>Station 2 — contact / skills<\/h3>\n<p><strong>Partner Bump / Controlled Contact Confidence<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=jai0vHhRuEY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jai0vHhRuEY<\/a><\/li><li>Source: <a href=\"https://www.youtube.com/watch?v=jai0vHhRuEY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jai0vHhRuEY<\/a><\/li><\/ul>\n<h3>Station 3 — skills / goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Receive in motion and shoot in one action. Emphasize catch-and-release and getting pucks through. Feed Liam quality looks from slot/hashes.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><li>Source: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<p><strong>Contact sprinkle:<\/strong> <strong>Angle Behind Net + Stick Check<\/strong> — O behind net, X angles to corner; stick lift/press or controlled rub only. Video: <a href=\"https://www.youtube.com/watch?v=m88qmzCcERw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=m88qmzCcERw<\/a><\/p>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Angle Half-Ice Hockey Game with Defensive Reward<\/strong> *(Hub Short)*<\/p>\n<ul class=\"jjp-ul\"><li>Directions: Half-ice 2v2 with angling focus and a defensive reward after a takeaway. Continuous short shifts.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><li>Source: <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<p>Progression last 5 min: <strong>New Jersey 1v1 / 2v2 Contact SAG<\/strong> (legal contact under tonight’s rules). Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice; retrieval must go behind net before attacking; on turnover, F1 pressures. Reward attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><li>Source: <a href=\"https://www.admkids.com/news_article/show/754281-10u-18u-f1-forecheck-game\" target=\"_blank\" rel=\"noopener\">https://www.admkids.com/news_article/show/754281-10u-18u-f1-forecheck-game<\/a><\/li><\/ul>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong> *(Hub Short)*<\/p>\n<ul class=\"jjp-ul\"><li>Directions: 1v1 race to dumped puck, then layer to 3v3 transition as support arrives.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><li>Source: <a href=\"https://bottz77.github.io/franks-hub/#/johnjay\" target=\"_blank\" rel=\"noopener\">https://bottz77.github.io/franks-hub/#/johnjay<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate; repeat board cue. Optional 60s leadership clip: <a href=\"https://www.youtube.com/shorts/wwOIUxHVMTw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/wwOIUxHVMTw<\/a><\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Controlled body contact &amp; angling<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Pit Chaos Handling with Passes* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*1 v 1 Angle &amp; Gap Full Ice Hockey Drill*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>.<\/strong> 1v1 in a faceoff circle; carry the puck out through any of three gates, roles flip on a turnover. Keeps tonight's focus (Controlled body contact &amp; angling) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 2: *Partner Bump / Controlled Contact Confidence<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *Shooting Off The Pass - Offensive Zone Hockey Drill*.<\/strong> Two lines, alternate sides; one shot + one rebound per rep and the next shooter only goes when Liam is set (~15–20 s). Cap it at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">2v2 Tight Area in Corner (1 Goalie)<\/a>. Net angled in the corner, dividers box the area; 2v2, 45-s shifts, keep score. Tonight's constraint: defender must angle first, stick second, body third — legal contact only; a clean angle-and-pin that wins the puck = 1 point. <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Angle Half-Ice Hockey Game with Defensive Reward*? Already half-ice to one net — keep it on Liam's net; the defensive reward stays a clear/outlet pass to the coach, so no second net is needed.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *ADM F1 Forecheck Game (10U–18U)* → Cross-ice 3v3 to one net: the forecheck team attacks Liam; the retrieving team must skate behind Liam's net and then score by hitting a tire at the far end. The F1 pressure rule stays. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">Goal Line Small Area Game (USA Hockey)<\/a>. 2v2 on one net with Liam as neutral goalie; after every change of possession the puck must go below the goal line before attacking. Theme rule: on every possession change the new defender closes on an angle before the puck reaches the goal line. <a href=\"https://www.youtube.com/watch?v=nFqJT564ZgQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *1v1 Race to the Puck → 3v3 Transition Drill* → The race and the 3v3 attack Liam's net; on a change of possession the new team must complete a pass to the coach at the blue line (that's the 'transition') before attacking the same net. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: No shot while a contact battle is still in the crease; pucks low and from the slot only, and Liam calls 'time' if bodies land on him.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-07", "title": "JJHC Varsity Practice — October 7, 2026", "focus": "Skating edges, gaps & retrievals", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 7, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 7, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Skating edges, gaps &amp; retrievals<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Stations 1–2 (the 3v3 and race-to-3v3 nets) and the scoring blocks. Station 3 (Pit Chaos) has no net. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Ice Hockey Passing Drill - Rondo Progressions<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Rondo-style passing progressions (keep-away circles). Start with more attackers than defenders and shrink the outlet time. Cue one-touch options and body shape to receive.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>3 v 3 Play Fast Game that Involves the WHOLE TEAM<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team 3v3 play-fast small-area game. Keep all lines rotating with short shifts so nobody stands. Emphasize first touch, immediate support, and transition the instant possession changes.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/8loIyjdiosg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/8loIyjdiosg<\/a><\/li><\/ul>\n<h3>Station 2 — contact|sag<\/h3>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<h3>Station 3 — warm-up|skills<\/h3>\n<p><strong>Pit Chaos Handling with Passes<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pit Chaos Handling With Passing drill is an excellent activity that helps players work on awareness, puck handling, and passing skills. This drill can be used as a warm-up in practice or games, or as a drill to reinforce keeping your head up. Setup Setup 2, 3, or 4 players in the middle of a face-off circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=UxmQBKTJ2ss\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=UxmQBKTJ2ss<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>2 v 2 Angle Half-Ice Hockey Game with Defensive Reward<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Half-ice 2v2 with angling focus and a defensive reward rule (e.g., clear/score after a takeaway). Offense must move to support; defense angles first, then stick, then body. Continuous short shifts so everyone gets reps.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Skating edges, gaps &amp; retrievals<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Ice Hockey Passing Drill - Rondo Progressions* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*3 v 3 Play Fast Game that Involves the WHOLE TEAM*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">Transition Pivot Races<\/a>.<\/strong> Head-to-head pivot race (forward–backward–forward) finishing in a race to a coach-placed puck; no goalie. Keeps tonight's focus (Skating edges, gaps &amp; retrievals) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *1v1 Race to the Puck → 3v3 Transition Drill*.<\/strong> The race and the 3v3 attack Liam's net; on a change of possession the new team must complete a pass to the coach at the blue line (that's the 'transition') before attacking the same net. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *Pit Chaos Handling with Passes<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (2 v 2 Angle Half-Ice Hockey Game with Defensive Reward)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Tonight's constraint: every dump is a retrieval race — shoulder-check before the puck, tight turn away from pressure, first pass within two touches. <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Transition Hockey Game from NHL Development Camp*? One net: after a turnover the new offense must pass to the coach at the top of the circle before attacking Liam.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Use The Net 2 on 1 Hockey Drill* → Every rush goes into Liam's end; alternate start corners and send one 2-on-1 every ~20 s so he can set and track the late attacker. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">Horseshoe Regroup 2-on-1 (one goalie)<\/a>. Shot + rebound, then a D-to-D regroup that turns into a 2-on-1 back into Liam's same net (the step-up D must recover his gap). Theme rule: grade the step-up D on his gap — he must be back inside the dots before the 2-on-1 crosses the blue line. <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Back to Back Net Battle Hockey Game* → Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots come in stride off the retrieval only — no stop-and-blast; one shot max per retrieval rep.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-12", "title": "JJHC Varsity Practice — October 12, 2026", "focus": "Passing support & give-and-go", "time": "8:00 PM–9:00 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 12, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 12, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:00 PM–9:00 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Passing support &amp; give-and-go<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — warm-up|sag<\/h3>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<h3>Station 2 — skills|systems<\/h3>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>The Box Game - Give &amp; Go Small Area Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Small-area give-and-go game inside a marked box. Score by connecting give-and-goes or hitting a target rule set by the coach. Cue pass-and-move immediately; sticks on ice for support.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=gcgkBs58qFk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=gcgkBs58qFk<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>2 v 3 Entry Offense vs. Breakout Transition<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop quick transition habits from defense to offense, with an emphasis on getting two players to the puck quickly and turning possession into an immediate breakout. The game also creates opportunities to work on re-entry rush offense as players transition between offensive and defensive roles. 2 rush with an additional backchecking player, creating a 2 vs.<\/li><li>Video: <a href=\"https://vimeo.com/1223950056\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223950056<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Passing support &amp; give-and-go<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Defensive Transition Passing Warm-Up Drill for Hockey Players* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Start Practice with 12 Player Small Area Game!*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>.<\/strong> 3v3, score by passing through one of three tire gates to a teammate; no net, no goalie. Keeps tonight's focus (Passing support &amp; give-and-go) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *Use The Net 2 on 1 Hockey Drill*.<\/strong> Every rush goes into Liam's end; alternate start corners and send one 2-on-1 every ~20 s so he can set and track the late attacker. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3: *The Box Game - Give &amp; Go Small Area Hockey Game<\/strong>* — already goalie-free; run as written.<\/li><li>*Contact sprinkle (1v1 Race to the Puck → 3v3 Transition Drill)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/a>. 2v1/3v2 pass-count game (first to 3 tape-to-tape passes; defender scores on any touch); winners get a 2-on-0 on Liam. Tonight's constraint: a pass only counts if the passer moves to a new lane immediately (give-and-go); winners get the 2-on-0 on Liam. <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *2 v 2 Transition Hockey Game from NHL Development Camp*? One net: after a turnover the new offense must pass to the coach at the top of the circle before attacking Liam.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">The Gate Game (no goalie)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *2 v 3 Entry Offense vs. Breakout Transition* → The entry attacks Liam; the breakout team 'scores' by completing the exit pass to a coach at the red line. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">Swiss 4 vs 2 Scoring Game<\/a>. Zone split high/low into two 2v1s on Liam's net (4 v 2); defenders stay in their area, shot within ~5 s. Theme rule: goal counts double if it comes off a give-and-go between the high and low 2v1. <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Back to Back Net Battle Hockey Game* → Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only off a pass (catch-and-shoot or give-and-go); no rebound pile-ons after the whistle.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-14", "title": "JJHC Varsity Practice — October 14, 2026", "focus": "Shooting, rebounds & net-front", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 14, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 14, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Shooting, rebounds &amp; net-front<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — skills|systems<\/h3>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<h3>Station 2 — goalie|skills<\/h3>\n<p><strong>Practice Goalie Shuffles &amp; Edgework with No Crease<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Goalie edgework and shuffles that do not require a painted crease—use cones or boards. Pair with skater stations so Liam gets focused movement work while others rotate.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=EASYdYzvucU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=EASYdYzvucU<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>3 on 3 Play Fast Small Area Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Classic IHS 3v3 play-fast SAG. Short shifts, continuous play, reward speed of support after a pass. Pair with the Hub Short of the same theme for a quick visual before the whistle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>1v1 Race to the Puck → 3v3 Transition Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Start with a 1v1 race to a dumped puck, then layer into 3v3 transition as support arrives. Teaches win-the-puck-line body position, then immediate support and transition. Keep the whistle cadence high.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/lZgVOd8_TSI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/lZgVOd8_TSI<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Back to Back Net Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two nets back-to-back (or close). Teams attack opposite directions in a tight area, battling for possession and quick shots. High compete, high shot volume for the goalie when one net is live.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=k6WXVVGkfTo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=k6WXVVGkfTo<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Shooting, rebounds &amp; net-front<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers. His shuffles/edgework from Station 2 move here.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Liam's station — Station 1: *Use The Net 2 on 1 Hockey Drill*.<\/strong> Every rush goes into Liam's end; alternate start corners and send one 2-on-1 every ~20 s so he can set and track the late attacker. All three groups rotate through him, so keep reps short and controlled. Prefer more finishing looks? Swap in <a href=\"https://www.icehockeysystems.com/hockey-drills/half-ice-shoot-stride\" target=\"_blank\" rel=\"noopener\">Half Ice Shoot In Stride<\/a> — Two lines alternate: call for the coach's pass, shoot in stride before the cone, stop at the net for a rebound.<\/li><li><strong>Station 2 (*Practice Goalie Shuffles &amp; Edgework with No Crease*) → skater no-goalie station: <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">Upside-Down Net Target Shooting (no goalie)<\/a>.<\/strong> Lay a spare net on its back against the standing net so only the top strip is open; shoot to the small target. Keeps tonight's focus (Shooting, rebounds &amp; net-front) while Liam does his edgework in the warm-up instead. <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 3 (*3 on 3 Play Fast Small Area Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>.<\/strong> 2v2 net-front game with shooting boards (no goalie); defenders stay goal-side, cut lanes, play the body. Keeps tonight's focus (Shooting, rebounds &amp; net-front) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (1 on 1 Tips for Hockey Players: The Attack Position)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">Tomas Holmstrom SAG (net-front)<\/a>. Box from the dots to the circle tops; 3 O vs 2 D fight for net-front while a shooter fires 5 pucks (one per whistle); attackers tag up outside the box every whistle. Tonight's constraint: 5 shots per set, one per whistle; tips and rebound goals count double. <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *1v1 Race to the Puck → 3v3 Transition Drill*? The race and the 3v3 attack Liam's net; on a change of possession the new team must complete a pass to the coach at the blue line (that's the 'transition') before attacking the same net.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Offense 3 v 2 Cross-ice Hockey Game* → Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">2v2 Block Out Battle (Hockey Coach Vision)<\/a>. Coach shot off Liam's pads → forwards crash, D box out; next whistle forwards race the cones and a second puck starts 2v2 down low. Theme rule: D score a point for every rebound they clear to the corner. <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Back to Back Net Battle Hockey Game* → Liam covers BOTH back-to-back nets (<a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a> format) — or turn one net toward the boards and count only shots that hit a tire set in its mouth. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Screens and tips are the point, but it's one shot per rep and a reset whistle after every rebound — no point slappers into traffic.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-19", "title": "JJHC Varsity Practice — October 19, 2026", "focus": "3v3 / 4v3 small-area games (light 2-on-1 / zone-entry reads)", "time": "8:00 PM–9:00 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 19, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 19, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:00 PM–9:00 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>3v3 / 4v3 small-area games<\/strong> (light 2-on-1 / zone-entry reads)<\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, pinnies (3 colors), whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split tonight: ~15% skills / ~70% hockey sense (SAG) / ~15% systems — Frank's call: more kids involved, short shifts.<\/p>\n<p><strong>Board cue:<\/strong> Short shifts, support the puck, make the 2-on-1 — attack, pass, go to the net.<\/p>\n<p><strong>Teams:<\/strong> 5 groups of 3 (pinnies). 3v3 = 2 groups play, 1 waits on the bench line and jumps in on the whistle. 4v3 = add a 4th \"joker\" attacker who always plays offense. Shifts 30–40 s, change on the fly.<\/p>\n<p><strong>Goalie (Liam):<\/strong> In the net for every game at his end; second goalie (if present) takes the other end. Coach restarts only when he's set.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–5<\/td><td>A. Quick warm-up<\/td><td>Skills<\/td><\/tr><tr><td>5–17<\/td><td>B. Cross-ice 3v3<\/td><td>Hockey sense<\/td><\/tr><tr><td>17–29<\/td><td>C. 4v3 breakout game<\/td><td>Hockey sense / Systems<\/td><\/tr><tr><td>29–41<\/td><td>D. 3v3 Royal Road<\/td><td>Hockey sense<\/td><\/tr><tr><td>41–51<\/td><td>E. 3v3 Blast Off rush (zone entries)<\/td><td>Systems<\/td><\/tr><tr><td>51–60<\/td><td>F. Medicine Hat 3v3 finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–5)<\/h2>\n<p><strong>4 Dot Quick Warmup<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Lines at the four end-zone dots; skate, pass, and receive in motion around the dots, then a quick shot. Keep everyone moving — no lines longer than 3.<\/li><li>Cues: heads up, give a target, pass to space.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Hpq3DYJ1IeU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Hpq3DYJ1IeU<\/a> (HockeyShare)<\/li><\/ul>\n<h2>B. Cross-ice 3v3 (5–17)<\/h2>\n<p><strong>Cross-Ice 3v3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Zone split into cross-ice rinks (net at each boards side). 3v3, 30–40 s shifts on the whistle; waiting group jumps in, tired group off. Puck dead → coach spots a new one immediately.<\/li><li>Cues: always a support option, move after you pass, first to the puck wins.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=-Vxk7V3HXvA\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=-Vxk7V3HXvA<\/a> (Evolution Hockey)<\/li><\/ul>\n<h2>C. 4v3 breakout game (17–29)<\/h2>\n<p><strong>4v3 Breakout Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Coach dumps in; 4 attackers (3 + joker) break out vs 3 forecheckers, then attack back into the zone. Light theme: once over the line, look to create a 2-on-1 on the weak side.<\/li><li>Cues: talk early, use the extra man, attack the D's inside foot, drive the far post.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Rk5x2QYYmtk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Rk5x2QYYmtk<\/a> (Hockey Coach Vision)<\/li><\/ul>\n<h2>D. 3v3 Royal Road (29–41)<\/h2>\n<p><strong>3v3 Royal Road Small Area Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 in the zone; a goal counts only (or counts double) if the puck crosses the \"royal road\" (middle line through the slot) before the shot. Short shifts, change on the fly.<\/li><li>Cues: move the goalie side to side, find the open stick, D take away the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=KVALab3nGHI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=KVALab3nGHI<\/a> (HockeyShare)<\/li><\/ul>\n<h2>E. 3v3 Blast Off rush (41–51)<\/h2>\n<p><strong>3vs3 Blast Off<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3 attackers vs 3 backcheckers released from the neutral zone; attack the zone with speed — carry in, drive wide, or chip. Quick walkthrough (&lt;1 min), then live.<\/li><li>Cues: gain the line with speed, middle lane drives, late man fills high slot.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=xgZ_AAL1xdk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=xgZ_AAL1xdk<\/a> (The Coaches Site)<\/li><\/ul>\n<h2>F. Finisher + cool-down (51–60)<\/h2>\n<p><strong>Medicine Hat 3v3<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Compete 3v3 in the zone, 30 s shifts, team scores → stays on. Last 2 min easy skate/stretch.<\/li><li>Cues: win battles, protect the puck, shoot through traffic.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=BhwSW95zfao\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=BhwSW95zfao<\/a> (Hockey Coach Vision)<\/li><\/ul>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Same clock. Far net: pull to boards with tires on the goal line (tire targets) or skip and use one net.<\/em><\/p>\n<ul class=\"jjp-ul\"><li><strong>B (5–17):<\/strong> Cross-ice 3v3 at Liam's end only; the other cross-ice rink becomes <a href=\"https://www.youtube.com/watch?v=jgwiGSKJRcU\" target=\"_blank\" rel=\"noopener\">3v3 + Perimeter Options<\/a> on tire targets (perimeter outlet players keep everyone involved).<\/li><li><strong>C (17–29):<\/strong> 4v3 breakout attacks Liam's net only; on a whistle every ~25 s.<\/li><li><strong>D (29–41):<\/strong> Swap to <a href=\"https://www.youtube.com/watch?v=9EzHIoxO9Ow\" target=\"_blank\" rel=\"noopener\">3 v 3 Corner Hockey Game<\/a> — one net, battles start in the corner.<\/li><li><strong>E (41–51):<\/strong> If rushes bog down, run <a href=\"https://www.youtube.com/watch?v=-Te9RY3JcUY\" target=\"_blank\" rel=\"noopener\">Revolving 2 on 1<\/a> on Liam's net — continuous, light 2-on-1 theme.<\/li><li><strong>F (51–60):<\/strong> Medicine Hat 3v3 as written on one net.<\/li><\/ul>\n<p><strong>Liam's workload:<\/strong> ~40 of 60 min in net. Breaks: 0–3 own crease warm-up · 17–18 and 29–30 block transitions · 41–42 walkthrough on empty net · 58–60 cool-down. Tap-out rule: late on two lateral pushes → hops out 3–4 reps, skaters finish on tire target. No point bombs.<\/p>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Every skater touching the puck every shift (3v3/4v3, 5 groups of 3)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Shifts ≤ 40 s, transitions &lt; 60 s<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / battles present<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md` · Previous version: `2026-10-19.v2.md`_<\/p>"}, {"date": "2026-10-21", "title": "JJHC Varsity Practice — October 21, 2026", "focus": "Breakouts & D-zone exits", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 21, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 21, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Breakouts &amp; D-zone exits<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>3 on 3 Play Fast Small Area Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Classic IHS 3v3 play-fast SAG. Short shifts, continuous play, reward speed of support after a pass. Pair with the Hub Short of the same theme for a quick visual before the whistle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<h3>Station 2 — sag|goalie|skills<\/h3>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<h3>Station 3 — systems|contact<\/h3>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 v 1 Puck Retrieval to 2 v 1<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The 1 v 1 Puck Retrieval to 2 v 1 from Jason Lammers is a competitive battle drill to practice puck retrieval and forechecking concepts. The player retrieving the puck works to quickly collect the puck and pass to one of their teammates set up in the cones, which creates a 2 on 1. Setup Have a designated forechecker and defenseman on the half wall Set up two gates at the tops of the circles where the defenseman's teammates are The coach (or a player in line) flips a puck into the corner and both players must ska...<\/li><li>Video: <a href=\"https://vimeo.com/1155036397\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1155036397<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>2 v 3 Entry Offense vs. Breakout Transition<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop quick transition habits from defense to offense, with an emphasis on getting two players to the puck quickly and turning possession into an immediate breakout. The game also creates opportunities to work on re-entry rush offense as players transition between offensive and defensive roles. 2 rush with an additional backchecking player, creating a 2 vs.<\/li><li>Video: <a href=\"https://vimeo.com/1223950056\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223950056<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Breakouts &amp; D-zone exits<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*3 on 3 Play Fast Small Area Hockey Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">Neutral Zone Passing Station #1<\/a>.<\/strong> Partners skate a cone lane making one pass per gap, drop-pass switch at the end, pass back; switch sides every rep. Keeps tonight's focus (Breakouts &amp; D-zone exits) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *2 vs 2 Rebound Battle Hockey Game*.<\/strong> Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3 (*Perry Pearn Tracking Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (Breakouts &amp; D-zone exits) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (1 v 1 Puck Retrieval to 2 v 1)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Tonight's constraint: defenders' exit counts only after a D-to-F breakout pass (not a chip). <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>*Gates of Buffalo 3 vs. 3 Game* is already goalie-free, so keeping it as written is fine; use the one-net game above when you want Liam in the SAG block.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *2 v 3 Entry Offense vs. Breakout Transition* → The entry attacks Liam; the breakout team 'scores' by completing the exit pass to a coach at the red line. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Theme rule: D earn l\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|skills<\/h3>\n<p><strong>1 v 1 Use The Net<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 1 v 1 Use the Net from Jason Lammers is a great drill for all age levels that encourages offensive awareness and puck protection while the defenders work on angling and proper stick detail. The offensive team is trying to skate the puck through the gate while the defender is looking to strip the puck and score on net. Setup Setup a net and a gate as the goals.<\/li><li>Video: <a href=\"https://vimeo.com/1154377465\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1154377465<\/a><\/li><\/ul>\n<h3>Station 2 — sag|goalie|skills<\/h3>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<h3>Station 3 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Gates of Buffalo 3 vs. 3 Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 version of Gates of Buffalo. Teams score by completing passes through cone/tire gates while moving to open ice. Progress by shrinking gates or adding a defender.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=adueXqyfyNs\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=adueXqyfyNs<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>F1 forecheck &amp; tracking<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Partner Bump / Controlled Contact Confidence* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*1 v 1 Use The Net*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video< teral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-10-28", "title": "JJHC Varsity Practice — October 28, 2026", "focus": "Compete night — SAGs & battles", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — October 28, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>October 28, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Compete night — SAGs &amp; battles<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM sp
