ck spots, high attackers to defense.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=bU7eVMlN_dg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=bU7eVMlN_dg<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/swiss-4-vs-2-scoring-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/swiss-4-vs-2-scoring-game<\/a><\/li><\/ul>\n<h2>50. Pass-to-Score 2v2 / 2v1 Games (one goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Game 1: 2v2 between the blue line and a drawn line; a team can only score after passing to its own moving outlet player in a separate lane, and on a turnover the other team must hit its outlet first. Game 2: in a roped-off area a 2v1 (or 3v2) plays first-to-3 — tape-to-tape forehand passes score for the attackers, any touch scores for the defender — and the winners get a 2-on-0 (or partial breakaway) on the goalie. The goalie only sees the reward rush, so his reps stay high quality.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZkkZ5L1volI<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ZkkZ5L1volI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ZkkZ5L1volI<\/a><\/li><\/ul>\n<h2>51. Sticks In Lanes Game (Topher Scott)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Six attackers hold set spots around the zone (they can shift but not skate around) against two defenders in the middle; one net. The offense must pass through the middle of the ice two or more times before it can shoot; defenders keep sticks on the ice to block lanes and break up plays. Switch teams every rep and keep score. Harder: 4v2, 6v3, a smaller area, or 3 passes through the middle.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/639683746\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/639683746<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/sticks-lanes-game<\/a><\/li><\/ul>\n<h2>52. Power Play Scoring Competition (Wes Wolfe)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|one-goalie`<\/li><li><strong>Directions:<\/strong> Half-ice with one goalie: a 5-man power play enters off a coach pass and plays 60 seconds. It starts 5-on-0 for 15 s, then the coach whistles in one penalty killer every 15 s until it finishes 5-on-4. New puck immediately after a goal or freeze (vary rims and bouncing pucks); each unit gets three 60-s rounds and the unit with the most goals wins.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/1045818627\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1045818627<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/power-play-scoring-competition<\/a><\/li><\/ul>\n<h2>53. Horseshoe Regroup 2-on-1 (one goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> One-goalie regroup series: forwards exchange passes up the ice, the first forward drives for a shot and rebound while the second cuts across, takes a pass and moves it D-to-D through the defense. The last defenseman to touch it steps up over the blue line and gets back into position to defend the 2-on-1 into the same net. Cue tape-to-tape passes, driving the net, and the defender's gap after the step-up.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=wmAPVvs29WM<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/horseshoe-re-group-one-goalie-1-d-d-center\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/horseshoe-re-group-one-goalie-1-d-d-center<\/a><\/li><\/ul>\n<h2>54. Half Ice Shoot In Stride<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Two lines at the hash marks; the first player skates toward the red line and the opposite coach, calls for a puck, receives it with feet moving and shoots in stride before the cone, then stops at the net for a rebound. Alternate lines so the goalie sees one shot at a time from varied angles. Cue verbal and stick-target communication and shooting without stopping the feet.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/186050732\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/186050732<\/a> <em>(note: Vimeo file is embed-restricted (plays on the IHS page).)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/half-ice-shoot-stride\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/half-ice-shoot-stride<\/a><\/li><\/ul>\n<h2>55. The Gate Game (no goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Set three gates with heavy tires or cones; play 3v3 where a team scores by passing through a gate to a teammate on the other side. Whoever wins the puck is on offense — no net, no goalie. It forces players to spread out and move the puck fast; make it easier with more/wider gates or add a blue-line passer for a 4v3 feel.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=bHTPn2TsmFQ<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=bHTPn2TsmFQ\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=bHTPn2TsmFQ<\/a><\/li><\/ul>\n<h2>56. Nowak No-Goalie Transition Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|one-goalie`<\/li><li><strong>Directions:<\/strong> 1v1 in the middle with support players on each wall and a cone gate at center ice. The puck carrier regroups with the wall players to get the puck across to the other side: carry it across outside the cones = 1 point, between the cones = 2 points. Wall players may pass to the other player on the same wall but not across the ice. No goalie needed.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cc1xg7o1weo<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cc1xg7o1weo<\/a><\/li><\/ul>\n<h2>57. Gates Passing Small Area Game (partners)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up|one-goalie`<\/li><li><strong>Directions:<\/strong> Pairs share one puck inside a zone filled with cone gates. Pass to your partner through a gate, then both move to a new gate; you can't use the same gate twice in a row. Play for time and count gates completed per pair — heads up, move to open ice, communicate.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cq7SUFsoU0Q<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=cq7SUFsoU0Q<\/a><\/li><\/ul>\n<h2>58. 2vs2 Shooting Board Game (IIHF Skills4Life)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|contact|one-goalie`<\/li><li><strong>Directions:<\/strong> Teams wait above the faceoff circles; play 2v2 in front of the net area with a shooting board for each team at the top of the circle instead of a goalie. The coach on the blue line plays a puck in to start; change on the coach's signal. Defending focus: stay between opponent and goal, cut off passing lanes, play the body, apply stick pressure and be ready for the loose puck.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=tjsSHPu_eWU<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.iihf.com/en/coaching/18952/2vs2-shooting-board\" target=\"_blank\" rel=\"noopener\">https://www.iihf.com/en/coaching/18952/2vs2-shooting-board<\/a><\/li><\/ul>\n<h2>59. 1vs1 Three-Gate Game (IIHF Skills4Life)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `contact|skills|one-goalie`<\/li><li><strong>Directions:<\/strong> 1v1 inside a faceoff circle with three gates on the rim. The puck carrier tries to carry the puck out through any gate against a defender; on a turnover roles flip immediately. Teaches winning space with skating and deception, protecting the puck with body position, and readiness to regain possession. No goalie needed.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FRqZepqBTlI<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.iihf.com/en/coaching/19068/1vs1-three-gate-game\" target=\"_blank\" rel=\"noopener\">https://www.iihf.com/en/coaching/19068/1vs1-three-gate-game<\/a><\/li><\/ul>\n<h2>60. Neutral Zone Passing Station #1<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up|one-goalie`<\/li><li><strong>Directions:<\/strong> Three side-by-side passing lanes in the neutral zone (or two longer lanes for fewer players) so six players go at once. Partners make one pass between each set of cones; at the last cone they turn toward each other, switch sides with a drop pass to the partner's forehand, and pass between each cone on the way back. Switch sides every rep for forehand and backhand reps.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=LjDYuPzM6aY<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/neutral-zone-passing-station-1\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/neutral-zone-passing-station-1<\/a><\/li><\/ul>\n<h2>61. Transition Pivot Races<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Two teams line up on either side of the center circle; coach at center with pucks. On the whistle skate forward until both feet are inside the blue line, pivot backward to a cone, pivot forward around it and back into the zone, then pivot backward to the second cone at center, open up to forward and race to the puck the coach places near the blue line. Open the hips without crossing over; the race adds urgency to footwork.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=nsBIiBy02Mw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=nsBIiBy02Mw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/transition-pivot-hockey-races\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/hockey-drills/transition-pivot-hockey-races<\/a><\/li><\/ul>\n<h2>62. Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|sag|one-goalie`<\/li><li><strong>Directions:<\/strong> Version 1: two attackers stay behind a drawn line and pass through a faceoff circle (one defender inside with an active stick) for one-timers. Version 2: 2v1, 2v2 or 3v1 inside the circle using the circle edge or bumpers as the boundary. Version 3: monkey-in-the-middle with passers on the rim moving the puck quickly around 1–2 defenders inside (4v2). Versions 2–3 run with no goalie at all.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=RyLQIUL6Pek<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=RyLQIUL6Pek<\/a><\/li><\/ul>\n<h2>63. Tire Deke &amp; Shoot Station<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-goalie`<\/li><li><strong>Directions:<\/strong> Players skate with a puck, deke around a tire, and take a quick shot on goal in a continuous, high-rep station. On one-goalie nights shoot into a shooter tutor, an upside-down net, or tires/targets in an empty net so the goalie is free for another station. Cue head up on the approach and release in stride after the deke.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=K5fqjKMuk5k<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=K5fqjKMuk5k<\/a><\/li><\/ul>\n<h2>64. Upside-Down Net Target Shooting (no goalie)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-goalie`<\/li><li><strong>Directions:<\/strong> When there is no goalie for a station, lay a spare net on its back and push it against the standing net so only a narrow strip near the crossbar stays open. Players shoot and finish at the small target, which rewards elevating the puck under control and keeps shooting stations alive without a netminder. Pucks only — nobody stands in the crease.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ln-puBCmBvg<\/a> <em>(note: Needs a spare net from the rink.)<\/em><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ln-puBCmBvg<\/a><\/li><\/ul>\n<h2>65. Shooting Recovery Drill (2 shooters, goalie reset)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Goalie-specific drill from the OHL Coaches Conference clip: two shooters alternate — a low shot, the goalie recovers to his feet and sets on the next shooter — then progress to setting up on the rebound before moving to the next shooter. Short, controlled reps that build recovery and tracking habits. Ideal for the goalie's first 2–3 minutes of shots while skaters run a no-goalie station.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=64Aw6F2d9Ak<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=64Aw6F2d9Ak<\/a><\/li><\/ul>\n<h2>66. Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> USA Hockey coaching tip: give goalies a real warm-up at the start (goalie coach or an assistant) and choose team drills that train game situations, such as stopping/setting pucks behind the net in 2-on-1s. Pair it with USA Hockey's goaltending guidance: quality of reps over quantity, let the goalie reset and track the rebound between shots, and in high-volume drills let them hop out for a few reps — skaters shooting at an empty net for a few reps doesn't ruin the drill.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=g-GT6LRA9Nw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.usahockey.com/news_article/show/1352978\" target=\"_blank\" rel=\"noopener\">https://www.usahockey.com/news_article/show/1352978<\/a><\/li><\/ul>\n<h2>67. Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> The Coaches Site talk by Jeff Lerg: in a poll of 153 goalies most wanted a warm-up with a coach first and preferred small-area games later, after they had seen pucks. Goalie reps should include pre-shot movement, lateral plays and traffic like real games; when ice is limited, a coach can work the goalie in a corner while the team runs a no-goalie or one-goalie game. Goalies own their movement warm-up while skaters warm up.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ocit0BtG3Sw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ocit0BtG3Sw<\/a><\/li><\/ul>\n<h2>68. Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Advice for head coaches on not wearing goalies out in practice: drop rapid-fire drills, build a gap between shots so the goalie can track the rebound into the corner, and train in proportion to games (more zone-play looks, fewer endless line rushes and slappers from the top of the circles). Make warm-ups for the goalie, not the shooters, and occasionally track practice save percentage so every puck matters.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ywcijl1ak_c<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ywcijl1ak_c<\/a><\/li><\/ul>\n<h2>Focus additions: 2-on-1s, zone entries, one-timers (added 2026-10-19)<\/h2>\n<h2>69. One-Timer Partner Progression<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-timer|warm-up`<\/li><li><strong>Directions:<\/strong> Partners 15–20 ft apart; pass into the receiver's wheelhouse, receiver opens stick, lower hand down, takes ice behind the puck and one-times it back. Stationary → gliding → moving into the lane.<\/li><li><strong>Video:<\/strong> <a href=\"https://vimeo.com/216889294\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/216889294<\/a> <em>(IHS \"Taking A One-Timer\", Dwayne Blais; page: <a href=\"https://www.icehockeysystems.com/skill-development-videos/improve-one-timer\" target=\"_blank\" rel=\"noopener\">https://www.icehockeysystems.com/skill-development-videos/improve-one-timer<\/a>)<\/em><\/li><\/ul>\n<h2>70. 1v1 Wide Drive &amp; Delay Entry<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|zone-entry`<\/li><li><strong>Directions:<\/strong> Carry in vs a D at the blue line: drive wide with speed and cut around, or punch-turn/delay at the wall and hit the late support player in the high slot. Carry between the dots if the D backs off; never close your own gap.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=fYTtgap0FD4\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fYTtgap0FD4<\/a> <em>(Train 2.0 Hockey, \"How to Enter the Offensive Zone\")<\/em><\/li><\/ul>\n<h2>71. One Timer – Exchange Passes with Coach<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-timer`<\/li><li><strong>Directions:<\/strong> Swing through the slot, exchange passes with the coach on the half wall, curl to the weak-side flank/slot and one-time the return pass. Alternate sides.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=SITF8VB0uqg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=SITF8VB0uqg<\/a> <em>(Tom Molloy, \"T1-B2 - One Timer - Exchange Passes with Coach – Pro\")<\/em><\/li><\/ul>\n<h2>72. Chip n Chase Small Area Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|zone-entry`<\/li><li><strong>Directions:<\/strong> Possession team chips past the D into space and wins the race before attacking, or carries in with a clean lane. One-timer goals count double.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=mUFHMpRuXN0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=mUFHMpRuXN0<\/a> <em>(Evolution Hockey, \"Small area game - chip n chase\")<\/em><\/li><\/ul>\n<h2>73. Kick-Out / Middle Drive Rush Entries (Todd Woodcroft)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|zone-entry|2-on-1`<\/li><li><strong>Directions:<\/strong> Middle carrier drives the D back, kicks out wide and middle-drives the net; late man fills the dot lane a step behind. Wide player shoots, hits the driver, or feeds the late man. Live 2-on-1 → 3-on-2.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=IH5bL9IJBaU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IH5bL9IJBaU<\/a> <em>(The Coaches Site, \"Todd Woodcroft - Creating Offence From Zone Entries\")<\/em><\/li><\/ul>\n<h2>Focus additions: 3v3 / 4v3 small-area games (added 2026-10-19)<\/h2>\n<h2>74. 4 Dot Quick Warmup<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Hpq3DYJ1IeU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Hpq3DYJ1IeU<\/a> <em>(HockeyShare)<\/em><\/li><\/ul>\n<h2>75. Cross-Ice 3v3 Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=-Vxk7V3HXvA\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=-Vxk7V3HXvA<\/a> <em>(Evolution Hockey)<\/em><\/li><\/ul>\n<h2>76. 4v3 Breakout Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|4v3|breakout`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Rk5x2QYYmtk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Rk5x2QYYmtk<\/a> <em>(Hockey Coach Vision)<\/em><\/li><\/ul>\n<h2>77. 3v3 Royal Road<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=KVALab3nGHI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=KVALab3nGHI<\/a> <em>(HockeyShare)<\/em><\/li><\/ul>\n<h2>78. 3vs3 Blast Off (rush)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|3v3|zone-entry`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=xgZ_AAL1xdk\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=xgZ_AAL1xdk<\/a> <em>(The Coaches Site)<\/em><\/li><\/ul>\n<h2>79. Medicine Hat 3v3<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3|compete`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=BhwSW95zfao\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=BhwSW95zfao<\/a> <em>(Hockey Coach Vision)<\/em><\/li><\/ul>\n<h2>80. 3v3 + Perimeter Options<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3|one-goalie`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=jgwiGSKJRcU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=jgwiGSKJRcU<\/a> <em>(Vision Hockey Group)<\/em><\/li><\/ul>\n<h2>81. 3 v 3 Corner Hockey Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3|one-goalie`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=9EzHIoxO9Ow\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=9EzHIoxO9Ow<\/a> <em>(IceHockeySystems)<\/em><\/li><\/ul>\n<h2>82. Revolving 2 on 1<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|2-on-1|one-goalie`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=-Te9RY3JcUY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=-Te9RY3JcUY<\/a> <em>(Hockey Eastern Ontario)<\/em><\/li><\/ul>\n<h2>Focus additions: contact / puck protection (added 2026-11-02)<\/h2>\n<h2>83. Finders Keepers: A Fun Puck Protection Youth Hockey Drill<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|contact`<\/li><li><strong>Directions:<\/strong> Tight-area puck protection: carriers protect, chasers steal, 20–30 s reps. Cue body between man and puck, low center, hands away from pressure, eyes up.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=veI7-0o8n5o\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=veI7-0o8n5o<\/a><\/li><\/ul>"}, "built_at": "2026-11-09T19:11:24.040527-05:00"}, "jjstats": {"source": "GameSheet", "league": "Hudson Valley High School Hockey League - 2026/2027", "division": "Varsity", "team": "John Jay Patriots", "season_id": 15368, "division_id": 82827, "fetched": "2026-11-09T19:13:35-05:00", "source_url": "https://gamesheetstats.com/seasons/15368/standings?filter[division]=82827", "stale": false, "record": {"rank": 2, "gp": 3, "w": 1, "l": 1, "t": 1, "otl": 0, "pts": 3, "record": "1-1-1", "gf": 11, "ga": 13, "diff": -2, "streak": "Won 1", "pct": 0.5}, "standings": [{"rank": 1, "team": "Saugerties Mustangs", "gp": 3, "w": 3, "l": 0, "t": 0, "otl": 0, "record": "3-0-0", "pts": 6, "gf": 13, "ga": 5, "diff": 8, "streak": "Won 3"
