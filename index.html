 a portion of each practice, you will marvel at how your team begins to work together.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JlKKAFlVTLc\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JlKKAFlVTLc<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>Ramsay 3 V 3 Race<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li>Video: <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Oreo<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Oreo 3 V 3 Game from Jason Lammers is a continuous game that is competitive in nature as it forces the defense to work to pass the puck to the next players in line, while the offensive team is trying to score. Setup In this example, 3 players line up on the blue line. The players behind them are on the opposite team.<\/li><li>Video: <a href=\"https://vimeo.com/847506383\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/847506383<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Backcheck Small Area Game (tracking)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Two end zones and a small NZ. Attackers enter; once all four players are in the end zone, new defenders wait in NZ. Original attackers must backcheck as the other team attacks. Stress stops/starts and tracking all the way to the net.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>Swedish 2 vs 1 (Cross Ice)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This is a phenomenal drill in several ways. First, the concept of this drill can be used in many different areas of the ice. Secondly, it forces players to think 2 on 1's in tight spaces.<\/li><li>Video: <a href=\"https://vimeo.com/342763238\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/342763238<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Passing support &amp; give-and-go<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull the far-end net to the boards and set two tires on the goal line (tire targets). If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Pit Chaos Handling with Passes* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2: *Gates of Buffalo Small Area Passing Game<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *Ramsay 3 V 3 Race*.<\/strong> The race decides offense; offense attacks Liam. If the defenders win the puck they score by carrying it through a cone gate at the tops of the circles. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (1 on 1 Tips for Hockey Players: The Attack Position)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">2 vs 2 Game (With 1 Goalie &amp; Tire Nets)<\/a>. Cross-ice; one team shoots on Liam, the other scores by hitting 2 tires at the far end; flip ends every time the tire team scores. Tonight's constraint: a goal on Liam or a tire counts only after a completed give-and-go. <a href=\"https://www.icehockeysystems.com/hockey-drills/2-vs-2-game-1-goalie-tire-nets\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Oreo*? Keep it on Liam's net (offense scores, defense outlets to the next line); cap shifts at 30 s so the shot count stays sane.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\" rel=\"noopener\">Gates Passing Small Area Game (partners)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Backcheck Small Area Game (tracking)* → Attack only toward Liam's net; when the backcheckers win the puck they 'score' by passing to their partners waiting in the small neutral zone. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">3 v 2 Dot Jumper<\/a>. 2v2 race on a coach chip; each team's dot player is frozen until it gets a pass, then jumps in for a 3v2 on Liam's net. Theme rule: the dot player must return the puck (give-and-go) before anyone shoots. <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *Swedish 2 vs 1 (Cross Ice)* → Cross-ice with Liam in one net; the other net is replaced by two tires — a 'goal' there is hitting a tire after a pass. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only off a pass (catch-and-shoot or give-and-go); no rebound pile-ons after the whistle.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-12-14", "title": "JJHC Varsity Practice — December 14, 2026", "focus": "Shooting, rebounds & net-front", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — December 14, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>December 14, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Shooting, rebounds &amp; net-front<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Side Middle Side<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Side Middle Side passing drill from Darryl Belfry is from his practice plan, Parallel Teaching Structure - Passing Between Two Checks and One Touch Passing . This specific drill allows the whole team to warm up their skating, puck handling, passing and vision at the beginning of the practice. Setup Players line up at all 4 neutral zone face-off circles with pucks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=yeRHZLK2eek\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yeRHZLK2eek<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — sag|skills<\/h3>\n<p><strong>Corner Tires - Small Area Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Corner Tires is a small area game where the players score by hitting the tire with a puck. Set Up Place four tires on a rectangle as shown in the diagram. Make sure there is enough room from the tires to the edge so that there is room to play on all sides of the tires.<\/li><li>Video: <a href=\"https://vimeo.com/410680521\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/410680521<\/a><\/li><\/ul>\n<h3>Station 2 — sag|goalie|skills<\/h3>\n<p><strong>2 vs 2 Rebound Battle Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 battle off rebound looks. Coach or shooter creates a rebound; both pairs compete for second chances and net-front body position. Excellent goalie tracking volume.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=FtXlcBl3D2I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=FtXlcBl3D2I<\/a><\/li><\/ul>\n<h3>Station 3 — sag|systems<\/h3>\n<p><strong>Sully 2 on 2 Transition Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Sully 2 on 2 Transition Game from Michael Peca was recorded during the 2024-25 NHL Season. This is a high-tempo small-area game designed to develop quick transition skills, offensive movement, and defensive awareness. The drill encourages players to convert defense into offense efficiently while emphasizing strong defensive details and communication.<\/li><li>Video: <a href=\"https://vimeo.com/1067058133\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1067058133<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 on 1 Tips for Hockey Players: The Attack Position<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Skill clip on attack position for 1v1s—hands away, hip protection, attack the defender’s heels/hands. Use as a 30-second demo before 1v1 station work.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=Lexj0b5n7Ks\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Lexj0b5n7Ks<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Ramsay 3 V 3 Race<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li>Video: <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>What it means to be a good leader with Gold Medalist Hayley Scamurra<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Team talk / leadership clip. Use as a 60–90 second board or locker-room cue on compete, accountability, and how leaders set the tone for practice and games. Not an on-ice drill—pair with a compete block the same night.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/wwOIUxHVMTw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/wwOIUxHVMTw<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Shooting, rebounds &amp; net-front<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Side Middle Side* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Corner Tires - Small Area Game<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 2: *2 vs 2 Rebound Battle Hockey Game*.<\/strong> Run as written on Liam's net, but the coach controls the feed: one shot, play the rebound out, new puck only when Liam is set. Cap at ~12 shots per rotation. All three groups rotate through him, so keep reps short and controlled. Prefer more finishing looks? Swap in <a href=\"https://www.icehockeysystems.com/hockey-drills/half-ice-shoot-stride\" target=\"_blank\" rel=\"noopener\">Half Ice Shoot In Stride<\/a> — Two lines alternate: call for the coach's pass, shoot in stride before the cone, stop at the net for a rebound.<\/li><li><strong>Station 3 (*Sully 2 on 2 Transition Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>.<\/strong> 2v2 net-front game with shooting boards (no goalie); defenders stay goal-side, cut lanes, play the body. Keeps tonight's focus (Shooting, rebounds &amp; net-front) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (1 on 1 Tips for Hockey Players: The Attack Position)* — no net needed; unchanged.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">2v2 Block Out Battle (Hockey Coach Vision)<\/a>. Coach shot off Liam's pads → forwards crash, D box out; next whistle forwards race the cones and a second puck starts 2v2 down low. Tonight's constraint: the first rebound is the only coach shot — everything after is a live 2v2; D win = clear it to the corner. <a href=\"https://www.youtube.com/watch?v=NwE0EoveHBM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Ramsay 3 V 3 Race*? The race decides offense; offense attacks Liam. If the defenders win the puck they score by carrying it through a cone gate at the tops of the circles.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=K5fqjKMuk5k\" target=\"_blank\" rel=\"noopener\">Tire Deke &amp; Shoot Station<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *What it means to be a good leader with Gold Medalist Hayley Scamurra* needs no net — run it, then use the remaining minutes for <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">Tomas Holmstrom SAG (net-front)<\/a>: Box from the dots to the circle tops; 3 O vs 2 D fight for net-front while a shooter fires 5 pucks (one per whistle); attackers tag up outside the box every whistle. Theme rule: defenders get a point for every shot they block or every attacker they keep outside the box. <a href=\"https://www.icehockeysystems.com/hockey-drills/thomas-holmstrom-sag\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<p><strong>E. Finisher (54–60):<\/strong> *ADM F1 Forecheck Game (10U–18U)* → Cross-ice 3v3 to one net: the forecheck team attacks Liam; the retrieving team must skate behind Liam's net and then score by hitting a tire at the far end. The F1 pressure rule stays. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Screens and tips are the point, but it's one shot per rep and a reset whistle after every rebound — no point slappers into traffic.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-12-16", "title": "JJHC Varsity Practice — December 16, 2026", "focus": "NZ transition & play-fast habits", "time": "8:45 PM–9:45 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — December 16, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>December 16, 2026<\/td><\/tr><tr><td>Ice<\/td><td>8:45 PM–9:45 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>NZ transition &amp; play-fast habits<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Let the game teach. Short shifts. Compete, then reset.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Full compete in SAG. Communicate box-outs and rebound sides.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Partner Bump / Controlled Contact Confidence<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Size-matched pairs. Side-by-side knees bent: 3 strides → shoulder/hip bump → continue; both directions. Lead with shoulder not head, elbows in, stick on ice. Half-speed first, then add a puck and board-side bumps. Contact every practice.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — warm-up|systems<\/h3>\n<p><strong>Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<h3>Station 2 — sag|skills<\/h3>\n<p><strong>Hit The Tire Passing Game WIth No Goalie<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Hit The Tire Passing Game is a fun small area game that can be utilized when coaches want to work on passing and puck support concepts and/or there are no goalies available. Setup Place a tire on each of the face-off dots inside of a zone. The offensive team scores by hitting the tire in the opposite circle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=9LZa7cH-phw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=9LZa7cH-phw<\/a><\/li><\/ul>\n<h3>Station 3 — sag|systems<\/h3>\n<p><strong>Sully 2 on 2 Transition Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Sully 2 on 2 Transition Game from Michael Peca was recorded during the 2024-25 NHL Season. This is a high-tempo small-area game designed to develop quick transition skills, offensive movement, and defensive awareness. The drill encourages players to convert defense into offense efficiently while emphasizing strong defensive details and communication.<\/li><li>Video: <a href=\"https://vimeo.com/1067058133\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1067058133<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>1 v 1 Use The Net<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 1 v 1 Use the Net from Jason Lammers is a great drill for all age levels that encourages offensive awareness and puck protection while the defenders work on angling and proper stick detail. The offensive team is trying to skate the puck through the gate while the defender is looking to strip the puck and score on net. Setup Setup a net and a gate as the goals.<\/li><li>Video: <a href=\"https://vimeo.com/1154377465\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1154377465<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Ramsay 3 V 3 Race<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li>Video: <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Use The Net 2 on 1 Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2-on-1 that uses the net as a pick/screen and deception tool. Offense delays, uses the net to change sides, and looks for the late attacker; defender manages gap and stick while protecting the middle.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=e6ioQDMwYlw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=e6ioQDMwYlw<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>NZ transition &amp; play-fast habits<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Partner Bump / Controlled Contact Confidence* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2: *Hit The Tire Passing Game WIth No Goalie<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Liam's station — Station 3: *Sully 2 on 2 Transition Game*.<\/strong> One net: on a turnover the new offense must pass to the coach at the blue line (regroup) before attacking the same net. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (1 v 1 Use The Net)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">3 v 2 Dot Jumper<\/a>. 2v2 race on a coach chip; each team's dot player is frozen until it gets a pass, then jumps in for a 3v2 on Liam's net. Tonight's constraint: the dot player must be used within 3 s of a possession change. <a href=\"https://www.youtube.com/watch?v=xi51A57gxws\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Ramsay 3 V 3 Race*? The race decides offense; offense attacks Liam. If the defenders win the puck they score by carrying it through a cone gate at the tops of the circles.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Use The Net 2 on 1 Hockey Drill* → Every rush goes into Liam's end; alternate start corners and send one 2-on-1 every ~20 s so he can set and track the late attacker. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">Horseshoe Regroup 2-on-1 (one goalie)<\/a>. Shot + rebound, then a D-to-D regroup that turns into a 2-on-1 back into Liam's same net (the step-up D must recover his gap). Theme rule: D-to-D must be on the tape at full speed; no stopping to settle. <a href=\"https://www.youtube.com/watch?v=wmAPVvs29WM\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *ADM F1 Forecheck Game (10U–18U)* → Cross-ice 3v3 to one net: the forecheck team attacks Liam; the retrieving team must skate behind Liam's net and then score by hitting a tire at the far end. The F1 pressure rule stays. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Rush shots need a lateral move or delay first (pre-shot movement) and no more than one rush every ~20 s.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/a>. FutureProGoaltending: no rapid fire — leave a gap so he tracks every rebound; more zone looks, fewer slappers.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-12-21", "title": "JJHC Varsity Practice — December 21, 2026", "focus": "Breakouts & D-zone exits", "time": "7:15 PM–8:15 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — December 21, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>December 21, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:15 PM–8:15 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Breakouts &amp; D-zone exits<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Chicago 5 Puck Warm-Up Hockey Drill For Full Team<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team warm-up with five pucks moving. Players keep circulating, exchanging passes, and filling lanes so the ice stays alive. Great openers for touch, awareness, and tempo before stations.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=IsD9ZDgPO0k\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IsD9ZDgPO0k<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — systems|skills<\/h3>\n<p><strong>NZ Give and Go<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Develop off-puck movement and teach players to create give-and-go opportunities by moving immediately after a pass. The game encourages players to think ahead, recognize available space, and create new passing lanes to get the puck back. 2 game in the neutral zone .<\/li><li>Video: <a href=\"https://vimeo.com/1223931767\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1223931767<\/a><\/li><\/ul>\n<h3>Station 2 — sag|skills<\/h3>\n<p><strong>Ride The Bull<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective Ride The Bull is a small area game from Matt Thomas that works on developing puck protection and possession skills under pressure. Teams must protect the puck, use their teammates, and keep possession for 8 seconds. If they are able to accomplish this, they are awarded a 3rd teammate and each teams begin game play to try to score on the opposing teams net.<\/li><li>Video: <a href=\"https://vimeo.com/1228177222\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1228177222<\/a><\/li><\/ul>\n<h3>Station 3 — contact|systems<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Ramsay 3 V 3 Race<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li>Video: <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Breakouts &amp; D-zone exits<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Chicago 5 Puck Warm-Up Hockey Drill For Full Team* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1: *NZ Give and Go<\/strong>* — already goalie-free; run as written.<\/li><li><strong>Station 2 (*Ride The Bull*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (Breakouts &amp; D-zone exits) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 3: *Pioneer 2 V 2 Rush*.<\/strong> One direction only, into Liam's end; the next pair leaves when Liam is set, and the D come back up the wall as their rest. All three groups rotate through him, so keep reps short and controlled.<\/li><li>*Contact sprinkle (Perry Pearn Tracking Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Tonight's constraint: D/goalie point only counts if Liam set the puck or the D made a first pass to break it out. <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Ramsay 3 V 3 Race*? The race decides offense; offense attacks Liam. If the defenders win the puck they score by carrying it through a cone gate at the tops of the circles.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=LjDYuPzM6aY\" target=\"_blank\" rel=\"noopener\">Neutral Zone Passing Station #1<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Defensive Transition Passing Warm-Up Drill for Hockey Players* needs no net — run it, then use the remaining minutes for <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>: Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Theme rule: Liam starts every rep by stopping a rim and setting it for the D. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<p><strong>E. Finisher (54–60):<\/strong> *ADM F1 Forecheck Game (10U–18U)* → Cross-ice 3v3 to one net: the forecheck team attacks Liam; the retrieving team must skate behind Liam's net and then score by hitting a tire at the far end. The F1 pressure rule stays. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Count Liam's rim stops and puck-sets as reps; shots only at the end of an entry, never rapid-fire.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-12-23", "title": "JJHC Varsity Practice — December 23, 2026", "focus": "F1 forecheck & tracking", "time": "7:30 PM–8:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — December 23, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>December 23, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:30 PM–8:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>F1 forecheck &amp; tracking<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Concepts over choreography. What are we forcing the opponent to do?<\/p>\n<p><strong>Goalie (Liam):<\/strong> Read the system look (breakout rim, PP seam, PK shot lane). Talk early.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Ice Hockey Passing Drill - Rondo Progressions<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Rondo-style passing progressions (keep-away circles). Start with more attackers than defenders and shrink the outlet time. Cue one-touch options and body shape to receive.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=JW2BBDdR07I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=JW2BBDdR07I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — systems|contact<\/h3>\n<p><strong>Perry Pearn Tracking Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective The Perry Pearn Tracking Game from John Dean helps teams develop the habit of tracking through the puck at a 45-degree angle after possession is lost. The offensive team works together to prevent exits, extend zone time, and wear down defenders until pressure creates a turnover or scoring opportunity. 3 below an imaginary line connecting the tops of the circles.<\/li><li>Video: <a href=\"https://vimeo.com/1229638212\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1229638212<\/a><\/li><\/ul>\n<h3>Station 2 — sag|systems<\/h3>\n<p><strong>Sully 2 on 2 Transition Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Sully 2 on 2 Transition Game from Michael Peca was recorded during the 2024-25 NHL Season. This is a high-tempo small-area game designed to develop quick transition skills, offensive movement, and defensive awareness. The drill encourages players to convert defense into offense efficiently while emphasizing strong defensive details and communication.<\/li><li>Video: <a href=\"https://vimeo.com/1067058133\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1067058133<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>Ramsay 3 V 3 Race<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li>Video: <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Puck Race to Possession Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li>Video: <a href=\"https://vimeo.com/1210465912\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1210465912<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>Swedish 2 vs 1 (Cross Ice)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This is a phenomenal drill in several ways. First, the concept of this drill can be used in many different areas of the ice. Secondly, it forces players to think 2 on 1's in tight spaces.<\/li><li>Video: <a href=\"https://vimeo.com/342763238\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/342763238<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Offense 3 v 2 Cross-ice Hockey Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Cross-ice 3v2 that rewards quick east-west play and late support. Defense manages middle ice and sticks in lanes; offense looks for the third attacker.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=MhoajOVDeGU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MhoajOVDeGU<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>2 v 2 Angle Half-Ice Hockey Game with Defensive Reward<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Half-ice 2v2 with angling focus and a defensive reward rule (e.g., clear/score after a takeaway). Offense must move to support; defense angles first, then stick, then body. Continuous short shifts so everyone gets reps.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/PfpCL35u1tY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/PfpCL35u1tY<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>F1 forecheck &amp; tracking<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Ice Hockey Passing Drill - Rondo Progressions* as written — it doesn't need a goalie. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Perry Pearn Tracking Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>.<\/strong> 1v1 in a faceoff circle; carry the puck out through any of three gates, roles flip on a turnover. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Liam's station — Station 2: *Sully 2 on 2 Transition Game*.<\/strong> One net: on a turnover the new offense must pass to the coach at the blue line (regroup) before attacking the same net. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 3 (*Ramsay 3 V 3 Race*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">Nowak No-Goalie Transition Game<\/a>.<\/strong> 1v1 in the middle with wall support; carry it across outside the cones = 1 pt, through the middle gate = 2 pts; no goalie. Keeps tonight's focus (F1 forecheck &amp; tracking) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=cc1xg7o1weo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (Puck Race to Possession Game)*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 2 (≈15:00–16:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">3 on 2 Race to 5 (Cail MacLean)<\/a>. Below the circles, 3 F vs 2 D + Liam; F goal = 1, D skate it past the line = 1, Liam freeze = 1; first to 5. Tonight's constraint: the first forward to the dump is F1 and must angle the D to one side; goals off a forecheck turnover count double. <a href=\"https://www.icehockeysystems.com/hockey-drills/3-on-2-race-5\" target=\"_blank\" rel=\"noopener\">▶ video (IHS page)<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *Swedish 2 vs 1 (Cross Ice)*? Cross-ice with Liam in one net; the other net is replaced by two tires — a 'goal' there is hitting a tire after a pass.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=FRqZepqBTlI\" target=\"_blank\" rel=\"noopener\">1vs1 Three-Gate Game (IIHF Skills4Life)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Offense 3 v 2 Cross-ice Hockey Game* → Liam in one cross-ice net; the defenders' counterattack scores by hitting a tire where the second net was. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">3 vs 3 Split Zone Game<\/a>. Half a zone, 3 F vs 3 D on Liam's net; goal = 2 pts, D complete a pass and exit = 1 pt. Theme rule: forwards track back through the middle after every D exit. <a href=\"https://www.youtube.com/watch?v=Ynnmtmb-sLA\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *2 v 2 Angle Half-Ice Hockey Game with Defensive Reward* → Already half-ice to one net — keep it on Liam's net; the defensive reward stays a clear/outlet pass to the coach, so no second net is needed. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 2 (≈15:00–16:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Shots only after a forecheck turnover, from below the tops of the circles — quality over volume.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/a>. USA Hockey: warm the goalie first, quality over quantity, and let him hop out for a few reps in high-volume drills.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-12-28", "title": "JJHC Varsity Practice — December 28, 2026", "focus": "Compete night — SAGs & battles", "time": "7:00 PM–8:00 PM ET", "rink": "Ice Time Sports Complex, Newburgh NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — December 28, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>December 28, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:00 PM–8:00 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>Ice Time Sports Complex, Newburgh NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>Compete night — SAGs &amp; battles<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Let the game teach. Short shifts. Compete, then reset.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Full compete in SAG. Communicate box-outs and rebound sides.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Defensive Transition Passing Warm-Up Drill for Hockey Players<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Warm-up flow that links retrievals to first-pass exits. Skaters retrieve, hit a support target, and transition up ice without standing still. Great for D breakout habits.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=WIgVxM39sZE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=WIgVxM39sZE<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|systems<\/h3>\n<p><strong>Pioneer 2 V 2 Rush<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: The Pioneer 2 V 2 Rush from TJ Manastersky , the Head Coach of Brock University , practices attacking and defending the rush. It starts as a 1 V 1, and finishes as a 2 V 2. Setup On the 1st whistle, blue passes to red.<\/li><li>Video: <a href=\"https://vimeo.com/784999967\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/784999967<\/a><\/li><\/ul>\n<h3>Station 2 — sag|skills<\/h3>\n<p><strong>Swedish 2 vs 1 (Cross Ice)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This is a phenomenal drill in several ways. First, the concept of this drill can be used in many different areas of the ice. Secondly, it forces players to think 2 on 1's in tight spaces.<\/li><li>Video: <a href=\"https://vimeo.com/342763238\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/342763238<\/a><\/li><\/ul>\n<h3>Station 3 — sag|skills<\/h3>\n<p><strong>Ramsay 3 V 3 Race<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Jason Lammers describes the Ramsay 3 V 3 Race. This competitive small area game incorporates racing to the puck to determine which team is on offense. Setup Full ice setup with goalies in both nets.<\/li><li>Video: <a href=\"https://vimeo.com/861028778\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/861028778<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>USA Activation Drill (14U+)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Coach shoots a puck across; first two from each line race to it while the next two become activating D behind the nets. Possession side can attack or kick back to activating D for a 4v2. Run 30-second shifts; teach battle + activate.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>Bentley Wall Cycling Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This drill helps players work on their wall play and cycling under pressure. SETUP: This is a half ice drill, there should be a net in its usual spot on the goal line. There should be a line of players starting on one of the dots with a pile of pucks.<\/li><li>Video: <a href=\"https://vimeo.com/1104965949\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1104965949<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>3 v 3 Play Fast Game that Involves the WHOLE TEAM<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Full-team 3v3 play-fast small-area game. Keep all lines rotating with short shifts so nobody stands. Emphasize first touch, immediate support, and transition the instant possession changes.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/8loIyjdiosg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/8loIyjdiosg<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>Compete night — SAGs &amp; battles<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> Run *Defensive Transition Passing Warm-Up Drill for Hockey Players* as written — it doesn't need a goalie. Liam: 0–5 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 5–8 <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">Shooting Recovery Drill (2 shooters, goalie reset)<\/a> with two shooters pulled from the warm-up — low shot, recover to feet, set on the next shooter.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Liam's station — Station 1: *Pioneer 2 V 2 Rush*.<\/strong> One direction only, into Liam's end; the next pair leaves when Liam is set, and the D come back up the wall as their rest. All three groups rotate through him, so keep reps short and controlled.<\/li><li><strong>Station 2 (*Swedish 2 vs 1 (Cross Ice)*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>.<\/strong> Keep-away inside a faceoff circle (2v1 → 3v1 → 4v2 monkey-in-the-middle); no goalie needed. Keeps tonight's focus (Compete night — SAGs &amp; battles) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li><strong>Station 3 (*Ramsay 3 V 3 Race*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">2vs2 Shooting Board Game (IIHF Skills4Life)<\/a>.<\/strong> 2v2 net-front game with shooting boards (no goalie); defenders stay goal-side, cut lanes, play the body. Keeps tonight's focus (Compete night — SAGs &amp; battles) while Liam is at the net station. <a href=\"https://www.youtube.com/watch?v=tjsSHPu_eWU\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><li>*Contact sprinkle (ADM F1 Forecheck Game (10U–18U))*: finish by carrying through a tire gate instead of shooting unless the group is at Liam's net.<\/li><li><strong>Rest window:<\/strong> first 90 s of rotation 3 (≈22:00–23:30) — skaters at Liam's station finish on a tire in the net / <a href=\"https://www.youtube.com/watch?v=ln-puBCmBvg\" target=\"_blank\" rel=\"noopener\">upside-down net<\/a> while he takes water and resets.<\/li><\/ul>\n<p><strong>C. Small-area game (28–42), one net:<\/strong> <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">2v2 Tight Area in Corner (1 Goalie)<\/a>. Net angled in the corner, dividers box the area; 2v2, 45-s shifts, keep score. Tonight's constraint: ladder format — winners move up a court; 45-s shifts. <a href=\"https://www.youtube.com/watch?v=V97nywNK4lo\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/p>\n<ul class=\"jjp-ul\"><li>Prefer to keep *USA Activation Drill (14U+)*? The possession side attacks Liam (or kicks it back to the activating D); if the other side wins it, they score by hitting a tire at the far dot after a D-to-D pass.<\/li><li>Full sheet available? Split the 15: one group on Liam's net, the other at the far end in a goalie-free <a href=\"https://www.youtube.com/watch?v=RyLQIUL6Pek\" target=\"_blank\" rel=\"noopener\">Circle 2v1 / Keep-Away Series (1 or 0 goalies)<\/a>; swap at 35:00 (the swap is Liam's 60–90 s breather). Half sheet only: 30–40 s shifts into the one-net game.<\/li><\/ul>\n<p><strong>D. Systems (42–54), one net:<\/strong> *Bentley Wall Cycling Drill* → Already a one-net half-ice drill — keep it on Liam's net and alternate sides every rep so shots come from both walls. Keep the 5v0 walkthrough on an empty net so Liam's first live rep is the first real one.<\/p>\n<ul class=\"jjp-ul\"><li>Alternate if it bogs down: <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">Back to Back Nets – One Goalie (wall shooters)<\/a>. Nets back-to-back in the slot, Liam covers BOTH; 2v2 or 3v3, each team must pass to its wall shooter before attacking. Theme rule: cap shifts at 30 s; coach whistles any puck under Liam's pads. <a href=\"https://www.youtube.com/watch?v=J66B2W1FF4E\" target=\"_blank\" rel=\"noopener\">▶ video<\/a><\/li><\/ul>\n<p><strong>E. Finisher (54–60):<\/strong> *3 v 3 Play Fast Game that Involves the WHOLE TEAM* → Keep Liam's net live and put two tires on the far-end dots — the team attacking that way scores by hitting a tire. Flip ends at the halfway whistle. Last 2 min easy skate/stretch for everyone, Liam included.<\/p>\n<p><strong>Goalie workload (Liam):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Built-in breaks: 0–5/6 self-paced warm-up · 90 s in rotation 3 (≈22:00–23:30) · the 35:00 SAG swap · the 42–44 walkthrough on an empty net · 58–60 cool-down. Expect roughly 40–45 of 60 minutes in the net, so every block above is capped rather than continuous.<\/li><li>Shot quality: Battles run long — cap shifts at 30–40 s and blow the whistle on any puck under Liam's pads.<\/li><li>Tap-out rule: if his set time or rebound control slips (two soft goals in a row, late on lateral pushes), he hops out for 3–4 reps and skaters finish on the tire target, per USA Hockey's \"let the goalie hop out for a few reps\" guidance.<\/li><li>Coach reference: <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/a>. Jeff Lerg: goalie warm-up first, SAGs after he's seen pucks, and game-like pre-shot movement over volume.<\/li><\/ul>\n<hr>\n<h2>ADM self-check<\/h2>\n<ul class=\"jjp-ul\"><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Live decisions in almost every drill<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Body contact / angling present (even if not the theme)<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Liam got quality game-like looks<\/li><li class=\"jjp-check\"><span class=\"jjp-box\" aria-hidden=\"true\"><\/span>Transitions &lt; 60 seconds<\/li><\/ul>\n<p>_Library: `/workspace/coachy/jj_drill_library.md` · Template: `adm_practice_template.md`_<\/p>"}, {"date": "2026-12-30", "title": "JJHC Varsity Practice — December 30, 2026", "focus": "O-zone cycle & low-to-high", "time": "7:30 PM–8:30 PM ET", "rink": "McCann Ice Arena, Poughkeepsie NY", "shared_with": "Junior Varsity", "html": "<h1>JJHC Varsity Practice — December 30, 2026<\/h1>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>December 30, 2026<\/td><\/tr><tr><td>Ice<\/td><td>7:30 PM–8:30 PM ET (60 min)<\/td><\/tr><tr><td>Rink<\/td><td>McCann Ice Arena, Poughkeepsie NY<\/td><\/tr><tr><td>Shared with<\/td><td>Junior Varsity<\/td><\/tr><tr><td>Focus theme<\/td><td><strong>O-zone cycle &amp; low-to-high<\/strong><\/td><\/tr><tr><td>Roster<\/td><td>~15 skaters + G Liam<\/td><\/tr><tr><td>Equipment<\/td><td>pucks, cones, tires/pads, whistle<\/td><\/tr><\/tbody><\/table><\/div>\n<p>ADM split target: ~50% skills / 30% hockey sense (SAG) / 20% systems.<\/p>\n<p><strong>Board cue:<\/strong> Eyes up. Stick on ice. Move after every pass.<\/p>\n<p><strong>Goalie (Liam):<\/strong> Primary shot volume at Station 3 / scoring block. Call for catch-and-release quality.<\/p>\n<hr>\n<h2>Clock<\/h2>\n<div class=\"jjp-table-wrap\"><table class=\"jjp-table\"><thead><tr><th>Min<\/th><th>Block<\/th><th>ADM<\/th><\/tr><\/thead><tbody><tr><td>0–8<\/td><td>A. Warm-up + puck flow<\/td><td>Skills<\/td><\/tr><tr><td>8–28<\/td><td>B. Stations (3× ~6–7 min)<\/td><td>Skills / Contact<\/td><\/tr><tr><td>28–42<\/td><td>C. Small-area game<\/td><td>Hockey sense<\/td><\/tr><tr><td>42–54<\/td><td>D. Systems / team<\/td><td>Systems<\/td><\/tr><tr><td>54–60<\/td><td>E. Compete finisher + cool-down<\/td><td>Compete<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>A. Warm-up (0–8)<\/h2>\n<p><strong>Start Practice with 12 Player Small Area Game!<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Open practice with a 12-player SAG so everyone is active immediately. Use a half-zone or below-dots box, short shifts, and a simple scoring rule. Sets tempo and compete early.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=1vtqsH0Zw8I\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=1vtqsH0Zw8I<\/a><\/li><\/ul>\n<p>Flow: 0–2 easy laps with puck; 2–5 four-lane edges/C-cuts; 5–8 finish into the warm-up drill above with Liam seeing early shots.<\/p>\n<h2>B. Stations (8–28) — 3 groups, rotate ~6–7 min<\/h2>\n<h3>Station 1 — contact|skills<\/h3>\n<p><strong>Puck Race to Possession Game<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Objective New York Sirens forward Elle Hartje teaches players that winning a puck race isn't about being first to the puck—it's about winning the puck line. This competitive puck battle game develops body positioning on puck races, puck protection under pressure, and the ability to quickly transition into offense or defense on the second whistle. Setup Coach places a puck inside one of the faceoff circles.<\/li><li>Video: <a href=\"https://vimeo.com/1210465912\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1210465912<\/a><\/li><\/ul>\n<h3>Station 2 — systems|sag|contact<\/h3>\n<p><strong>ADM F1 Forecheck Game (10U–18U)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 3v3 cross-ice with a center-line marker. After a D-zone retrieval, the team must skate behind its net before attacking. On a turnover in the attack zone, at least one F1 must pressure the puck. Reward immediate attack off a steal.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=fDxI2eeEciY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fDxI2eeEciY<\/a><\/li><\/ul>\n<h3>Station 3 — skills|goalie<\/h3>\n<p><strong>Shooting Off The Pass - Offensive Zone Hockey Drill<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Offensive-zone timing drill: receive in motion and shoot in one action. Emphasize catch-and-release, weight transfer, and getting the puck through from tough angles. Feed Liam quality looks.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=eti1cwBR978\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=eti1cwBR978<\/a><\/li><\/ul>\n<h3>Contact sprinkle (inside Station 1 or 2 if time)<\/h3>\n<p><strong>Angle Behind Net + Stick Check<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: O carries behind the net; X angles to force outside/into the corner and finishes with stick lift/press or controlled rub—no open-ice charge. Switch roles every few reps. Cue: stay slightly behind until the carrier clears the net, then close.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/WvmJ8qkkOn8\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/WvmJ8qkkOn8<\/a><\/li><\/ul>\n<h2>C. Small-area game (28–42)<\/h2>\n<p><strong>USA Activation Drill (14U+)<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: Coach shoots a puck across; first two from each line race to it while the next two become activating D behind the nets. Possession side can attack or kick back to activating D for a 4v2. Run 30-second shifts; teach battle + activate.<\/li><li>Video: <a href=\"https://www.youtube.com/watch?v=DK_N5S36_oE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=DK_N5S36_oE<\/a><\/li><\/ul>\n<p>Rules: continuous 30–45s shifts; sticks on ice; coach sets one constraint matching tonight’s theme.<\/p>\n<h2>D. Systems / team (42–54)<\/h2>\n<p><strong>3 on 3 Add a D<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: This small-area game emphasizes encouraging your defense to join the rush while working on quick transitions, support, puck movement, and recognizing when to activate the extra player. Setup Shorten the rink by placing each net at the tops of the circles. Teams line up 3 on 3 in the neutral zone.<\/li><li>Video: <a href=\"https://vimeo.com/1137930754\" target=\"_blank\" rel=\"noopener\">https://vimeo.com/1137930754<\/a><\/li><\/ul>\n<p>Keep 5v0 walkthrough under 2 minutes, then live. Concepts &gt; choreography.<\/p>\n<h2>E. Finisher + cool-down (54–60)<\/h2>\n<p><strong>2 v 2 Transition Hockey Game from NHL Development Camp<\/strong><\/p>\n<ul class=\"jjp-ul\"><li>Directions: 2v2 transition game used in NHL development camp. Offense attacks; on turnover, both sides transition immediately. Cue quick feet, first pass under pressure, and D activating or recovering without watching.<\/li><li>Video: <a href=\"https://www.youtube.com/shorts/041oIbGpvvg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/shorts/041oIbGpvvg<\/a><\/li><\/ul>\n<p>Last 2 min: easy skate / stretch; repeat board cue once.<\/p>\n<hr>\n<h2>One-goalie option (only 1 netminder tonight)<\/h2>\n<p><em>Optional: use only if Liam is the lone netminder. Everything above stays the plan of record; these swaps keep the same clock and tonight's focus (<strong>O-zone cycle &amp; low-to-high<\/strong>). Extra gear: 4–6 tires/pads + cones. Far-end net: pull it off its pegs (or turn it to the boards) and use the far end for the goalie-free game/targets. If a second goalie shows up, ignore this section.<\/em><\/p>\n<p><strong>A. Warm-up (0–8):<\/strong> *Start Practice with 12 Player Small Area Game!*: Play it to tire targets (two tires per end) instead of nets — no goalie needed. Liam: 0–6 his own movement warm-up (stance, shuffles, T-pushes, butterfly slides) in his crease; 6–8 first shots — soft-to-firm from the hash marks, one at a time, no slappers.<\/p>\n<p><strong>B. Stations (8–28):<\/strong><\/p>\n<ul class=\"jjp-ul\"><li><strong>Station 1 (*Puck Race to Possession Game*) → no-goalie: <a href=\"https://www.youtube.com/watch?v=cq7SUFsoU0Q\" target=\"_blank\"
