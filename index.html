www.youtube.com/watch?v=ln-puBCmBvg<\/a><\/li><\/ul>\n<h2>65. Shooting Recovery Drill (2 shooters, goalie reset)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Goalie-specific drill from the OHL Coaches Conference clip: two shooters alternate — a low shot, the goalie recovers to his feet and sets on the next shooter — then progress to setting up on the rebound before moving to the next shooter. Short, controlled reps that build recovery and tracking habits. Ideal for the goalie's first 2–3 minutes of shots while skaters run a no-goalie station.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=64Aw6F2d9Ak<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=64Aw6F2d9Ak\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=64Aw6F2d9Ak<\/a><\/li><\/ul>\n<h2>66. Goalie Workload: Engage Goalies at Practice (USA Hockey)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> USA Hockey coaching tip: give goalies a real warm-up at the start (goalie coach or an assistant) and choose team drills that train game situations, such as stopping/setting pucks behind the net in 2-on-1s. Pair it with USA Hockey's goaltending guidance: quality of reps over quantity, let the goalie reset and track the rebound between shots, and in high-volume drills let them hop out for a few reps — skaters shooting at an empty net for a few reps doesn't ruin the drill.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=g-GT6LRA9Nw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=g-GT6LRA9Nw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.usahockey.com/news_article/show/1352978\" target=\"_blank\" rel=\"noopener\">https://www.usahockey.com/news_article/show/1352978<\/a><\/li><\/ul>\n<h2>67. Goalie Workload: Preparing Goalies for Practice (Jeff Lerg)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> The Coaches Site talk by Jeff Lerg: in a poll of 153 goalies most wanted a warm-up with a coach first and preferred small-area games later, after they had seen pucks. Goalie reps should include pre-shot movement, lateral plays and traffic like real games; when ice is limited, a coach can work the goalie in a corner while the team runs a no-goalie or one-goalie game. Goalies own their movement warm-up while skaters warm up.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ocit0BtG3Sw<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=ocit0BtG3Sw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=ocit0BtG3Sw<\/a><\/li><\/ul>\n<h2>68. Goalie Workload: Goalie-Friendly Practice (FutureProGoaltending)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `goalie|one-goalie`<\/li><li><strong>Directions:<\/strong> Advice for head coaches on not wearing goalies out in practice: drop rapid-fire drills, build a gap between shots so the goalie can track the rebound into the corner, and train in proportion to games (more zone-play looks, fewer endless line rushes and slappers from the top of the circles). Make warm-ups for the goalie, not the shooters, and occasionally track practice save percentage so every puck matters.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ywcijl1ak_c<\/a><\/li><li><strong>Source page:<\/strong> <a href=\"https://www.youtube.com/watch?v=Ywcijl1ak_c\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Ywcijl1ak_c<\/a><\/li><\/ul>\n<h2>Focus additions: 2-on-1s, zone entries, one-timers (added 2026-10-19)<\/h2>\n<h2>69. One-Timer Partner Progression<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-timer|warm-up`<\/li><li><strong>Directions:<\/strong> Partners 15–20 ft apart; pass into the receiver's wheelhouse, receiver opens stick, lower hand down, takes ice behind the puck and one-times it back. Stationary → gliding → moving into the lane.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=mVdWzATdtR4\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=mVdWzATdtR4<\/a><\/li><li><strong>Video note:<\/strong> YouTube equivalent — St. Louis Blues, \"Hockey How-To: One-Timers with Colton Parayko.\" NHL how-to on taking a one-timer. Not IHS/Dwayne Blais partner progression; use the written partner progression for the reps.<\/li><\/ul>\n<h2>70. 1v1 Wide Drive &amp; Delay Entry<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|zone-entry`<\/li><li><strong>Directions:<\/strong> Carry in vs a D at the blue line: drive wide with speed and cut around, or punch-turn/delay at the wall and hit the late support player in the high slot. Carry between the dots if the D backs off; never close your own gap.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=fYTtgap0FD4\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=fYTtgap0FD4<\/a> <em>(Train 2.0 Hockey, \"How to Enter the Offensive Zone\")<\/em><\/li><\/ul>\n<h2>71. One Timer – Exchange Passes with Coach<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|one-timer`<\/li><li><strong>Directions:<\/strong> Swing through the slot, exchange passes with the coach on the half wall, curl to the weak-side flank/slot and one-time the return pass. Alternate sides.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=SITF8VB0uqg\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=SITF8VB0uqg<\/a> <em>(Tom Molloy, \"T1-B2 - One Timer - Exchange Passes with Coach – Pro\")<\/em><\/li><\/ul>\n<h2>72. Chip n Chase Small Area Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|zone-entry`<\/li><li><strong>Directions:<\/strong> Possession team chips past the D into space and wins the race before attacking, or carries in with a clean lane. One-timer goals count double.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=mUFHMpRuXN0\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=mUFHMpRuXN0<\/a> <em>(Evolution Hockey, \"Small area game - chip n chase\")<\/em><\/li><\/ul>\n<h2>73. Kick-Out / Middle Drive Rush Entries (Todd Woodcroft)<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `systems|zone-entry|2-on-1`<\/li><li><strong>Directions:<\/strong> Middle carrier drives the D back, kicks out wide and middle-drives the net; late man fills the dot lane a step behind. Wide player shoots, hits the driver, or feeds the late man. Live 2-on-1 → 3-on-2.<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=IH5bL9IJBaU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=IH5bL9IJBaU<\/a> <em>(The Coaches Site, \"Todd Woodcroft - Creating Offence From Zone Entries\")<\/em><\/li><\/ul>\n<h2>Focus additions: 3v3 / 4v3 small-area games (added 2026-10-19)<\/h2>\n<h2>74. 4 Dot Quick Warmup<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `skills|warm-up`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=Hpq3DYJ1IeU\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=Hpq3DYJ1IeU<\/a> <em>(HockeyShare)<\/em><\/li><\/ul>\n<h2>75. Cross-Ice 3v3 Game<\/h2>\n<ul class=\"jjp-ul\"><li><strong>Tags:<\/strong> `sag|3v3`<\/li><li><strong>Video:<\/strong> <a href=\"https://www.youtube.com/watch?v=-Vxk7V3HXvA\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=-Vxk7V3HXvA<\/a> <em>(Evolution Hockey)<\/em><\/li><\/ul>\n<h2>76. 4v3 Breakout Game<\/h2>\n<ul class=\"
