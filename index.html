0:45 AM ET", "source": "X Following feed + fetched headlines", "top": {"title": "Today's Briefing", "dek": "From your X feed this Sunday: Starship is lining up for Monday, the Robotaxi fleet keeps growing, the Semi beats its own efficiency target, and hockey starts Tuesday.", "items": [{"section": "spacex", "tag": "SpaceX", "head": "Starship Flight 14: the Monday signs are stacking up", "x": ["JConcilus", "JoeTegtmeyer"], "text": "@JConcilus [spotted a presumed SpaceX support ship](https://x.com/JConcilus/status/2103861884218962298), Armada 86 03, parking off Chile inside the navigation-warning box, which he calls another sign of a possible Monday attempt. Joe Tegtmeyer [is heading to Starbase anyway](https://x.com/JoeTegtmeyer/status/2103860044072665165), even though he says the FAA launch and FCC Starlink V3 licenses weren't finalized and Ship 41 was destacked. He's hoping for the first Starship “Jellyfish.” Mashable says it's [a ~10-hour spaceflight attempt](https://news.google.com/rss/articles/CBMiekFVX3lxTE9MVGdJZlk0cU8xVldtMmxjLVFVRlBkNVlubkY4X2xGU2dSUGhnalYxX243aUJKa05XZl9vTEh6bXRBeFVjdno3WDF5MzdyNktQb1NnQzlzeXE2NHprWHZKVlIzellVR3hObjFlTlBjMHl4aEJZVTBtZkhB?oc=5)."}, {"section": "tesla", "tag": "Tesla", "head": "The Robotaxi fleet chart only goes up", "x": ["niccruzpatane", "ethanmckanna"], "text": "Nic Cruz Patane [lists official Texas DMV Robotaxi fleet counts](https://x.com/niccruzpatane/status/2103936661771972622): **42** on May 28, 314 on Aug. 31, and **476 (67 Cybercabs)** on Sept. 22. @ethanmckanna [estimates](https://x.com/ethanmckanna/status/2103935947045843136) roughly 70–100 are running at the same time in Austin. Nic also says Elon told CGTN that Cybercab [goes commercial in Florida, Nevada and other states soon](https://x.com/niccruzpatane/status/2103862355415466127), with California probably by mid-2027."}, {"section": "tesla", "tag": "Tesla Semi", "head": "Production Semi beats its own efficiency target", "x": "niccruzpatane", "text": "Per Nic, gle ships", "x": "GoogleAI", "text": "Google AI's week: [Gemini 3.8 Flash TTS, Gemini 3.8 Live with Live Avatar, and Notebook updates](https://x.com/GoogleAI/status/2103552111233343980). The blog shows how to [create your own voices](https://www.youtube.com/watch?v=FL6mI_Br-mc)."}, {"head": "Steven's AI takes", "x": "stevenmarkryan", "text": "Steven Mark Ryan shares a comparison saying AI scored [64 on the Mensa Norway test in 2023 vs. 151 in 2026](https://x.com/stevenmarkryan/status/2104021699322884515). He says privacy is the [biggest part of trusting AI agents](https://x.com/stevenmarkryan/status/2104019693992620174)."}]}, "finance": {"items": [{"head": "Friday close on your list", "text": "[TSLA](#/stock/TSLA) −1.54% to $372.11, [IBM](#/stock/IBM) −0.68%; [GOOGL](#/stock/GOOGL) +0.46%, [SPCX](#/stock/SPCX) +0.44%, [AMD](#/stock/AMD) +0.22%, [MAGS](#/stock/MAGS) +0.18%, [AMZN](#/stock/AMZN) +0.12%."}, {"head": "AI as your money manager", "x": "wholemars", "text": "Whole Mars says AI can [cancel duplicate subscriptions and help with investing](https://x.com/wholemars/status/2103941563835699423). The Grok Bot post he quotes says its Finance integration connects bank, card and investment accounts."}, {"head": "Vibes check", "x": "thejefflutz", "text": "Jeff Lutz quotes a [bipartisan WSJ poll](https://x.com/thejefflutz/status/2103857168273592504): 60% of voters say Trump's economic policies made the economy worse, and 65% rate the economy negatively. [MarketWatch](https://www.marketwatch.com/story/look-closer-and-wall-streets-rally-is-showing-cracks-94952048?mod=mw_rss_topstories) sees cracks under the record highs."}, {"head": "SPCX before liftoff", "text": "[SpaceX's president cashed out $52M](https://news.google.com/rss/articles/CBMioAFBVV95cUxQdHRCOHRJT29NZUUzbHYtc0E4YjVFNEowTEJjU3F5YjJfZm5JVUd4QUpKeXpqeDlGMXNrTW5sYUJYR0dHYnJTTkVzWVd5ck82RlBLTU5iamU5b3N6OGx5dU0tNS1DVmh0UWZEdFExeC1vNnAyWVFXSFAwZ1BuMFk2Ulc0czZMMjFXaExPcEFCMXRhQm9GWXdqb00tX2ZudXJL?oc=5) ahead of Mon
